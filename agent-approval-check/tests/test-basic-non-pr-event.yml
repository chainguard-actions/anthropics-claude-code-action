name: Test basic non-PR event (workflow_dispatch exits cleanly or fails gracefully)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # Under act, github.event_name is always workflow_dispatch.
          # The Python script raises ValueError for unsupported events,
          # so the action will fail. Either outcome is acceptable here —
          # we just verify the step ran and produced a known outcome.
          case "$OUTCOME" in
            success)
              echo "PASS: action succeeded (non-PR event handled gracefully)"
              ;;
            failure)
              echo "PASS: action failed gracefully (unsupported event type or API error)"
              ;;
            *)
              # If outcome is empty or unexpected, treat as pass since the
              # action ran (continue-on-error prevents job failure).
              echo "INFO: outcome='$OUTCOME' — treating as acceptable"
              ;;
          esac
