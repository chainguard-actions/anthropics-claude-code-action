name: Test basic PR event handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's composite step overrides GH_EVENT_NAME with github.event_name
      # (always "workflow_dispatch" under act), so we bypass event parsing entirely
      # by setting GH_PR_NUMBER directly. The script will then attempt GitHub API
      # calls for PR #1 on the sentinel repo, which will fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_PR_NUMBER: "1"
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (API calls fail gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (PR had no agent activity or API calls worked)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
