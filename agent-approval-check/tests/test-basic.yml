name: Test basic usage - PR event with default inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (fails gracefully - workflow_dispatch is unsupported or sentinel repo not resolvable)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: '$OUTCOME'"
          case "$OUTCOME" in
            success|failure|"")
              echo "PASS: action ran (outcome='$OUTCOME')"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
