name: Test basic usage (workflow_dispatch has no PR)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
      - name: Assert action ran (no-op success, or graceful failure on non-PR event / sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is not a PR event / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
