name: Test config_file overrides inline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: tests/fixtures/agent-identities.yaml
      - name: Assert action step ran (fails on unsupported workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for workflow_dispatch, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert shipped script loads identities from config file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: issue_comment
          REQUIRED_APPROVALS: "1"
          AGENT_EMAILS: ""
          AGENT_LOGINS: ""
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/.git/*' | head -1)
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          export CONFIG_FILE="$GITHUB_WORKSPACE/tests/fixtures/agent-identities.yaml"
          echo '{"issue": {"number": 7}}' > "$RUNNER_TEMP/event.json"
          export GH_EVENT_PATH="$RUNNER_TEMP/event.json"
          set +e
          python "$SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/out.log"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0 (config file supplies identities), got $RC"
            exit 1
          fi
          grep -q "fixture-agent@example.com" "$RUNNER_TEMP/out.log" || { echo "FAIL: config emails not loaded"; exit 1; }
          grep -q "fixture-bot\[bot\]" "$RUNNER_TEMP/out.log" || { echo "FAIL: config logins not loaded"; exit 1; }
          grep -q "rubber-stamp\[bot\]" "$RUNNER_TEMP/out.log" || { echo "FAIL: excluded approvers not loaded"; exit 1; }
          grep -q "not associated with a PR" "$RUNNER_TEMP/out.log" || { echo "FAIL: expected no-PR no-op"; exit 1; }
          echo "PASS"
