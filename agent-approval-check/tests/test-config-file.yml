name: Test config_file input loads agent identities
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pre-install Python dependencies so the composite action's pip install
      # step succeeds even if actions/setup-python has issues under act.
      - name: Pre-install Python dependencies
        run: pip install 'httpx==0.28.1' 'pyyaml==6.0.3' 'tenacity==9.1.4' || true

      # Create a valid agent-identities YAML config file
      - name: Create agent identities config file
        run: |
          cat > /tmp/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - claude@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/agent-identities.yaml

      # Under act the composite action always sees GH_EVENT_NAME=workflow_dispatch
      # (set from ${{ github.event_name }}), which is an unsupported event type.
      # The config_file is loaded before event resolution, so a failure here is
      # due to the unsupported event, not a config error. Accept either outcome.
      - name: Assert action ran (success or graceful failure)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action loaded config_file and exited 0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is not a supported event type)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
