name: Test config_file input is loaded correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload and config file
        run: |
          mkdir -p /tmp/fake-events /tmp/fake-config

          cat > /tmp/fake-events/pr_event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 7,
              "head": { "sha": "deadbeefcafe1234567890abcdef1234567890ab" },
              "base": { "ref": "main" }
            }
          }
          EOF

          cat > /tmp/fake-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - bot@example.com
            - noreply@anthropic.com
          agent_app_logins:
            - claude[bot]
            - my-custom-bot[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-events/pr_event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          config_file: /tmp/fake-config/agent-identities.yaml

      - name: Assert action ran (config loaded; API calls may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
