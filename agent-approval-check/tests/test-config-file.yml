name: Test config_file input overrides inline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent identities config file
        run: |
          cat > /tmp/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      # The config_file is loaded before event parsing. With a valid config file
      # providing agent identities, the action passes identity validation but then
      # fails on the unsupported workflow_dispatch event (the action's own env block
      # always sets GH_EVENT_NAME=workflow_dispatch under act). We accept failure as
      # graceful — the key test is that config_file is loaded without "No agent
      # identities configured" error (which would happen if config_file were ignored).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""
          config_file: /tmp/agent-identities.yaml

      - name: Assert action loaded config from file (not "no agent identities" error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action loaded config from file and exited cleanly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action loaded config from file and failed gracefully (workflow_dispatch unsupported)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
