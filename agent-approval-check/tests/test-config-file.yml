name: Test config_file input overrides inline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""
          config_file: ${{ github.workspace }}/tests/fixtures/agent-identities-valid.yaml

      - name: Assert action ran (config file loaded, fails at event resolution)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The config_file input points to a valid YAML file (committed fixture).
          # The composite action sets CONFIG_FILE from the input, so the Python
          # script loads the config file instead of using inline inputs.
          # The config file is valid, so config loading succeeds. However, the
          # composite action sets GH_EVENT_NAME=workflow_dispatch (from
          # github.event_name), which raises ValueError in resolve_pr_number.
          # So the action fails at event resolution, not at config loading.
          # Both success and failure are acceptable — the key is that the action
          # does NOT fail due to "No agent identities configured" (which would
          # happen if agent_emails="" and agent_logins="" were used without a
          # config_file, since the config_file overrides the inline inputs).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected — workflow_dispatch is unsupported, config file was loaded)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with valid config file"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
