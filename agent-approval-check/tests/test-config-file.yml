name: Test config_file input loads agent identities from YAML
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent-identities config file
        run: |
          mkdir -p /tmp/fake-config

          # Write a valid agent-identities YAML config file
          cat > /tmp/fake-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
      # action's step env). The script raises ValueError for unsupported events,
      # so the action fails. We verify it fails (not due to config error) and
      # that the config file is accepted without a YAML/validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: /tmp/fake-config/agent-identities.yaml
          required_approvals: "1"

      - name: Assert action ran (config file accepted, fails on unsupported event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — config file was accepted, event type unsupported under act"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
