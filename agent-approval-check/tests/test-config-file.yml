name: Test config_file input loads agent identities from YAML
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a valid agent-identities YAML config file
      - name: Create agent identities config file
        run: |
          mkdir -p /tmp/agent-config
          cat > /tmp/agent-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      # Create a fake issue_comment event on a plain issue (no PR) — exits 0 cleanly
      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 5,
              "title": "A plain issue"
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: /tmp/agent-config/agent-identities.yaml
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/fake-events/issue_comment.json

      - name: Assert action ran with config file (non-PR issue_comment is a no-op)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — config file loaded and non-PR issue_comment is a no-op"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
