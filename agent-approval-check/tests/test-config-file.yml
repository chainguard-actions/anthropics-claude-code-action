name: Test config_file input - loads YAML config without error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a valid agent-identities YAML config file
      - name: Create agent-identities config file
        run: |
          cat > /tmp/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      # The action loads the config file successfully, then fails because
      # workflow_dispatch is an unsupported event type. This verifies the
      # config file is parsed without error (not a config validation failure).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: "/tmp/agent-identities.yaml"
          required_approvals: "2"

      - name: Assert action failed due to unsupported event (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (unsupported event, not config error)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
