name: Test config_file input loads agent identities from YAML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a valid agent-identities config file
      - name: Create agent identities config file
        run: |
          mkdir -p /tmp/fake-config
          cat > /tmp/fake-config/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          config_file: /tmp/fake-config/agent-identities.yaml

      - name: Assert action ran (config_file accepted; workflow_dispatch is unsupported so failure is expected)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported; config was loaded)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config_file"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
