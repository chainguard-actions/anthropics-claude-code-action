name: Test config_file input loads agent identities from YAML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent-identities config file
        run: |
          mkdir -p /tmp/fake-config
          cat > /tmp/fake-config/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      # GH_PR_NUMBER bypasses event parsing (the action always sees
      # GH_EVENT_NAME=workflow_dispatch under the harness, which is unsupported).
      # Setting GH_PR_NUMBER causes the script to skip resolve_pr_number and
      # go directly to the GitHub API, which fails on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_PR_NUMBER: "7"
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          config_file: /tmp/fake-config/agent-identities.yaml

      - name: Assert action ran with config file (API call attempted, sentinel repo may cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
