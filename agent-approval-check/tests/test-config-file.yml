name: Test - Config file loading
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload and config file
        run: |
          mkdir -p /tmp/fake-event

          # Write a valid agent-identities config file
          cat > /tmp/fake-event/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      # NOTE: Under act the composite action always sets GH_EVENT_NAME from
      # github.event_name (= workflow_dispatch), which is an unsupported event.
      # A valid config file is loaded before event resolution, so the action
      # fails at event resolution (not at config loading). We accept failure as
      # a valid outcome because the action cannot be exercised with a
      # non-workflow_dispatch event under act.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/fake-event/agent-identities.yaml

      - name: Assert action loaded config file (success or graceful failure)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action loaded config file and exited 0 (no PR to process)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
