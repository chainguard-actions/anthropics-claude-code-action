name: Test custom config_file input is loaded correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload for an issue_comment on a plain issue (no PR)
      - name: Create fake event payload and config file
        run: |
          mkdir -p /tmp/test-events /tmp/test-config

          cat > /tmp/test-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 99,
              "title": "A plain issue (not a PR)",
              "pull_request": null
            },
            "comment": {
              "id": 2,
              "body": "Just a comment"
            }
          }
          EOF

          # Write a valid agent-identities config YAML
          cat > /tmp/test-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/test-events/issue_comment.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/test-config/agent-identities.yaml

      - name: Assert action ran with custom config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script should succeed (exit 0) because the issue_comment is on a
          # plain issue (no PR), so it logs "nothing to do" and returns.
          # Config file is valid so it should load without error.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action loaded custom config file and exited cleanly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo may have caused API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
