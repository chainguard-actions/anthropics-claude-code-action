name: Test config_file input loading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent identities config file
        run: |
          mkdir -p /tmp/test-config

          # Write a valid agent-identities YAML config
          cat > /tmp/test-config/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/test-config/agent-identities.yaml

      - name: Assert action loaded config file and ran (may fail on unsupported event under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.event_name is always workflow_dispatch (unsupported),
          # so the action will fail after loading the config. Both outcomes are valid.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action loaded config file and exited cleanly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action loaded config file but failed on unsupported event (expected under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
