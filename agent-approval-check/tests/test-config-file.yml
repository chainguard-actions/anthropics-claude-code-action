name: Test config_file input overrides inline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid config file
        run: |
          mkdir -p /tmp/test-config

          # Write a valid agent-identities YAML config file
          cat > /tmp/test-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/test-config/agent-identities.yaml

      - name: Assert action ran (config file loaded; fails gracefully on unsupported event or sentinel repo)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
