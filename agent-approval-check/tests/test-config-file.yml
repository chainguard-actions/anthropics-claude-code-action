name: Test config_file input loads valid YAML config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid agent-identities config file
        run: |
          mkdir -p /tmp/agent-config
          cat > /tmp/agent-config/agent-identities.yaml << 'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: /tmp/agent-config/agent-identities.yaml
        # The action loads the config file (CONFIG_FILE env var is set from
        # inputs.config_file). Config loading succeeds. Then GH_EVENT_NAME is
        # set to workflow_dispatch by the composite action (from github.event_name),
        # which is unsupported → raises ValueError → exits non-zero.

      - name: Assert action ran (config loaded, then failed on unsupported event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Config file is valid — action loads it successfully.
          # Then it fails because workflow_dispatch is an unsupported event.
          # This validates that the config_file input is wired correctly and
          # the action is fail-closed when it cannot resolve a PR number.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after loading config (unsupported event under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event under harness"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
