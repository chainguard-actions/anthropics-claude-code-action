name: Test config_file input loading
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GH_PR_NUMBER bypasses event parsing in the script (checked before
      # GH_EVENT_NAME). The composite action does not override this variable,
      # so it is inherited by the Python script. The API call will then fail
      # on the sentinel repo, which is the expected graceful-failure path.
      GH_PR_NUMBER: "5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent identities config file
        run: |
          mkdir -p /tmp/fake-config

          # Create a valid agent-identities YAML config file
          cat > /tmp/fake-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - noreply@anthropic.com
            - bot@example.com
          agent_app_logins:
            - claude[bot]
            - claude-code[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: /tmp/fake-config/agent-identities.yaml

      - name: Assert action ran (config file loaded; API call may fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config_file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable; config was loaded)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
