name: Test custom config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom agent-identities config file
        run: |
          mkdir -p /tmp/test-config
          cat > /tmp/test-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - bot@example.com
            - noreply@anthropic.com
          agent_app_logins:
            - my-custom-bot[bot]
            - claude[bot]
          excluded_approver_logins:
            - rubber-stamp-bot
          exempt_head_branches:
            - dependabot/*
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/test-config/agent-identities.yaml

      - name: Assert action ran with custom config
        if: always()
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action ran with custom config file (under act, failure is expected due to unsupported event)"
