name: Test config_file input loads agent identities
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent-identities config file
        run: |
          mkdir -p /tmp/gh-config
          cat > /tmp/gh-config/agent-identities.yaml << 'EOF'
          agent_emails:
            - bot@example.com
            - noreply@anthropic.com
          agent_app_logins:
            - my-bot[bot]
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          # GH_PR_NUMBER bypasses event parsing (action overrides GH_EVENT_NAME/PATH
          # from github context, which is always workflow_dispatch under act).
          GH_PR_NUMBER: "42"
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/gh-config/agent-identities.yaml

      - name: Assert action ran (config file loaded; API calls fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config_file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
