name: Test custom config file loading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # GH_PR_NUMBER bypasses event parsing so the script proceeds to config
    # loading and API calls (which fail on the sentinel repo).
    env:
      GH_PR_NUMBER: "99"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agent identities config file
        run: |
          mkdir -p /tmp/test-config
          cat > /tmp/test-config/agent-identities.yaml <<'EOF'
          agent_emails:
            - custom-bot@example.com
            - noreply@anthropic.com
          agent_app_logins:
            - custom-bot[bot]
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          exempt_path_prefixes: {}
          protected_bases: {}
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/test-config/agent-identities.yaml

      - name: Assert action ran (config file loaded, API calls fail on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should load the config file successfully, then fail
          # when making API calls against the sentinel repo (which doesn't exist).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
