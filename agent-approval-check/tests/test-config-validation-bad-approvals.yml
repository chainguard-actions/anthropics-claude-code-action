name: Test config validation - required_approvals less than 1
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # GH_PR_NUMBER bypasses event parsing (action does not override this env var).
    # The script validates REQUIRED_APPROVALS < 1 before making any API calls.
    env:
      GH_PR_NUMBER: "99"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          # required_approvals must be >= 1; 0 should cause a validation error
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with required_approvals=0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
