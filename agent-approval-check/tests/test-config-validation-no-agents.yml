name: Test config validation - no agent identities configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # GH_PR_NUMBER bypasses event parsing (action does not override this env var).
    # The script validates agent identities before making any API calls.
    env:
      GH_PR_NUMBER: "99"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          # Intentionally empty — no agent identities configured
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to missing agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no agent identities are configured"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with empty agent_emails and agent_logins"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
