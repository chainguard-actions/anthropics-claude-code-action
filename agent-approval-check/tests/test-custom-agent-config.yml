name: Test custom agent configuration via inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: "custom-bot@example.com,noreply@anthropic.com"
          agent_logins: "my-bot[bot],claude[bot]"
          excluded_approvers: "rubber-stamp-bot"
        env:
          # GH_PR_NUMBER bypasses event resolution (which would raise ValueError
          # for workflow_dispatch). The script will attempt GitHub API calls
          # against the sentinel repo and fail gracefully.
          GH_PR_NUMBER: "7"

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom agent config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
