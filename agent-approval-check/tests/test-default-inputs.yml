name: Test default inputs with workflow_dispatch (fail-closed behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # Uses all default inputs:
        #   required_approvals: "2"
        #   agent_emails: noreply@anthropic.com
        #   agent_logins: claude[bot],claude-code[bot]
        # No GH_PR_NUMBER set. The composite action sets GH_EVENT_NAME from
        # github.event_name (workflow_dispatch), which is unsupported →
        # raises ValueError → exits non-zero (fail-closed).

      - name: Assert action failed with default inputs (fail-closed on unsupported event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Default inputs are loaded correctly (agent_emails and agent_logins are set),
          # but the action then fails because workflow_dispatch is an unsupported event.
          # This validates that the action is fail-closed: it never silently succeeds
          # when it cannot determine a PR number.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with default inputs (fail-closed behavior)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event under harness"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
