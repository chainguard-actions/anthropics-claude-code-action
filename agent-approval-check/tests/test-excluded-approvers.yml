name: Test excluded_approvers input (bots whose approvals never count)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_PR_NUMBER: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          excluded_approvers: rubber-stamp-bot,auto-approve[bot]
      - name: Assert action ran (excluded_approvers parsed, then failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
