name: Test excluded_approvers input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          excluded_approvers: rubber-stamp-bot,auto-approve-bot

      - name: Assert action ran with excluded_approvers configured
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported; excluded_approvers was accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with excluded_approvers configured"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
