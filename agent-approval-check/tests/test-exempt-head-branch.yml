name: Test exempt head branch configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
          exempt_head_branches: "dependabot/*,renovate/*"
        env:
          # GH_PR_NUMBER bypasses event resolution (which would raise ValueError
          # for workflow_dispatch). The script will attempt GitHub API calls
          # against the sentinel repo and fail gracefully.
          GH_PR_NUMBER: "99"

      - name: Assert action ran (exempt branch config accepted or sentinel repo failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (branch exempted or no agent activity)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
