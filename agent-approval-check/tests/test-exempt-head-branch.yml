name: Test exempt_head_branches input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GH_PR_NUMBER bypasses event parsing (the action always sees
      # GH_EVENT_NAME=workflow_dispatch under the harness, which is unsupported).
      # Setting GH_PR_NUMBER causes the script to skip resolve_pr_number and
      # go directly to the GitHub API, which fails on the sentinel repo.
      # The exempt_head_branches check happens after the API call, so it
      # cannot be reached under the harness — we verify the action starts
      # correctly and fails gracefully on the sentinel repo.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_PR_NUMBER: "12"
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          exempt_head_branches: "dependabot/**,renovate/**"

      - name: Assert action ran (exempt branch check happens after API fetch, sentinel may cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
