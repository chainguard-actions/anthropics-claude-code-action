name: Test invalid config_file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture exists
        run: |
          test -f "${{ github.workspace }}/tests/fixtures/invalid-agent-identities.yaml" || { echo "FAIL: fixture missing"; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/invalid-agent-identities.yaml
      - name: Assert action rejected invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid config_file, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
