name: Test invalid config file causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file
        run: |
          mkdir -p /tmp/test-config

          # Write an invalid YAML config (agent_emails is a string, not a list)
          cat > /tmp/test-config/bad-config.yaml << 'EOF'
          agent_emails: "this-should-be-a-list-not-a-string"
          agent_app_logins:
            - claude[bot]
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/test-config/bad-config.yaml

      - name: Assert action failed due to invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when config file has invalid format"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when config file has invalid format (agent_emails must be a list)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
