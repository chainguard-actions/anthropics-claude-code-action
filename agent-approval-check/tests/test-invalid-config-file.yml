name: Test invalid config_file causes action to fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid agent-identities config file (wrong type for agent_emails)
        run: |
          cat > /tmp/bad-agent-identities.yaml <<'EOF'
          agent_emails: "this-should-be-a-list-not-a-string"
          agent_app_logins:
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - name: Create fake pull_request event payload
        run: |
          cat > /tmp/fake-pr-event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "head": {
                "sha": "abc123def456abc123def456abc123def456abc1"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-pr-event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/bad-agent-identities.yaml

      - name: Assert action failed due to invalid config file
        run: |
          # load_agent_config raises ValueError when agent_emails is not a list.
          # This happens before event resolution, so the action should fail
          # regardless of event type.
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when config_file has invalid structure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should fail when config_file has invalid agent_emails type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
