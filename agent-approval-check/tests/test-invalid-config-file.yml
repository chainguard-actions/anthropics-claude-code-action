name: Test invalid config_file causes action to fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create an invalid config file (agent_emails is a string, not a list)
      - name: Create invalid config file and event payload
        run: |
          mkdir -p /tmp/test-events /tmp/test-config

          cat > /tmp/test-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 10,
              "title": "A plain issue",
              "pull_request": null
            },
            "comment": {
              "id": 3,
              "body": "Hello"
            }
          }
          EOF

          # Write an invalid config YAML (agent_emails should be a list, not a string)
          cat > /tmp/test-config/bad-config.yaml <<'EOF'
          agent_emails: "noreply@anthropic.com"
          agent_app_logins:
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/test-events/issue_comment.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/test-config/bad-config.yaml

      - name: Assert action fails with invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script should fail (exit 1) because agent_emails is a string, not a list.
          # The load_agent_config function validates types and raises ValueError.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid config file"
          else
            echo "FAIL: expected failure for invalid config file, got '$OUTCOME'"
            exit 1
          fi
