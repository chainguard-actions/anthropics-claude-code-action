name: Test invalid config_file - bad YAML format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write an invalid config file: agent_emails is a string, not a list.
      # The script validates types and raises ValueError before event parsing.
      - name: Create invalid agent-identities config file
        run: |
          cat > /tmp/bad-agent-identities.yaml << 'EOF'
          agent_emails: "noreply@anthropic.com"
          agent_app_logins:
            - claude[bot]
          EOF

      # The config file has agent_emails as a string (not a list) — should fail validation
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: "/tmp/bad-agent-identities.yaml"
          required_approvals: "2"

      - name: Assert action failed with invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid config file format"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid config file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
