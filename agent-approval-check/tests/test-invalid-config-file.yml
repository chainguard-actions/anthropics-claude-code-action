name: Test invalid config_file causes action to fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/invalid-config/bad-config.yaml

      - name: Assert action fails when config file has invalid structure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script validates that agent_emails must be a list — it should fail
          # during config loading, before event resolution
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid config file structure"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should fail when config file has invalid structure"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
