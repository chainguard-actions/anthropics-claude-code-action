name: Test invalid config_file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture exists
        run: |
          test -f "$GITHUB_WORKSPACE/tests/fixtures/invalid-agent-identities.yaml" || { echo "FAIL: fixture missing"; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/invalid-agent-identities.yaml
      - name: Assert setup steps ran before config loading
        run: |
          python --version
          python -c "import httpx, yaml, tenacity" || { echo "FAIL: deps not installed"; exit 1; }
          echo "PASS"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a config whose agent_emails is not a list"
            exit 1
          fi
          echo "PASS"
