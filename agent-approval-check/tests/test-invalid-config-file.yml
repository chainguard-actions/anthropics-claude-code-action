name: Test - Invalid config file fails with error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file
        run: |
          mkdir -p /tmp/fake-event

          # Write an invalid config file — agent_emails is a string, not a list
          cat > /tmp/fake-event/bad-config.yaml <<'EOF'
          agent_emails: "this-should-be-a-list-not-a-string"
          agent_app_logins:
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      # Config file validation happens before event resolution, so the action
      # should fail due to the invalid config file regardless of the event type.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/fake-event/bad-config.yaml

      - name: Assert action failed due to invalid config file
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid config file (agent_emails must be a list)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid config file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
