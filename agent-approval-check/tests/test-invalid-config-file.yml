name: Test invalid config_file causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""
          config_file: ${{ github.workspace }}/tests/fixtures/agent-identities-invalid.yaml

      - name: Assert action failed due to invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The config_file input points to an invalid YAML file (committed fixture).
          # The file has agent_emails as a string instead of a list, which the
          # Python script validates and rejects with ValueError. This validation
          # happens before event resolution, so the action fails at config loading.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid config file (agent_emails not a list), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid config file"
