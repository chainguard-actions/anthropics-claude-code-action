name: Test invalid config_file causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid config file (YAML list instead of dict)
        run: |
          mkdir -p /tmp/fake-config
          # Write a YAML file that is a list, not a dict — should fail validation
          cat > /tmp/fake-config/bad-config.yaml <<'EOF'
          - this
          - is
          - a
          - list
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: /tmp/fake-config/bad-config.yaml

      - name: Assert action failed due to invalid config file format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The config file is a YAML list instead of a dict. The script
          # validates the config format and raises ValueError, causing exit 1.
          # This happens before any event parsing or API calls.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid config file (list instead of dict)"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
