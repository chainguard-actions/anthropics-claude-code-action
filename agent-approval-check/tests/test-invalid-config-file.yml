name: Test invalid config_file causes failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file
        run: |
          mkdir -p /tmp/fake-config

          # Create an invalid config file (agent_emails is a string, not a list)
          cat > /tmp/fake-config/bad-config.yaml <<'EOF'
          agent_emails: "this-should-be-a-list-not-a-string"
          agent_app_logins:
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: /tmp/fake-config/bad-config.yaml

      - name: Assert action failed (invalid config file format)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid config file"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid config file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
