name: Test invalid config_file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert fixture exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/invalid-agent-config.yaml" ]; then
            echo "FAIL: fixture missing"
            exit 1
          fi
          echo "PASS: fixture present"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/invalid-agent-config.yaml
      - name: Assert action failed on invalid config format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a non-mapping config file"
            exit 1
          fi
          echo "PASS"
