name: Test malformed config_file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write malformed agent-identities config
        run: |
          mkdir -p "$RUNNER_TEMP/aac"
          cat > "$RUNNER_TEMP/aac/agent-identities.yaml" <<'EOF'
          # agent_emails must be a list; a bare string is invalid
          agent_emails: noreply@anthropic.com
          agent_app_logins:
            - claude[bot]
          EOF
          cat "$RUNNER_TEMP/aac/agent-identities.yaml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ runner.temp }}/aac/agent-identities.yaml
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed config_file, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
