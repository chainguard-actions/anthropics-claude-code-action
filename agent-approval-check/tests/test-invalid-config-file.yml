name: Test invalid config_file is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/invalid-agent-identities.yaml
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed config_file, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action rejected malformed config_file"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify the failure reason with the shipped script
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: workflow_dispatch
          GH_EVENT_PATH: ${{ github.event_path }}
          REQUIRED_APPROVALS: "2"
          CONFIG_FILE: ${{ github.workspace }}/tests/fixtures/invalid-agent-identities.yaml
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/.git/*' | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "WARN: agent_approval_check.py not found; skipping reason check"
            exit 0
          fi
          python -m pip install -q 'httpx==0.28.1' 'pyyaml==6.0.3' 'tenacity==9.1.4'
          unset GH_PR_NUMBER
          set +e
          python "$SCRIPT" > /tmp/out.log 2>&1
          rc=$?
          set -e
          cat /tmp/out.log
          echo "exit code: $rc"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: expected non-zero exit"
            exit 1
          fi
          if ! grep -q "agent_emails must be a list" /tmp/out.log; then
            echo "FAIL: expected 'agent_emails must be a list' in output"
            exit 1
          fi
          echo "PASS"
