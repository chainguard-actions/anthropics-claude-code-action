name: Test invalid config_file causes error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload and invalid config file
        run: |
          mkdir -p /tmp/fake-events /tmp/fake-config

          cat > /tmp/fake-events/pr_event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 7,
              "head": { "sha": "deadbeefcafe1234567890abcdef1234567890ab" },
              "base": { "ref": "main" }
            }
          }
          EOF

          # Invalid config: agent_emails is a string, not a list
          cat > /tmp/fake-config/bad-config.yaml <<'EOF'
          agent_emails: "this-should-be-a-list-not-a-string"
          agent_app_logins:
            - claude[bot]
          excluded_approver_logins: []
          exempt_head_branches: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-events/pr_event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          config_file: /tmp/fake-config/bad-config.yaml

      - name: Assert action failed due to invalid config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid config file"
          else
            echo "FAIL: expected failure for invalid config file, got '$OUTCOME'"
            exit 1
          fi
