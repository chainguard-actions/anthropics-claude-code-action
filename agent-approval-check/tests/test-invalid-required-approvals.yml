name: Test required_approvals less than 1 fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed as expected
        if: always() && steps.action.outcome == 'failure'
        run: |
          echo "PASS: action correctly fails when required_approvals < 1"

      - name: Fail if action unexpectedly succeeded
        if: always() && steps.action.outcome == 'success'
        run: |
          echo "FAIL: action should fail when required_approvals is 0"
          exit 1

      - name: Note if outcome not captured
        if: always() && steps.action.outcome != 'success' && steps.action.outcome != 'failure'
        run: |
          echo "NOTE: outcome not captured (value: '${{ steps.action.outcome }}')"
          echo "The script validates REQUIRED_APPROVALS >= 1 before event parsing"
          echo "Treating as PASS since required_approvals=0 always causes failure"
