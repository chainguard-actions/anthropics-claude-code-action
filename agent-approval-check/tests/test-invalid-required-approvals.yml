name: Test invalid required_approvals (0) exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/pr.json <<'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "head": {
                "sha": "abc1234567890abc1234567890abc1234567890ab",
                "ref": "feature-branch"
              },
              "base": {
                "ref": "main"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-events/pr.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed (required_approvals must be >= 1)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when required_approvals=0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
