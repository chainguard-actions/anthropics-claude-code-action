name: Test required_approvals=0 is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for required_approvals=0"
            exit 1
          fi
          echo "PASS"
      - name: Assert Python and dependencies were set up by the action
        run: |
          python --version
          python --version 2>&1 | grep -q "Python 3.12" || { echo "FAIL: python 3.12 not active"; exit 1; }
          python -c "import httpx, yaml, tenacity; print(httpx.__version__, yaml.__version__)" || { echo "FAIL: deps missing"; exit 1; }
          echo "PASS"
