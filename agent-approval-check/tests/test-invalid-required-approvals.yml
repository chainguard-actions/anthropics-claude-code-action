name: Test invalid required_approvals - must be >= 1
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake PR event payload
      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "action": "opened",
            "number": 42,
            "pull_request": {
              "number": 42,
              "head": {
                "sha": "abc1234567890abcdef1234567890abcdef12345",
                "ref": "feature-branch"
              },
              "base": {
                "ref": "main"
              },
              "state": "open"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-event/event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action fails with invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # required_approvals=0 is invalid; the action must exit non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected required_approvals=0 but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
