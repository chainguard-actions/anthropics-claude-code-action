name: Test invalid required_approvals value fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "-1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # required_approvals=-1 is < 1, so the script should exit(1) before
          # making any API calls. Note: required_approvals=0 would NOT trigger
          # this because int("0") or 2 == 2 in Python (0 is falsy).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for required_approvals=-1"
          else
            echo "FAIL: expected failure for required_approvals=-1 but got '$OUTCOME'"
            exit 1
          fi
