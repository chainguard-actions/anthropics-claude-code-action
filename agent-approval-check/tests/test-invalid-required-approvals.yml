name: Test invalid required_approvals value causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # required_approvals must be >= 1; 0 should cause sys.exit(1)
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"
      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # REQUIRED_APPROVALS is read at module level from the env var set by action.yml.
          # main() checks REQUIRED_APPROVALS < 1 and calls sys.exit(1) before event parsing.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when required_approvals < 1"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for required_approvals=0 but got success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
