name: Test invalid required_approvals (0) exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot]

      - name: Assert action fails when required_approvals is 0
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required_approvals=0 (must be >= 1)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should exit 1 when required_approvals=0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
