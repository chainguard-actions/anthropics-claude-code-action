name: Test invalid required_approvals (must be >= 1)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload
      - name: Create push event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/push.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "test-owner/test-repo",
              "default_branch": "main"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: push
          GH_EVENT_PATH: /tmp/test-events/push.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action fails with invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # required_approvals=0 is invalid (must be >= 1)
          # The action should exit non-zero with an error message
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected required_approvals=0 but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
