name: Test invalid required_approvals value exits 1
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed due to invalid required_approvals
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: '$OUTCOME'"
          case "$OUTCOME" in
            failure)
              echo "PASS: action correctly rejected required_approvals=0"
              ;;
            "")
              # act may not set steps.action.outcome for composite actions
              echo "WARN: outcome is empty (act limitation) - cannot verify action failed"
              echo "INCONCLUSIVE: test cannot verify action failed under act"
              ;;
            success)
              echo "FAIL: expected failure for required_approvals=0, got success"
              exit 1
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
