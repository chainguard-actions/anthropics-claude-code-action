name: Test invalid required_approvals fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload (won't be reached due to config validation)
      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 1,
              "title": "A plain issue"
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/fake-events/issue_comment.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot]

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # required_approvals=0 is invalid (must be >= 1).
          # The script should exit non-zero with an error message.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for required_approvals=0"
          else
            echo "FAIL: expected failure for required_approvals=0, got '$OUTCOME'"
            exit 1
          fi
