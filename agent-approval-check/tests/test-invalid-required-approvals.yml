name: Test required_approvals less than 1 exits non-zero
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload (issue_comment on plain issue — would normally exit 0)
      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 7,
              "title": "A plain issue"
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/fake-events/issue_comment.json

      - name: Assert action failed due to invalid required_approvals value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required_approvals=0 (must be >= 1)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when required_approvals < 1"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
