name: Test required_approvals < 1 is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert shipped script rejects REQUIRED_APPROVALS=0 with a clear error
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: issue_comment
          REQUIRED_APPROVALS: "0"
          AGENT_EMAILS: noreply@anthropic.com
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/.git/*' | head -1)
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          echo '{"issue": {"number": 7}}' > "$RUNNER_TEMP/event.json"
          export GH_EVENT_PATH="$RUNNER_TEMP/event.json"
          set +e
          python "$SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/out.log"
          if [ "$RC" -ne 1 ]; then
            echo "FAIL: expected exit 1, got $RC"
            exit 1
          fi
          if ! grep -q "REQUIRED_APPROVALS must be >= 1" "$RUNNER_TEMP/out.log"; then
            echo "FAIL: expected validation error message"
            exit 1
          fi
          echo "PASS"
