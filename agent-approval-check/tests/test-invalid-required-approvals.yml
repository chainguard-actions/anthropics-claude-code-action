name: Test - Invalid required_approvals (< 1) fails with error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # REQUIRED_APPROVALS is validated before event resolution, so the action
      # should fail with "REQUIRED_APPROVALS must be >= 1" regardless of the
      # event type seen under act.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot]

      - name: Assert action failed due to invalid required_approvals
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with required_approvals=0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
