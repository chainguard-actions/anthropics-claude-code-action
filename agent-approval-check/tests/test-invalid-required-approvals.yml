name: Test invalid required_approvals value fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action fails when required_approvals is 0
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script exits 1 when REQUIRED_APPROVALS < 1.
          # REQUIRED_APPROVALS is read at module level:
          #   int(os.environ.get("REQUIRED_APPROVALS") or 2)
          # With REQUIRED_APPROVALS="0", "0" is truthy so int("0")=0.
          # The main() function then checks: if REQUIRED_APPROVALS < 1: sys.exit(1)
          # This happens before event resolution, so the action fails regardless
          # of the event type.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with required_approvals=0"
            exit 1
          fi
          echo "PASS: action failed as expected (outcome: $OUTCOME)"
