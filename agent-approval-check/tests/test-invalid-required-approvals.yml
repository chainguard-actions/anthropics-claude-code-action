name: Test invalid required_approvals validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed due to invalid required_approvals
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # REQUIRED_APPROVALS=0 is invalid (must be >= 1); the script exits 1
          # before reaching the event-parsing code.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for required_approvals=0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
