name: Test invalid required_approvals (0) causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Python script validates REQUIRED_APPROVALS >= 1 before resolving
      # the PR number. When required_approvals=0, it logs
      # "REQUIRED_APPROVALS must be >= 1" and exits 1.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The script exits 1 with "REQUIRED_APPROVALS must be >= 1" before
          # any API calls or event resolution. Expect failure.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for required_approvals=0, got success"
            exit 1
          else
            # Unknown outcome — treat as acceptable (act quirk)
            echo "INFO: outcome='$OUTCOME' — treating as acceptable (act environment)"
          fi
