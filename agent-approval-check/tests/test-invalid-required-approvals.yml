name: Test invalid required_approvals fails fast
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal event payload
      - name: Create fake event payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-tmp"
          echo '{}' > "$GITHUB_WORKSPACE/.test-tmp/event.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The composite action sets REQUIRED_APPROVALS=0 from the input.
          # The Python script checks REQUIRED_APPROVALS < 1 and exits 1.
          # This validation happens before event resolution, so the action
          # fails regardless of the event type.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when required_approvals=0, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected required_approvals=0"
