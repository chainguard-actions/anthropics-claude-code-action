name: Test invalid required_approvals exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # required_approvals=0 should cause the action to exit 1 immediately.
      # The validation (REQUIRED_APPROVALS < 1) happens before event parsing,
      # so no event payload is needed. GH_PR_NUMBER is set to avoid the
      # unsupported-event error path (though validation fires first).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        env:
          GH_PR_NUMBER: "1"

      - name: Assert action failed with invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for required_approvals=0, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected required_approvals=0"
