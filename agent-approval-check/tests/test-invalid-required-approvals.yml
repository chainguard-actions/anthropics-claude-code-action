name: Test invalid required_approvals fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed (required_approvals=0 is invalid)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for required_approvals=0, but action succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure)"
            exit 1
          fi
