name: Test invalid required_approvals (0) exits non-zero
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates REQUIRED_APPROVALS >= 1 and exits non-zero if not.
      # Under act, GH_EVENT_NAME=workflow_dispatch (unsupported) also causes
      # a non-zero exit. Either way, the action must fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed (required_approvals must be >= 1)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when required_approvals is 0"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
