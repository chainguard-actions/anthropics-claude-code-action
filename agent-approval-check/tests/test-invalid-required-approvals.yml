name: Test invalid required_approvals fails with config error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The script validates REQUIRED_APPROVALS >= 1 before reading the event.
      # Passing required_approvals=0 should cause sys.exit(1) immediately.
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed due to invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when required_approvals=0 (must be >= 1)"
            exit 1
          fi
          echo "PASS: action correctly failed with required_approvals=0"
