name: Test invalid required_approvals value fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action validates that required_approvals >= 1 in main() before any
      # event parsing. Passing 0 should cause sys.exit(1) immediately.
      # No GH_PR_NUMBER needed — validation fires before event resolution.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed on invalid required_approvals
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required_approvals=0"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for required_approvals=0 but got success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
