name: Test invalid required_approvals (0) fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # GH_PR_NUMBER bypasses event parsing (action overrides GH_EVENT_NAME/PATH
          # from github context, which is always workflow_dispatch under act).
          GH_PR_NUMBER: "1"
        with:
          github_token: ${{ github.token }}
          required_approvals: "0"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action fails when required_approvals is 0
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected required_approvals=0"
          else
            echo "FAIL: expected failure for required_approvals=0, got '$OUTCOME'"
            exit 1
          fi
