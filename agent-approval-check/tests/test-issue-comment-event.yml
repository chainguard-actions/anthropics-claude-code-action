name: Test issue_comment event (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake issue_comment event payload with /approve command
      - name: Create issue_comment event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "comment": {
              "id": 12345,
              "body": "/approve abc1234567890abcdef1234567890abcdef123456",
              "user": {
                "login": "human-approver"
              }
            },
            "issue": {
              "number": 55,
              "pull_request": {
                "url": "https://api.github.com/repos/test-owner/test-repo/pulls/55"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "default_branch": "main"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/test-events/issue_comment.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran for issue_comment event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt API calls against the sentinel repo.
          # Either success or graceful failure is acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (issue comment processed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
