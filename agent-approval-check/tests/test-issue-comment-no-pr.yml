name: Test issue_comment on plain issue exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.event_name is always workflow_dispatch, which the
      # action passes as GH_EVENT_NAME. The Python script raises ValueError for
      # unsupported events (including workflow_dispatch), so the action fails.
      # We cannot simulate issue_comment under act's workflow_dispatch trigger.
      # This test verifies the action fails gracefully (not with an unhandled
      # crash) when the event type is not one it handles.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed gracefully (unsupported event under act harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully for unsupported event (workflow_dispatch under act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (event was handled)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
