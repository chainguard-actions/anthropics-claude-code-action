name: Test issue_comment on non-PR exits cleanly
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.event_name is always workflow_dispatch. The composite
      # action hardcodes GH_EVENT_NAME from github.event_name, so we cannot
      # simulate an issue_comment event from outside. The script raises
      # ValueError("Unsupported event: workflow_dispatch") and exits non-zero.
      #
      # We verify the action fails gracefully (not a startup/install error) and
      # that the failure is due to the unsupported event, not a config error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed gracefully (unsupported event under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workflow_dispatch is unsupported — the script raises ValueError and exits 1.
          # This is the expected behavior under act (cannot simulate issue_comment).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (workflow_dispatch is unsupported)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
