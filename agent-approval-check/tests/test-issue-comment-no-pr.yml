name: Test issue_comment on plain issue (no PR)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The composite action sets GH_EVENT_NAME from github.event_name, which
      # under act is always "workflow_dispatch" — an unsupported event type.
      # The script raises ValueError and exits non-zero.
      # We verify the action exits non-zero when no supported PR event is present.
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action exited non-zero (no supported PR event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited non-zero — no supported PR event present"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have exited non-zero when no PR event is present"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
