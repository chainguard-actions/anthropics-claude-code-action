name: Test action fails gracefully for unsupported event (no PR context)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, the action hardcodes GH_EVENT_NAME=workflow_dispatch (from
      # github.event_name), which is an unsupported event. The script raises
      # ValueError and exits non-zero. This test verifies the action fails
      # gracefully (non-zero exit) when there is no PR context to process.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action exited non-zero (no PR context available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited non-zero — no PR context (unsupported event under harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — no PR to process"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
