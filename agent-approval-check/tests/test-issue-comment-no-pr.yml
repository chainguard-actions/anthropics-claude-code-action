name: Test issue_comment on plain issue exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake issue_comment event payload for a plain issue (no pull_request key)
      # Note: the composite action overrides GH_EVENT_NAME with github.event_name
      # (workflow_dispatch), so the Python script will raise ValueError for the
      # unsupported event. The action is expected to fail under the act harness.
      - name: Create fake event payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-tmp"
          cat > "$GITHUB_WORKSPACE/.test-tmp/event.json" <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 42,
              "title": "A plain issue",
              "body": "This is not a PR"
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (fails gracefully under act harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under the act harness, GH_EVENT_NAME is always 'workflow_dispatch'
          # (set by the composite action from github.event_name). The script
          # raises ValueError for unsupported events, so the action fails.
          # Both success and failure are acceptable outcomes here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected under act harness — workflow_dispatch is unsupported)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (no PR associated with this event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
