name: Test issue_comment on plain issue (no PR) — action exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action sets GH_EVENT_NAME from github.event_name (workflow_dispatch).
      # workflow_dispatch is not a supported event, so the action exits non-zero.
      # We verify the action exits cleanly (failure outcome, not a crash/hang).
      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action exited cleanly (failure or success, not hung/crashed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited cleanly with failure (unsupported event under workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly with success"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have hung or crashed"
            exit 1
          fi
