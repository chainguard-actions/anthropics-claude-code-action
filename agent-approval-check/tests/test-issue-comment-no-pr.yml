name: Test issue_comment on plain issue is a no-op
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "1"
      - name: Assert action step did not get skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ] && [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Run shipped script with an issue_comment event without a PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: issue_comment
          REQUIRED_APPROVALS: "1"
          AGENT_EMAILS: noreply@anthropic.com
          AGENT_LOGINS: claude[bot]
        run: |
          SCRIPT=$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/.git/*' | head -1)
          echo "script: $SCRIPT"
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          echo '{"issue": {"number": 7, "title": "plain issue"}, "comment": {"body": "hi"}}' > "$RUNNER_TEMP/event.json"
          export GH_EVENT_PATH="$RUNNER_TEMP/event.json"
          set +e
          python "$SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/out.log"
          if [ "$RC" -ne 0 ]; then
            echo "FAIL: expected exit 0, got $RC"
            exit 1
          fi
          if ! grep -q "not associated with a PR" "$RUNNER_TEMP/out.log"; then
            echo "FAIL: expected 'not associated with a PR' log message"
            exit 1
          fi
          echo "PASS"
