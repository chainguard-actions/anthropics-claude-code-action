name: Test issue_comment on non-PR exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload (no pull_request field)
        run: |
          cat > /tmp/fake-issue-comment-event.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 42,
              "title": "A plain issue, not a PR"
            },
            "comment": {
              "id": 1,
              "body": "Hello world"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/fake-issue-comment-event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (success or failure acceptable under act)
        run: |
          # Under act, github.event_name is always workflow_dispatch (set by the
          # action's own env block), which is an unsupported event type. The action
          # will fail with ValueError("Unsupported event: workflow_dispatch").
          # We accept both success (if issue_comment path is exercised) and failure
          # (unsupported event under act) as valid outcomes.
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — no PR associated with issue_comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected under act — workflow_dispatch is unsupported)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
