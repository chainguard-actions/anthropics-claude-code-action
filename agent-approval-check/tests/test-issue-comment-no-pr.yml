name: Test issue_comment on non-PR issue (no-op / graceful exit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: "issue_comment"
          GH_EVENT_PATH: "${{ github.workspace }}/tests/fixtures/issue-comment-event.json"
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action exited cleanly (no PR associated with issue comment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (issue_comment on plain issue — no PR to process)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or other expected error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
