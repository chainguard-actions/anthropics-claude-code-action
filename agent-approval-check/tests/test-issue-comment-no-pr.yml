name: Test issue_comment on plain issue exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # NOTE: Under act/workflow_dispatch, github.event_name is always "workflow_dispatch"
      # which is not a supported event. The action.yml overrides GH_EVENT_NAME with
      # github.event_name, so the script always sees "workflow_dispatch" and raises
      # ValueError. We verify the action fails gracefully (not with a crash).
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
          required_approvals: "2"
      - name: Assert action failed gracefully (unsupported event under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action always sees workflow_dispatch (unsupported) under act.
          # It raises ValueError and exits non-zero — this is expected behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully for unsupported event"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (event was handled)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
