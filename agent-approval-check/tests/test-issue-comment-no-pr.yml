name: Test issue_comment on plain issue (no PR) exits cleanly
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (event parsing or API call fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.event_name is always workflow_dispatch (set by the
          # action's own run step), which is an unsupported event type. The action
          # will fail gracefully. We accept both success and failure here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no PR to process)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
