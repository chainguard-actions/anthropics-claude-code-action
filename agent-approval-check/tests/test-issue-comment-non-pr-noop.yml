name: Test issue_comment on a plain issue is a no-op
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Run the action as shipped (installs Python + deps); under act the event is
      # workflow_dispatch, which the action rejects (fail-closed).
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "1"
      - name: Assert action fails closed under workflow_dispatch
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Verify issue_comment on non-PR issue exits 0 with nothing to do
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: example-owner/example-repo
          GH_EVENT_NAME: issue_comment
          AGENT_EMAILS: noreply@anthropic.com
          AGENT_LOGINS: claude[bot]
          REQUIRED_APPROVALS: "1"
        run: |
          SCRIPT="$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/.git/*' | head -n1)"
          echo "script: $SCRIPT"
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          echo '{"issue": {"number": 42}}' > "$RUNNER_TEMP/event.json"
          set +e
          GH_EVENT_PATH="$RUNNER_TEMP/event.json" python "$SCRIPT" > "$RUNNER_TEMP/out.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/out.log"
          echo "rc: $RC"
          if [ "$RC" != "0" ]; then
            echo "FAIL: expected exit 0"
            exit 1
          fi
          if ! grep -q "not associated with a PR" "$RUNNER_TEMP/out.log"; then
            echo "FAIL: expected 'not associated with a PR' in output"
            exit 1
          fi
          echo "PASS"
