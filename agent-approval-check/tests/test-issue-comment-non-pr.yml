name: Test no PR context (action fails gracefully when no PR number is resolvable)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
      - name: Assert action failed gracefully (no PR number resolvable from workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no PR context is available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no PR to process)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
