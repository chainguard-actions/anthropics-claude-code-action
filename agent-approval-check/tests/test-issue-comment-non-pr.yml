name: Test unsupported event with no PR number exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The composite action always sets GH_EVENT_NAME=${{ github.event_name }}
      # which is "workflow_dispatch" under act. workflow_dispatch is not a
      # supported event (only pull_request*, pull_request_review, issue_comment,
      # workflow_run are supported). When GH_PR_NUMBER is not set, the action
      # falls through to event parsing and raises ValueError for the unsupported
      # event — it should exit non-zero (fail-closed behavior).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed gracefully for unsupported event (no PR number)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when event is unsupported and no PR number set, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event with no PR number"
