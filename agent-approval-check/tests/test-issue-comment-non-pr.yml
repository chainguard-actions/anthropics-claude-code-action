name: Test issue_comment on non-PR exits gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload (plain issue, not a PR)
        run: |
          mkdir -p /tmp/gh-events
          cat > /tmp/gh-events/issue_comment.json << 'EOF'
          {
            "action": "created",
            "issue": {
              "number": 10,
              "title": "A plain issue (not a PR)"
            },
            "comment": {
              "id": 999,
              "body": "Hello world"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        # NOTE: GH_EVENT_NAME and GH_EVENT_PATH are overridden by the action's
        # own env block (set from github.event_name / github.event_path), so
        # the action always sees workflow_dispatch under act. The action will
        # fail because workflow_dispatch is unsupported. We accept that here.

      - name: Assert action ran (unsupported event under act, or no PR)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — no PR associated with this issue_comment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
