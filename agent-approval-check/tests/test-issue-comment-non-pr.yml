name: Test action with PR number set directly (bypasses event parsing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # GH_PR_NUMBER bypasses event parsing in the Python script.
          # The action will then attempt GraphQL API calls which fail
          # because GITHUB_REPOSITORY is the sentinel (non-existent repo).
          GH_PR_NUMBER: "1"
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran and failed gracefully (sentinel repo not resolvable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — sentinel repo is not resolvable via GitHub API"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
