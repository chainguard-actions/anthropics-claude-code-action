name: Test issue_comment on non-PR issue exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload (plain issue, no PR)
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 42,
              "title": "A plain issue",
              "body": "This is not a PR"
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action handled unsupported event gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always workflow_dispatch (set by the
          # composite action itself from github.event_name). The Python script
          # raises ValueError for unsupported events, so failure is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully for unsupported event (workflow_dispatch under act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
