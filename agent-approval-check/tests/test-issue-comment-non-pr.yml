name: Test no agent identities configured fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          # Explicitly pass empty agent identities to trigger the validation error.
          # The script exits 1 with "No agent identities configured" before
          # any event parsing or API calls.
          agent_emails: ""
          agent_logins: ""

      - name: Assert action fails when no agent identities are configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script validates that at least one agent identity is configured
          # and exits non-zero if both agent_emails and agent_logins are empty.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed — no agent identities configured"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no agent identities are configured"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
