name: Test issue_comment on plain issue (no PR) — graceful failure under workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (fails gracefully under workflow_dispatch — unsupported event)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act/workflow_dispatch the composite action always sets
          # GH_EVENT_NAME=workflow_dispatch, which the Python script does not
          # support. The script raises ValueError and exits non-zero.
          # We verify the action fails gracefully (not with a panic or
          # infrastructure error).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (event was handled)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
