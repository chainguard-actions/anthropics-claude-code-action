name: Test issue_comment on non-PR exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran without crashing unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
          # composite action from github.event_name). The script raises ValueError
          # for unsupported events, so the action always fails here.
          # We cannot simulate an issue_comment event because the composite action
          # hardcodes GH_EVENT_NAME from github.event_name.
          # Accept failure as expected; verify the outcome is not something
          # completely unexpected (e.g. cancelled).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event under act is expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (event resolved cleanly)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
