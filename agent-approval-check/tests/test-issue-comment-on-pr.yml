name: Test issue_comment event on a PR
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # GH_PR_NUMBER bypasses event parsing (action hardcodes GH_EVENT_NAME=workflow_dispatch
    # which is unsupported). The script will attempt to process PR #55 via the GitHub API,
    # which will fail on the sentinel repo — that is the expected graceful failure.
    env:
      GH_PR_NUMBER: "55"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (API calls fail on sentinel repo, or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
