name: Test missing agent identities exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event payload
        run: |
          cat > /tmp/fake-pr-event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "head": {
                "sha": "abc123def456abc123def456abc123def456abc1"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-pr-event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to missing agent identities
        run: |
          # Empty agent_emails and agent_logins are validated before event resolution:
          # "No agent identities configured" → sys.exit(1)
          # The action should fail regardless of event type.
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no agent identities configured"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should fail when agent_emails and agent_logins are both empty"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
