name: Test missing agent identities exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          # Explicitly set empty agent identities — both emails and logins are blank
          agent_emails: ""
          agent_logins: ""

      - name: Assert action fails when no agent identities are configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script checks: if not config.agent_emails and not config.agent_app_logins: sys.exit(1)
          # This check happens in main() before any event parsing.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no agent identities configured"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no agent identities are configured"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
