name: Test missing agent identities causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Both agent_emails and agent_logins are empty — should fail before event parsing
          agent_emails: ""
          agent_logins: ""
      - name: Assert action failed due to missing agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # main() checks: if not config.agent_emails and not config.agent_app_logins → sys.exit(1)
          # This validation happens before event parsing, so it fails regardless of event type.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no agent identities are configured"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for missing agent identities but got success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
