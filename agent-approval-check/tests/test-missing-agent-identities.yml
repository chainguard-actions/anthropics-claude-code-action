name: Test missing agent identities fails with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action fails when no agent identities are configured
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script exits 1 when both agent_emails and agent_logins are empty:
          #   if not config.agent_emails and not config.agent_app_logins: sys.exit(1)
          # This check happens before event resolution, so the action fails
          # regardless of the event type.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with no agent identities"
            exit 1
          fi
          echo "PASS: action failed as expected (outcome: $OUTCOME)"
