name: Test no agent identities configured fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to no agent identities configured
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when agent_emails and agent_logins are both empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure when no agent identities configured, but action succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
