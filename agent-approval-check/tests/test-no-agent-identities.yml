name: Test empty agent identities is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent_emails: ""
          agent_logins: ""
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no agent identities are configured, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert dependencies were installed before the check ran
        run: |
          python -c 'from importlib.metadata import version; print(version("httpx"))' | tee /tmp/httpx-ver
          if [ "$(cat /tmp/httpx-ver)" != "0.28.1" ]; then
            echo "FAIL: expected httpx 0.28.1"
            exit 1
          fi
          echo "PASS"
