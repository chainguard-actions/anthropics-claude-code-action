name: Test empty agent identities causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to empty agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script validates that at least one agent identity is configured
          # before any event parsing or API calls. Empty agent_emails and
          # agent_logins cause sys.exit(1).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no agent identities configured"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
