name: Test missing agent identities fails fast
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal event payload
      - name: Create fake event payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-tmp"
          echo '{}' > "$GITHUB_WORKSPACE/.test-tmp/event.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to missing agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The composite action sets AGENT_EMAILS="" and AGENT_LOGINS="" from inputs.
          # The Python script checks that at least one agent identity is configured
          # and exits 1 if both are empty. This validation happens before event
          # resolution, so the action fails regardless of the event type.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no agent identities configured, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected empty agent_emails and agent_logins"
