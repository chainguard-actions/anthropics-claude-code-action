name: Test missing agent identities fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to missing agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script exits(1) with "No agent identities configured" before
          # making any API calls or parsing the event. This is a pure config
          # validation failure that works regardless of event type.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no agent identities configured"
          else
            echo "FAIL: expected failure for empty agent identities but got '$OUTCOME'"
            exit 1
          fi
