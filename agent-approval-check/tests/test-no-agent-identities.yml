name: Test missing agent identities exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload for an issue_comment on a plain issue (no PR)
      - name: Create fake issue_comment event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/issue_comment.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 42,
              "title": "A plain issue",
              "pull_request": null
            },
            "comment": {
              "id": 1,
              "body": "Hello"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: issue_comment
          GH_EVENT_PATH: /tmp/test-events/issue_comment.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action fails when no agent identities are configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script should fail (exit 1) because both agent_emails and agent_logins are empty
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected empty agent identities"
          else
            echo "FAIL: expected failure for empty agent identities, got '$OUTCOME'"
            exit 1
          fi
