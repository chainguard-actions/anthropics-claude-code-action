name: Test no agent identities configured - should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Both agent_emails and agent_logins are empty strings.
      # The composite action sets AGENT_EMAILS and AGENT_LOGINS from these inputs.
      # The script checks for empty agent identities before event parsing and exits 1.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed with no agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with no agent identities"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with no agent identities"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
