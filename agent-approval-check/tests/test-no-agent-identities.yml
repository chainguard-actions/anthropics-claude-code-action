name: Test empty agent identities exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to no agent identities configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script validates that at least one agent identity is configured
          # before event parsing. With both agent_emails and agent_logins empty,
          # it must exit non-zero.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when agent_emails and agent_logins are both empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected empty agent identities"
