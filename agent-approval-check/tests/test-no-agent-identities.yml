name: Test no agent identities - action fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake PR event payload
      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "action": "opened",
            "number": 7,
            "pull_request": {
              "number": 7,
              "head": {
                "sha": "abc1234567890abcdef1234567890abcdef12345",
                "ref": "feature-branch"
              },
              "base": {
                "ref": "main"
              },
              "state": "open"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-event/event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action fails when no agent identities are configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With empty agent_emails and agent_logins, the action must exit non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected empty agent identities"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have rejected empty agent identities but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
