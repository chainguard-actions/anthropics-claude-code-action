name: Test - No agent identities configured fails with error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Agent identity validation happens before event resolution, so the action
      # should fail with "No agent identities configured" regardless of the
      # event type seen under act.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          # Explicitly set both to empty to trigger the validation error
          agent_emails: " "
          agent_logins: " "

      - name: Assert action failed due to missing agent identities
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected empty agent identities"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with no agent identities configured"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
