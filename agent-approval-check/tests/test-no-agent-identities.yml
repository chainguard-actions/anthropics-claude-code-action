name: Test missing agent identities fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python dependencies
        run: pip install 'httpx==0.28.1' 'pyyaml==6.0.3' 'tenacity==9.1.4' --quiet || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed for missing agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Both agent_emails and agent_logins are empty — the script exits with code 1
          # before any event/API processing.
          if [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action correctly failed when no agent identities configured (outcome: ${OUTCOME:-empty})"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when agent_emails and agent_logins are both empty"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
