name: Test empty agent identities fails with config error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The script validates that at least one agent identity is configured
      # before reading the event. Passing empty agent_emails and agent_logins
      # should cause sys.exit(1) immediately.
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""

      - name: Assert action failed due to no agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when agent_emails and agent_logins are both empty"
            exit 1
          fi
          echo "PASS: action correctly failed with no agent identities configured"
