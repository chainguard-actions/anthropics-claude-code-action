name: Test no agent identities configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent_emails: ""
          agent_logins: ""
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with no agent identities, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert script reports missing identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SCRIPT="$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/tests/*' -not -path '*/.git/*' | head -1)"
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          set +e
          OUT="$(GH_REPOSITORY=example/repo AGENT_EMAILS= AGENT_LOGINS= python "$SCRIPT" 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          [ "$RC" -eq 1 ] || { echo "FAIL: expected exit 1, got $RC"; exit 1; }
          echo "$OUT" | grep -q "No agent identities configured" || { echo "FAIL: missing message"; exit 1; }
          echo "PASS"
