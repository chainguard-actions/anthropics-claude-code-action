name: Test no agent identities configured exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Passing empty agent_emails and agent_logins should cause exit 1.
      # The validation (no agent identities configured) happens before event
      # parsing, so no event payload is needed. GH_PR_NUMBER is set to avoid
      # the unsupported-event error path (though validation fires first).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: ""
          agent_logins: ""
        env:
          GH_PR_NUMBER: "5"

      - name: Assert action failed with no agent identities
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no agent identities configured, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected empty agent identities"
