name: Test no-PR event exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal event payload in GITHUB_WORKSPACE (reliable under act)
      - name: Create fake event payload
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.test-tmp"
          echo '{}' > "$GITHUB_WORKSPACE/.test-tmp/event.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action handled unsupported event gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The composite action sets GH_EVENT_NAME from github.event_name,
          # which is always 'workflow_dispatch' under the act harness.
          # resolve_pr_number raises ValueError for workflow_dispatch, so the
          # action exits non-zero. That is the expected fail-closed behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for unsupported event (fail-closed)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (treated as no-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
