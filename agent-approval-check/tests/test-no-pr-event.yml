name: Test - No PR event (issue comment on plain issue)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload for an issue_comment on a plain issue (no PR).
      # NOTE: Under act the composite action always sets GH_EVENT_NAME from
      # github.event_name (= workflow_dispatch), which is an unsupported event.
      # The action will therefore fail at event resolution. We accept failure as
      # a valid outcome here because the action cannot be exercised with a
      # non-workflow_dispatch event under act.
      - name: Create fake issue_comment event payload
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 42,
              "title": "A plain issue (not a PR)",
              "body": "This is a regular issue, not a pull request."
            },
            "comment": {
              "id": 1,
              "body": "A comment on a plain issue"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (success or graceful failure)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — correctly identified no PR associated with event"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
