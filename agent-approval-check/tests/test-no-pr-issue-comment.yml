name: Test action fails gracefully with no PR context (issue comment scenario)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        # No GH_PR_NUMBER set. The composite action sets GH_EVENT_NAME from
        # github.event_name (workflow_dispatch), which is unsupported by
        # resolve_pr_number() → raises ValueError → exits non-zero.
        # Under the harness we cannot override GH_EVENT_NAME to issue_comment.

      - name: Assert action exited non-zero (fail-closed, no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is fail-closed: unsupported event → ValueError → non-zero exit.
          # This validates that the action does not silently succeed when it
          # cannot determine a PR number.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — no PR context resolvable under harness"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no PR context is available"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
