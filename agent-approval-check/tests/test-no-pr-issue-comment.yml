name: Test issue_comment on plain issue (no PR) — graceful exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The composite action sets GH_EVENT_NAME from github.event_name, which is
      # always "workflow_dispatch" under act. The script raises ValueError for
      # unsupported events (fail-closed design). We verify the action exits non-zero
      # (fail-closed) rather than silently succeeding on an unknown event.
      - id: action
        uses: .
        continue-on-error: true
        with:
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
          required_approvals: "2"

      - name: Assert action is fail-closed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action is fail-closed — exits non-zero on unsupported/unresolvable event"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not silently succeed on an unsupported event"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
