name: Test unsupported event type fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action hardcodes GH_EVENT_NAME from github.event_name, which is
      # always "workflow_dispatch" in this test harness. The script raises
      # ValueError("Unsupported event: workflow_dispatch") and exits non-zero.
      # This test verifies the script fails with a clear error for unsupported
      # event types rather than silently succeeding or hanging.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event type, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event type (workflow_dispatch)"
