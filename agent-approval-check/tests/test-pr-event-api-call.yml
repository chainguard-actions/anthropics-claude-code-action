name: Test PR event triggers API call (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake pull_request event payload with a real-looking PR number
      - name: Create fake PR event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/pull_request.json <<'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "head": {
                "sha": "abc1234567890123456789012345678901234567",
                "ref": "feature-branch"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "testuser"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-events/pull_request.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (API call fails on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to make GitHub API calls using the sentinel
          # repo (actionchain-harness/...) which does not exist on GitHub.
          # The GraphQL query will fail with a 404/error, causing the script
          # to exit non-zero. This is expected behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
