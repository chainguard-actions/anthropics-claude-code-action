name: Test PR event with sentinel repo fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
      # action's step env). The script raises ValueError for unsupported events,
      # so the action fails. Even if the event were supported, the sentinel repo
      # would cause API calls to fail. We verify the action fails gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — sentinel repo is not resolvable via GitHub API"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
