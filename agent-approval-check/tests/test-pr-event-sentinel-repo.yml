name: Test pull_request event with sentinel repo (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.event_name is always workflow_dispatch.
      # The composite action sets GH_EVENT_NAME: ${{ github.event_name }},
      # so the Python script always sees workflow_dispatch (not pull_request).
      # resolve_pr_number raises ValueError for workflow_dispatch, causing failure.
      # Additionally, even if the event were pull_request, the sentinel repo
      # (GITHUB_REPOSITORY is not a real repo) would cause API failures.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          # The action will fail because:
          # 1. workflow_dispatch is unsupported (ValueError in resolve_pr_number), OR
          # 2. The sentinel GITHUB_REPOSITORY is not a real repo (API 404)
          # Either outcome is acceptable.
          case "$OUTCOME" in
            success)
              echo "PASS: action succeeded"
              ;;
            failure)
              echo "PASS: action failed gracefully (unsupported event or sentinel repo)"
              ;;
            *)
              echo "INFO: outcome='$OUTCOME' — treating as acceptable"
              ;;
          esac
