name: Test - PR event with sentinel repo (API call fails gracefully)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act the composite action always sets GH_EVENT_NAME from
      # github.event_name (= workflow_dispatch), which is an unsupported event.
      # The action will fail at event resolution. We accept both success and
      # failure as valid outcomes.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (succeeds or fails gracefully)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — sentinel repo or unsupported event"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
