name: Test pull_request event triggers PR processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the action always sees workflow_dispatch (not pull_request),
          # so it will fail with an unsupported event error or a sentinel repo API
          # failure. Both outcomes are valid under the harness.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real repo resolved)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or unsupported event under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
