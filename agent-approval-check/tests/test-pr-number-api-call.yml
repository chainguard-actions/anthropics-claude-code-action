name: Test with explicit PR number (API call to sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        env:
          # GH_PR_NUMBER bypasses event parsing entirely (the action reads this
          # before checking GH_EVENT_NAME). The action then calls the GitHub API
          # for the sentinel repo, which does not exist → API call fails → non-zero exit.
          # The action.yml does not set GH_PR_NUMBER, so this env var is not overridden.
          GH_PR_NUMBER: "1"

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The sentinel repo does not exist on GitHub, so the GraphQL/REST
          # API calls will fail. The action is fail-closed, so it exits non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable if repo resolves)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
