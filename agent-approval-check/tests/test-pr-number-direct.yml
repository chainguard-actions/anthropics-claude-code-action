name: Test direct PR number via GH_PR_NUMBER env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_PR_NUMBER: "1"
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt to fetch PR data via GraphQL.
          # With the sentinel repo, the API call will fail (404 or similar).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real repo resolved)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
