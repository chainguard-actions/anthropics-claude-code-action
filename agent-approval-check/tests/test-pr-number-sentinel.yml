name: Test explicit PR number (API against sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_PR_NUMBER: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "1"
          protected_bases: main
      - name: Assert action ran (succeeded, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert dependencies were installed
        run: |
          python -c "import httpx, yaml, tenacity" || { echo "FAIL: deps missing"; exit 1; }
          echo "PASS"
