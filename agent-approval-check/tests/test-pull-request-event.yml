name: Test pull_request event (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake pull_request event payload
      - name: Create pull_request event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/pull_request.json <<'EOF'
          {
            "action": "opened",
            "number": 42,
            "pull_request": {
              "number": 42,
              "head": {
                "sha": "abc1234567890abcdef1234567890abcdef123456",
                "ref": "feature/agent-work"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "claude[bot]"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "default_branch": "main"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/test-events/pull_request.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (API call fails on sentinel repo or succeeds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt GraphQL/REST calls against the sentinel repo
          # which doesn't exist on GitHub, so it will fail gracefully.
          # Either outcome is acceptable — the key is it doesn't crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (PR processed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
