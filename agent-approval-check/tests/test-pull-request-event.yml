name: Test pull_request event triggers PR processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GH_PR_NUMBER bypasses event parsing (GH_EVENT_NAME is always
      # workflow_dispatch under act, which is unsupported). The script will
      # attempt to process PR #1 via the GitHub API, which will fail on the
      # sentinel repo — that is expected.
      GH_PR_NUMBER: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (PR number resolved, API call attempted or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action skipped event parsing (GH_PR_NUMBER=1 was set) and
          # attempted to process PR #1 via the GitHub API.
          # On the sentinel repo the GraphQL call will fail (404), which is expected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real repo accessible)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
