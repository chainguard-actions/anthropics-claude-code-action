name: Test pull_request event with sentinel repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python dependencies
        run: pip install 'httpx==0.28.1' 'pyyaml==6.0.3' 'tenacity==9.1.4' --quiet || true

      - name: Set GH_PR_NUMBER to bypass event parsing
        run: echo "GH_PR_NUMBER=1" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (failed gracefully on sentinel repo API call)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail because the sentinel repo does not exist on GitHub.
          # This is expected — we verify it got past config/event parsing.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo API call failed as expected)"
          elif [ -z "$OUTCOME" ]; then
            echo "PASS: outcome not captured (act limitation) — action ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
