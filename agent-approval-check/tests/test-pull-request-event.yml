name: Test pull_request event triggers API calls
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/pr_event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 99,
              "head": { "sha": "deadbeefcafe1234567890abcdef1234567890ab" },
              "base": { "ref": "main" }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/fake-events/pr_event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
