name: Test pull_request event triggers PR processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake pull_request event payload
      - name: Create fake pull_request event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/pull_request.json <<'EOF'
          {
            "action": "opened",
            "number": 1,
            "pull_request": {
              "number": 1,
              "title": "Test PR",
              "head": {
                "sha": "abc1234567890abcdef1234567890abcdef123456",
                "ref": "feature/test-branch"
              },
              "base": {
                "ref": "main"
              },
              "user": {
                "login": "claude[bot]"
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: pull_request
          GH_EVENT_PATH: /tmp/test-events/pull_request.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran and handled PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will attempt GraphQL/REST API calls against the sentinel repo,
          # which does not exist on GitHub. It should either:
          # - succeed if the API calls happen to work (unlikely with sentinel repo)
          # - fail gracefully with a non-zero exit (expected with sentinel repo)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (API calls worked)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
