name: Test push event (no PR)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake event payload for a push event (no PR number)
      - name: Create push event payload
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/push.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "full_name": "test-owner/test-repo",
              "default_branch": "main"
            },
            "pusher": {
              "name": "test-user"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: push
          GH_EVENT_PATH: /tmp/test-events/push.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action handled push event gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # For a push event (no PR), the action should exit 0 (success)
          # because it logs "Event push is not associated with a PR — nothing to do"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly for push event (no PR)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
