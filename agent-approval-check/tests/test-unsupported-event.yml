name: Test unsupported event type causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The composite action sets GH_EVENT_NAME from github.event_name,
          # which is always "workflow_dispatch" under act. The script raises
          # ValueError for unsupported events (workflow_dispatch is not in the
          # supported set: pull_request, pull_request_target, pull_request_review,
          # issue_comment, workflow_run). This causes exit 1.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event 'workflow_dispatch'"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
