name: Test unsupported event type fails with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action fails for unsupported event type
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
          # composite action from github.event_name). The script raises ValueError
          # for unsupported events (workflow_dispatch is not in the supported set:
          # pull_request, pull_request_target, pull_request_review, issue_comment,
          # workflow_run). So the action must fail.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event 'workflow_dispatch'"
            exit 1
          fi
          echo "PASS: action failed as expected for unsupported event (outcome: $OUTCOME)"
