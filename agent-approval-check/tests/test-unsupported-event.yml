name: Test unsupported event (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action only supports pull_request / pull_request_review / issue_comment /
      # workflow_run events. Under workflow_dispatch it must raise "Unsupported event"
      # and fail rather than silently posting a status.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action refused the unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event"
            exit 1
          fi
          echo "PASS"
