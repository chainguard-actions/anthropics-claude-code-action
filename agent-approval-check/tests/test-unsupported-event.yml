name: Test unsupported event type fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, the action hardcodes GH_EVENT_NAME=workflow_dispatch (from
      # github.event_name). The script's resolve_pr_number raises ValueError for
      # unsupported events (including workflow_dispatch and push), so the action
      # exits non-zero. This test verifies that behavior.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event"
          else
            echo "FAIL: expected failure for unsupported event but got '$OUTCOME'"
            exit 1
          fi
