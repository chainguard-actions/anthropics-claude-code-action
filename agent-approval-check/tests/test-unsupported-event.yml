name: Test unsupported event type exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"
        # No GH_PR_NUMBER set — the script falls through to event parsing.
        # The composite action sets GH_EVENT_NAME=workflow_dispatch (from github.event_name),
        # which is an unsupported event. The script raises ValueError and exits non-zero.

      - name: Assert action fails on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workflow_dispatch is not a supported event — the script raises ValueError
          # and exits non-zero (fail-closed behavior).
          # Under act, GH_EVENT_NAME is always workflow_dispatch (set by the composite
          # action from github.event_name), so this test naturally exercises the
          # unsupported-event code path.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on unsupported event type"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on unsupported event type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
