name: Test unsupported event name exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/push_event.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "commits": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: push
          GH_EVENT_PATH: /tmp/fake-events/push_event.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected unsupported event 'push'"
          else
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
