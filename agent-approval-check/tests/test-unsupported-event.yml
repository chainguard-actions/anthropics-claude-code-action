name: Test default inputs fail closed on unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Under act the event is always workflow_dispatch, which the check does
      # not support. It is fail-closed, so the step must fail (never succeed).
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed closed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported workflow_dispatch event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed closed"
