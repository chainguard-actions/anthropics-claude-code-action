name: Test unsupported event name exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # No GH_PR_NUMBER set, so the action will use GH_EVENT_NAME from
        # github.event_name (workflow_dispatch), which is unsupported by
        # resolve_pr_number() → raises ValueError → exits non-zero.

      - name: Assert action failed (workflow_dispatch is unsupported event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script raises ValueError for unsupported events like 'workflow_dispatch',
          # which causes a non-zero exit (fail-closed behavior).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event type (workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event 'workflow_dispatch'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
