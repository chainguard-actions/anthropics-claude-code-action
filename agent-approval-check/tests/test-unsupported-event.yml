name: Test unsupported event type fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, the action's composite step sets GH_EVENT_NAME from
      # github.event_name, which is always "workflow_dispatch". The script's
      # resolve_pr_number() raises ValueError for unsupported events (workflow_dispatch
      # is not in the supported list: pull_request, pull_request_target,
      # pull_request_review, issue_comment, workflow_run). So the action should
      # exit non-zero. We do NOT set GH_PR_NUMBER so event parsing is triggered.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on unsupported event (workflow_dispatch)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for unsupported event but got success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
