name: Test unsupported event type fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.event_name is always workflow_dispatch, which is
          # not a supported event for this action (it supports pull_request,
          # pull_request_target, pull_request_review, issue_comment, workflow_run).
          # The script raises ValueError("Unsupported event: workflow_dispatch")
          # and exits non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event type"
          else
            echo "FAIL: expected failure for unsupported event but got '$OUTCOME'"
            exit 1
          fi
