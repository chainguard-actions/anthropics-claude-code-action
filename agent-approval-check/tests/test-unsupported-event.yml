name: Test unsupported event handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed gracefully on unsupported event
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always workflow_dispatch (set by action.yml
          # from github.event_name), which is an unsupported event — the script
          # raises ValueError and exits non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected for unsupported event"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected failure for unsupported event type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
