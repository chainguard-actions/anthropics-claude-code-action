name: Test unsupported event (workflow_dispatch) is refused
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action refused the non-PR event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The check only supports PR-related events; workflow_dispatch raises
          # "Unsupported event" and must not succeed silently.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
