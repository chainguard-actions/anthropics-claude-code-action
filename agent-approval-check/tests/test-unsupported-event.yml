name: Test unsupported event type exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the composite action always sets GH_EVENT_NAME=workflow_dispatch
          # (from github.event_name). workflow_dispatch is not a supported event for
          # this action (only pull_request, pull_request_target, pull_request_review,
          # issue_comment, and workflow_run are supported). The script raises ValueError
          # and exits non-zero.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event type, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected unsupported event type"
