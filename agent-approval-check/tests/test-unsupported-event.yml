name: Test unsupported event type fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action fails for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
          # composite action from github.event_name). The script raises ValueError
          # for unsupported events (push, workflow_dispatch, etc.), so the action
          # always fails here. This test verifies that unsupported events cause
          # the action to fail rather than silently succeed.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event type"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
