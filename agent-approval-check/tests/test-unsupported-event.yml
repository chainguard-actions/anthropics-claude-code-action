name: Test unsupported event (workflow_dispatch) fails closed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed closed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # workflow_dispatch is not a PR event; resolve_pr_number raises
          # "Unsupported event" so the check must fail closed (never succeed).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert Python 3.12 and pinned dependencies were installed
        run: |
          python --version
          VER="$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          echo "python: $VER"
          if [ "$VER" != "3.12" ]; then
            echo "FAIL: expected python 3.12"
            exit 1
          fi
          python - <<'EOF'
          import sys
          from importlib.metadata import version
          expected = {"httpx": "0.28.1", "pyyaml": "6.0.3", "tenacity": "9.1.4"}
          bad = False
          for pkg, want in expected.items():
              got = version(pkg)
              print(f"{pkg}: {got}")
              if got != want:
                  print(f"FAIL: {pkg} expected {want}")
                  bad = True
          import httpx, yaml, tenacity  # noqa: F401
          sys.exit(1 if bad else 0)
          EOF
          echo "PASS"
