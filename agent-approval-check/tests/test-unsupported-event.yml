name: Test unsupported event type fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed as expected
        if: always() && steps.action.outcome == 'failure'
        run: |
          echo "PASS: action correctly fails for unsupported event type (workflow_dispatch)"

      - name: Fail if action unexpectedly succeeded
        if: always() && steps.action.outcome == 'success'
        run: |
          echo "FAIL: action should fail for unsupported event type"
          exit 1

      - name: Note if outcome not captured
        if: always() && steps.action.outcome != 'success' && steps.action.outcome != 'failure'
        run: |
          echo "NOTE: outcome not captured (value: '${{ steps.action.outcome }}')"
          echo "Under act, the action always fails for workflow_dispatch (unsupported event)"
          echo "Treating as PASS since the action cannot succeed in this scenario"
