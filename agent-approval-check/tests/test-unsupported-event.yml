name: Test unsupported event type fails gracefully
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        # NOTE: Under act, the action always sees workflow_dispatch as the event
        # (the action's env block sets GH_EVENT_NAME from github.event_name,
        # which is always workflow_dispatch). workflow_dispatch is unsupported,
        # so the action correctly fails — which is exactly what this test asserts.

      - name: Assert action fails for unsupported event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event (workflow_dispatch)"
          else
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
