name: Test unsupported event type exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The composite action always sets GH_EVENT_NAME=${{ github.event_name }}
      # which is "workflow_dispatch" under act. workflow_dispatch is not a
      # supported event — the action raises ValueError and exits non-zero.
      # GH_PR_NUMBER is intentionally NOT set so the action falls through to
      # event parsing and hits the unsupported-event error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected unsupported event type"
