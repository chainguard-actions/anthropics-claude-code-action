name: Test unsupported event (workflow_dispatch) with defaults
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed on unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for workflow_dispatch (unsupported event), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert python and dependencies were installed by the action
        run: |
          python --version
          python --version 2>&1 | grep -q "Python 3.12" || { echo "FAIL: expected Python 3.12"; exit 1; }
          python -c "import httpx, yaml, tenacity; print(httpx.__version__, yaml.__version__)" || { echo "FAIL: deps missing"; exit 1; }
          python -c "import httpx; assert httpx.__version__ == '0.28.1', httpx.__version__" || { echo "FAIL: wrong httpx version"; exit 1; }
          echo "PASS"
      - name: Assert script reports unsupported event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SCRIPT="$(find "$GITHUB_WORKSPACE" -name agent_approval_check.py -not -path '*/tests/*' -not -path '*/.git/*' | head -1)"
          echo "script: $SCRIPT"
          [ -n "$SCRIPT" ] || { echo "FAIL: script not found"; exit 1; }
          echo '{}' > /tmp/event.json
          set +e
          OUT="$(GH_REPOSITORY=example/repo GH_EVENT_NAME=workflow_dispatch GH_EVENT_PATH=/tmp/event.json \
            REQUIRED_APPROVALS=2 AGENT_EMAILS=noreply@anthropic.com AGENT_LOGINS='claude[bot],claude-code[bot]' \
            DOCS_URL=https://example.com python "$SCRIPT" 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          echo "rc: $RC"
          [ "$RC" -ne 0 ] || { echo "FAIL: expected non-zero exit"; exit 1; }
          echo "$OUT" | grep -q "Unsupported event: workflow_dispatch" || { echo "FAIL: missing message"; exit 1; }
          echo "PASS"
