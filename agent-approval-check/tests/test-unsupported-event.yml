name: Test unsupported event type exits non-zero
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal fake event payload
      - name: Create fake event payload
        run: |
          mkdir -p /tmp/fake-events
          echo '{}' > /tmp/fake-events/push.json

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: push
          GH_EVENT_PATH: /tmp/fake-events/push.json

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported event type 'push'"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event type"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
