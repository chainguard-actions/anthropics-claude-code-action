name: Test unsupported event type fails with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act/workflow_dispatch, the action's own env block sets
      # GH_EVENT_NAME=${{ github.event_name }} = "workflow_dispatch",
      # which is an unsupported event. The script raises ValueError and exits 1.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed for unsupported event (workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported 'workflow_dispatch' event"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported event"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
