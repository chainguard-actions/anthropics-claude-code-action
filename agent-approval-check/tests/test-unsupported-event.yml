name: Test unsupported event type exits non-zero
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed for unsupported event
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: '$OUTCOME'"
          # Under act, github.event_name=workflow_dispatch which is unsupported.
          # The action should fail with a ValueError for the unsupported event.
          case "$OUTCOME" in
            failure)
              echo "PASS: action correctly rejected unsupported event type (workflow_dispatch)"
              ;;
            "")
              # act may not set steps.action.outcome for composite actions
              echo "WARN: outcome is empty (act limitation) - cannot verify action failed"
              echo "INCONCLUSIVE: test cannot verify action failed under act"
              ;;
            success)
              echo "FAIL: expected failure for unsupported event, got success"
              exit 1
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
