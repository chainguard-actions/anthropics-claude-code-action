name: Test unsupported event type fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.event_name is always workflow_dispatch. The composite
      # action hardcodes GH_EVENT_NAME from github.event_name. workflow_dispatch
      # is not a supported event for this action (only pull_request,
      # pull_request_target, pull_request_review, issue_comment, workflow_run
      # are supported). The script raises ValueError and exits non-zero.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event (workflow_dispatch), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected unsupported event type (workflow_dispatch)"
