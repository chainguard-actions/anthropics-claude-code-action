name: Test unsupported event type fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.event_name is always workflow_dispatch, which the
      # action passes as GH_EVENT_NAME. The Python script raises ValueError for
      # unsupported events (including workflow_dispatch and push), so the action
      # fails. This test verifies the action fails for unsupported event types.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action failed (unsupported event type)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unsupported event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly rejected unsupported event type"
