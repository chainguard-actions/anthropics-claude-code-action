name: Test unsupported event type causes action to fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake push event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/push.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "before": "abc123",
            "after": "def456"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: push
          GH_EVENT_PATH: /tmp/fake-events/push.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported 'push' event, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event type"
