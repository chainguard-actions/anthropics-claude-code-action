name: Test default inputs on unsupported workflow_dispatch event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert setup steps ran (python 3.12 + deps installed)
        run: |
          python --version
          if ! python --version 2>&1 | grep -q '3\.12'; then
            echo "FAIL: expected Python 3.12 from the action's setup-python step"
            exit 1
          fi
          if ! python -c "import httpx, yaml, tenacity; assert httpx.__version__ == '0.28.1', httpx.__version__"; then
            echo "FAIL: expected pinned dependencies to be installed by the action"
            exit 1
          fi
          echo "PASS: dependencies installed"
      - name: Assert action fails closed on an event without a PR
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (workflow_dispatch is an unsupported event; check is fail-closed)"
            exit 1
          fi
          echo "PASS"
