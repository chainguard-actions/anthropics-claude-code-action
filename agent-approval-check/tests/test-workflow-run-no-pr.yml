name: Test workflow_run event with no associated PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake workflow_run event payload with no PRs
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/workflow_run.json << 'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "id": 12345,
              "name": "CI",
              "head_sha": "abc1234567890abcdef1234567890abcdef12345",
              "pull_requests": []
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (under act event is always workflow_dispatch so failure is expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the composite action always sets GH_EVENT_NAME=workflow_dispatch
          # (from github.event_name), which is unsupported. The action will fail.
          # In a real environment with workflow_run event and no PRs, it would exit 0.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly (no PR in workflow_run)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
