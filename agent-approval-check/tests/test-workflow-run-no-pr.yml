name: Test workflow_run event with no associated PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python dependencies
        run: pip install 'httpx==0.28.1' 'pyyaml==6.0.3' 'tenacity==9.1.4' --quiet || true

      # NOTE: The action always sets GH_EVENT_NAME=${{ github.event_name }} = workflow_dispatch
      # internally, overriding any outer env. We cannot simulate workflow_run event.
      # The action will fail with "Unsupported event: workflow_dispatch" when no GH_PR_NUMBER
      # is set. This test verifies the action fails gracefully (not a crash/panic) when
      # there is no PR context and the event is not supported.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action exited (no PR context available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action cannot be given a workflow_run event context under act
          # (the action overrides GH_EVENT_NAME with github.event_name = workflow_dispatch).
          # workflow_dispatch is unsupported, so the action fails. This is acceptable.
          if [ "$OUTCOME" = "failure" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action exited (outcome: ${OUTCOME:-empty}) — no PR context available"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly (unexpected success)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
