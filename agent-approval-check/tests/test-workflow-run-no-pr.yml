name: Test workflow_run event with no PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake workflow_run event payload with no associated PRs
      - name: Create fake workflow_run event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/workflow_run.json <<'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "id": 12345,
              "name": "CI",
              "status": "completed",
              "conclusion": "success",
              "pull_requests": []
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: workflow_run
          GH_EVENT_PATH: /tmp/fake-events/workflow_run.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action exited cleanly (no PR in workflow_run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The workflow_run event has no associated PRs (empty list),
          # so the script should log "nothing to do" and exit 0.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly for workflow_run with no PRs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
