name: Test workflow_run event with no associated PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake workflow_run event payload with no pull_requests
      - name: Create fake workflow_run event payload with no PRs
        run: |
          mkdir -p /tmp/test-events
          cat > /tmp/test-events/workflow_run.json <<'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "id": 12345,
              "name": "CI",
              "head_sha": "abc1234567890abcdef1234567890abcdef123456",
              "head_branch": "main",
              "status": "completed",
              "conclusion": "success",
              "pull_requests": []
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_EVENT_NAME: workflow_run
          GH_EVENT_PATH: /tmp/test-events/workflow_run.json
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action exits cleanly when workflow_run has no PRs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script should succeed (exit 0) because workflow_run has no pull_requests,
          # so it logs "nothing to do" and returns without making any API calls.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly for workflow_run with no PRs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo may have caused API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
