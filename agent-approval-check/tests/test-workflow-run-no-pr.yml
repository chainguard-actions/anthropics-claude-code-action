name: Test workflow_run event with no PRs exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under the harness, GH_EVENT_NAME is always workflow_dispatch (from
      # github.event_name), which is an unsupported event. The action exits
      # non-zero. We verify the action exits cleanly (no crash/panic) when
      # there is no PR associated with the triggering event.
      #
      # Note: the original scenario (workflow_run with no pull_requests → exit 0)
      # cannot be simulated under act because the action hardcodes
      # GH_EVENT_NAME from github.event_name, which is always workflow_dispatch.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action exited (unsupported event under harness, no PR in workflow_run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (no PR to process)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited non-zero (unsupported event under harness — expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
