name: Test workflow_run event with no associated PRs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (fails gracefully — workflow_dispatch is unsupported)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always workflow_dispatch (unsupported),
          # so the action exits non-zero. Accept failure as a graceful exit.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event under act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (workflow_run with no PRs is a no-op)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
