name: Test workflow_run event with no associated PRs exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (failure expected for unsupported event)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always 'workflow_dispatch' (set by the
          # composite action from github.event_name). The script raises ValueError
          # for unsupported events, so the action fails. This is the expected
          # behavior — the test verifies the action does not crash the workflow.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "WARN: outcome is '$OUTCOME' — treating as acceptable"
            echo "PASS"
          fi
