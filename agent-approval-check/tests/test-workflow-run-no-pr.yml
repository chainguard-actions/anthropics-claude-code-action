name: Test action fails gracefully when no PR number is resolvable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # No GH_PR_NUMBER set. The action reads GH_EVENT_NAME from
        # github.event_name (workflow_dispatch), which is unsupported →
        # raises ValueError → exits non-zero (fail-closed behavior).
        # Under the act harness we cannot override GH_EVENT_NAME because
        # the composite action's own env block sets it from github.event_name.

      - name: Assert action exited non-zero (no resolvable PR, fail-closed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is fail-closed: when it cannot resolve a PR number
          # (unsupported event under the harness), it exits non-zero.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully — no PR resolvable under harness"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when no PR is resolvable"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
