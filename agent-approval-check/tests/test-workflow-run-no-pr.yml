name: Test workflow_run event with no associated PRs exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake workflow_run event payload with no PRs
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/workflow_run.json <<'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "id": 12345,
              "name": "CI",
              "head_sha": "abc123def456",
              "pull_requests": []
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action failed gracefully (unsupported event under act harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, github.event_name is always workflow_dispatch, which the
          # action correctly rejects as an unsupported event. The composite step
          # sets GH_EVENT_NAME from github.event_name directly (not from an input),
          # so it cannot be overridden by test env vars.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully for unsupported event (workflow_dispatch under act)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (event handled gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
