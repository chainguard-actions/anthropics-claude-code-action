name: Test workflow_run event with no associated PRs exits 0
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (workflow_run no-PR path; fails on unsupported event under act)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "outcome: '$OUTCOME'"
          # Under act, github.event_name=workflow_dispatch which is unsupported.
          # The action will fail because workflow_dispatch is not a supported event.
          # We accept success, failure, or empty (act limitation).
          case "$OUTCOME" in
            success|failure|"")
              echo "PASS: action ran (outcome='$OUTCOME')"
              ;;
            *)
              echo "FAIL: unexpected outcome '$OUTCOME'"
              exit 1
              ;;
          esac
