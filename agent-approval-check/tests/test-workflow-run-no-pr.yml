name: Test protected_bases configuration is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action's composite step overrides GH_EVENT_NAME with "workflow_dispatch"
      # (unsupported), so we use GH_PR_NUMBER to bypass event parsing entirely.
      # This test verifies that the protected_bases input is accepted and the
      # action proceeds to PR processing (API calls fail on sentinel repo).
      - id: action
        uses: .
        continue-on-error: true
        env:
          GH_PR_NUMBER: "1"
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
          protected_bases: "main,release"

      - name: Assert action accepted protected_bases config and ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted protected_bases and succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted protected_bases and failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
