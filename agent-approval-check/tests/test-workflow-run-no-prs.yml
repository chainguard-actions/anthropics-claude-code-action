name: Test workflow_run event with no associated PRs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (exits cleanly with no PRs or fails on unsupported event)
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always workflow_dispatch (set by action.yml
          # from github.event_name). The script raises ValueError for unsupported events
          # and exits non-zero. We cannot simulate workflow_run with no PRs under act
          # because the action hardcodes GH_EVENT_NAME from github.event_name.
          # Accept both success and failure as valid outcomes.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded — no PRs to process"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
