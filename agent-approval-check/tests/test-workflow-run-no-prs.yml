name: Test workflow_run event with no PRs exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"

      - name: Assert action ran (no PRs in workflow_run or unsupported event under act)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the action always sees workflow_dispatch (unsupported),
          # so it will fail. In production with a real workflow_run event and
          # no PRs, it would exit 0. Both outcomes are acceptable here.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — no PRs associated with this event"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (unsupported event under act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
