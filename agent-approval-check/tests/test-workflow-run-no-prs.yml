name: Test workflow_run event with no associated PRs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake workflow_run event payload with no pull_requests
      - name: Create fake workflow_run event payload
        run: |
          mkdir -p /tmp/fake-events
          cat > /tmp/fake-events/workflow_run.json << 'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "id": 12345,
              "name": "CI",
              "status": "completed",
              "conclusion": "success",
              "pull_requests": []
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot],claude-code[bot]"
        env:
          GH_EVENT_NAME: workflow_run
          GH_EVENT_PATH: /tmp/fake-events/workflow_run.json

      - name: Assert action exited successfully (no PRs in workflow_run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 — no PRs associated with this workflow_run"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
