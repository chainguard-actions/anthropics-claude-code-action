name: Test workflow_run event with no PRs exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"

      - name: Assert action exited (unsupported event or API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, GH_EVENT_NAME is always workflow_dispatch (set by the
          # composite action from github.event_name). workflow_dispatch is not
          # a supported event for this action, so it exits 1. This test verifies
          # the script exits non-zero gracefully (no crash/hang) when no PR
          # number can be resolved.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action exited non-zero (unsupported event or API failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (PR resolved and processed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
