name: Test workflow_run event with no associated PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: "noreply@anthropic.com"
          agent_logins: "claude[bot]"
          excluded_approvers: "rubber-stamp-bot"
        env:
          # GH_PR_NUMBER bypasses event parsing (composite action does not override it).
          # This simulates a workflow_run scenario where a PR number is known.
          # The action will proceed to make API calls that fail on the sentinel repo.
          GH_PR_NUMBER: "1"

      - name: Assert action ran with excluded_approvers configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action proceeds past config validation and makes API calls.
          # On the sentinel repo those calls fail — both outcomes are acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (real repo resolved)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
