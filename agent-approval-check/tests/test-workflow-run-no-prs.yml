name: Test invalid config file path fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "1"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot]
          # Point to a non-existent config file to trigger a FileNotFoundError.
          # The script should exit non-zero with a clear error message.
          config_file: /tmp/nonexistent-config/agent-identities.yaml

      - name: Assert action fails when config file does not exist
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The script tries to open the config file and raises FileNotFoundError
          # when it doesn't exist, causing a non-zero exit.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for missing config file"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for missing config file"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
