name: Test workflow_run event with no associated PRs exits cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act/workflow_dispatch, the action's own env block always sets
      # GH_EVENT_NAME=workflow_dispatch (an unsupported event). The script
      # raises ValueError and exits 1. We accept this as a graceful failure
      # since the workflow_run event cannot be simulated under workflow_dispatch.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          required_approvals: "2"
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]

      - name: Assert action ran (exits cleanly for no PRs or fails on unsupported event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly (no PRs in workflow_run)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (workflow_dispatch is unsupported — cannot simulate workflow_run under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
