name: Test required_approvals below 1 is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          required_approvals: "0"
      - name: Assert setup steps ran before validation
        run: |
          python --version
          python -c "import httpx, yaml, tenacity" || { echo "FAIL: deps not installed"; exit 1; }
          echo "PASS"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for required_approvals=0"
            exit 1
          fi
          echo "PASS"
