name: Test basic usage with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun and action dependencies
        run: |
          # Install bun to a fixed known path
          BUN_INSTALL=/tmp/bun-install
          mkdir -p "$BUN_INSTALL/bin"
          curl -fsSL https://bun.sh/install | BUN_INSTALL="$BUN_INSTALL" bash
          export PATH="$BUN_INSTALL/bin:$PATH"
          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          # Pre-install action dependencies so bun install --production is fast/offline
          cd "$GITHUB_WORKSPACE"
          "$BUN_INSTALL/bin/bun" install --production

      - name: Create fake claude executable that simulates auth failure
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Simulate authentication failure from Claude CLI
          echo "Error: Invalid API key" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-testing-only"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          path_to_bun_executable: "/tmp/bun-install/bin/bun"

      - name: Assert action ran and set conclusion output
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # With a fake claude executable that exits 1, the action should fail
          # and set conclusion=failure
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed - conclusion should be set to 'failure'
            if [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: action failed gracefully with conclusion='$CONCLUSION'"
            elif [ -z "$CONCLUSION" ]; then
              # conclusion may not be set if the step failed before setting outputs
              echo "PASS: action failed gracefully (conclusion not set, step failed)"
            else
              echo "FAIL: unexpected conclusion value '$CONCLUSION'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
