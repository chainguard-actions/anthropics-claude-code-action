name: Test Bedrock without AWS config fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when Bedrock lacks AWS_REGION/credentials"
            exit 1
          fi
          if [ -f "$HOME/.claude/settings.json" ]; then
            echo "FAIL: settings written despite validation failure"
            exit 1
          fi
          echo "PASS"
