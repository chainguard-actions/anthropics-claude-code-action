name: Test Bedrock missing credentials graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, or AWS_BEARER_TOKEN_BEDROCK
          # This should fail validation

      - name: Assert conclusion is failure due to missing Bedrock credentials
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Missing Bedrock credentials must cause a validation failure
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion output 'failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with missing Bedrock credentials"
