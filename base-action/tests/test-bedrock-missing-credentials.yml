name: Test Bedrock provider missing credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS_REGION or AWS credentials provided — should fail validation

      - name: Assert action failed due to missing Bedrock credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing Bedrock credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with missing Bedrock credentials"
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion output is correct"
