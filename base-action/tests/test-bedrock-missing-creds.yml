name: Test Bedrock missing credentials error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS_REGION, no AWS credentials — should fail validation

      - name: Assert action failed due to missing Bedrock credentials
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action must fail because AWS_REGION and credentials are missing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing Bedrock credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with missing Bedrock credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert conclusion output reflects failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: conclusion is '$CONCLUSION' (acceptable on Bedrock validation failure)"
          else
            echo "FAIL: expected conclusion=failure but got '$CONCLUSION'"
            exit 1
          fi
