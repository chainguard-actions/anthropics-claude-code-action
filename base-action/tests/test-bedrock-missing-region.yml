name: Test Bedrock missing AWS_REGION error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS_REGION set — should fail validation

      - name: Assert action failed due to missing AWS_REGION
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without AWS_REGION, the action must fail at validation
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS_REGION, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: action failed as expected without AWS_REGION (conclusion='$CONCLUSION')"
          else
            echo "FAIL: unexpected conclusion='$CONCLUSION'"
            exit 1
          fi
