name: Test Bedrock provider missing AWS_REGION error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # AWS_REGION is not set — should fail validation for Bedrock

      - name: Assert action failed due to missing AWS_REGION for Bedrock
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion output 'failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with conclusion=failure when AWS_REGION missing for Bedrock"
