name: Test prompt and prompt_file are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable, prompt file and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf "$HOME/.claude" /tmp/claude-action
          echo "Prompt from file" > /tmp/test-prompt.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Inline prompt"
          prompt_file: /tmp/test-prompt.txt
          anthropic_api_key: sk-ant-dummy-never-sent
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action rejected both prompt inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both prompt and prompt_file are set"
            exit 1
          fi
          if [ ! -f "$HOME/.claude/settings.json" ]; then
            echo "FAIL: settings.json missing - action failed before prompt validation"
            exit 1
          fi
          if [ -f /tmp/claude-action/prompt.txt ]; then
            echo "FAIL: inline prompt file should not be written"
            exit 1
          fi
          echo "PASS"
