name: Test prompt and prompt_file are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create prompt file and fake claude executable
        run: |
          mkdir -p /tmp/fake-claude
          rm -f /tmp/fake-claude/invoked
          echo "Prompt from file" > /tmp/prompt.txt
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "fake claude invoked: $*" >> /tmp/fake-claude/invoked
          exit 1
          EOF
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-dummy-key-for-validation-test"
          prompt: "Inline prompt"
          prompt_file: /tmp/prompt.txt
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action rejected both prompt inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both prompt and prompt_file are set"
            exit 1
          fi
          if [ -f /tmp/fake-claude/invoked ]; then
            echo "FAIL: claude was invoked despite invalid prompt inputs"
            exit 1
          fi
          echo "PASS"
