name: Test prompt and prompt_file together are rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and prompt file
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          echo "Say hello" > /tmp/prompt.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-not-used"
          prompt: "Say hello"
          prompt_file: /tmp/prompt.txt
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both prompt and prompt_file are set"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: unexpected conclusion '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
