name: Test Claude execution error is propagated
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_CLAUDE_LOG_DIR: /tmp/fake-claude-error
      FAKE_CLAUDE_MODE: error
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake claude CLI
        run: |
          rm -rf "$FAKE_CLAUDE_LOG_DIR"
          mkdir -p "$RUNNER_TEMP/fake-bin"
          install -m 0755 tests/fixtures/fake-claude.js "$RUNNER_TEMP/fake-bin/claude"
          echo "FAKE_CLAUDE=$RUNNER_TEMP/fake-bin/claude" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "This run will fail"
          anthropic_api_key: sk-ant-test-not-a-real-key
          path_to_claude_code_executable: ${{ env.FAKE_CLAUDE }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: conclusion should be 'failure'"
            exit 1
          fi
          echo "PASS"
      - name: Assert Claude was actually invoked
        run: |
          if [ ! -f "$FAKE_CLAUDE_LOG_DIR/prompt.txt" ]; then
            echo "FAIL: fake claude never received a prompt"
            exit 1
          fi
          echo "PASS"
