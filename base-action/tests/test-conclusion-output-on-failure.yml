name: Test conclusion output is set to failure on error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No auth provided — action will fail at validation
          # The action sets conclusion output to "failure" even when it fails

      - name: Assert conclusion output is set to failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            # When the action fails, it should set conclusion to "failure"
            if [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: conclusion output is 'failure' as expected"
            else
              echo "FAIL: expected conclusion='failure' but got '$CONCLUSION'"
              exit 1
            fi
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded (e.g. with a real API key injected), check conclusion is set
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
