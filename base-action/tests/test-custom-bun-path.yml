name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun for use as custom executable
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Create a bun wrapper and fake claude executable
        run: |
          # Find the real bun
          REAL_BUN="$(which bun)"
          echo "Real bun at: $REAL_BUN"

          # Create a wrapper bun that delegates to the real bun
          mkdir -p /tmp/custom-bun-dir
          cat > /tmp/custom-bun-dir/bun << EOF
          #!/bin/sh
          echo "custom-bun-wrapper: delegating to real bun at $REAL_BUN"
          exec "$REAL_BUN" "\$@"
          EOF
          chmod +x /tmp/custom-bun-dir/bun
          echo "Custom bun wrapper created at /tmp/custom-bun-dir/bun"

          # Create a fake claude executable to skip internet download
          mkdir -p /tmp/fake-claude-dir
          cat > /tmp/fake-claude-dir/claude << 'CLAUDEEOF'
          #!/bin/sh
          echo "fake claude: $@"
          exit 0
          CLAUDEEOF
          chmod +x /tmp/fake-claude-dir/claude
          echo "Fake claude created at /tmp/fake-claude-dir/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: "/tmp/custom-bun-dir/bun"
          path_to_claude_code_executable: "/tmp/fake-claude-dir/claude"
          # No API key — will fail at validation, but custom bun path should be used

      - name: Assert action used custom bun path and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (no API key), but it should have used our custom bun
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom bun path and failed gracefully as expected"
