name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake bun executable for testing
        run: |
          mkdir -p /tmp/fake-bun-dir
          # Create a minimal fake bun that delegates to the real bun if installed,
          # or just prints a message and exits 0 for install commands
          cat > /tmp/fake-bun-dir/bun << 'EOF'
          #!/bin/sh
          # Fake bun: pass through to real bun if available, otherwise handle install
          if command -v /usr/local/bin/bun >/dev/null 2>&1; then
            exec /usr/local/bin/bun "$@"
          fi
          # If real bun not found, just exit 0 for install commands
          case "$1" in
            install) echo "fake bun: install skipped"; exit 0 ;;
            run) echo "fake bun: run not supported without real bun"; exit 1 ;;
            *) echo "fake bun: unknown command $1"; exit 1 ;;
          esac
          EOF
          chmod +x /tmp/fake-bun-dir/bun
          echo "Fake bun created at /tmp/fake-bun-dir/bun"
          /tmp/fake-bun-dir/bun --version || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: "/tmp/fake-bun-dir/bun"
          # No API key — will fail at validation, but custom bun path should be used

      - name: Assert action ran with custom bun path (fails at auth, not bun setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (no credentials), but NOT because of bun setup
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected (no credentials)"
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion output is correct"
