name: Test custom bun executable path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install real bun and record its path
        run: |
          curl -fsSL https://bun.sh/install | bash
          BUN_PATH="$HOME/.bun/bin/bun"
          echo "BUN_PATH=$BUN_PATH" >> "$GITHUB_ENV"
          echo "Bun installed at: $BUN_PATH"
          "$BUN_PATH" --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: ${{ env.BUN_PATH }}
          # No API key — should fail at validation, not at bun setup

      - name: Assert action failed gracefully with conclusion=failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom bun path and failed gracefully at API key validation"
