name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install real bun first (needed for the fake bun to delegate to)
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: 1.3.6

      - name: Create fake bun and fake claude executables
        run: |
          # Create fake bun that delegates to real bun
          REAL_BUN="$(which bun)"
          mkdir -p /tmp/fake-bun-dir
          cat > /tmp/fake-bun-dir/bun << SCRIPT
          #!/bin/sh
          echo "FAKE BUN CALLED: \$@" >&2
          exec "$REAL_BUN" "\$@"
          SCRIPT
          chmod +x /tmp/fake-bun-dir/bun

          # Create fake claude to skip internet download
          mkdir -p /tmp/fake-claude-dir
          cat > /tmp/fake-claude-dir/claude << 'EOF'
          #!/bin/sh
          echo "Fake claude called" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-dir/claude

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: "/tmp/fake-bun-dir/bun"
          path_to_claude_code_executable: "/tmp/fake-claude-dir/claude"
          # No API key - will fail at validation

      - name: Assert action ran (with custom bun path, fails gracefully without API key)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail because no API key is provided
          # but it should have attempted to use the custom bun path
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with custom bun path and no API key"
