name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for custom path test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Get bun path
        id: bun_path
        run: |
          BUN_PATH=$(which bun)
          echo "bun_path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: ${{ steps.bun_path.outputs.bun_path }}
          # No API key → will fail at validation, but bun setup should succeed

      - name: Assert action ran (failed gracefully due to missing credentials)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail due to missing API key, not due to bun setup issues
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom bun path and failed gracefully at credential validation"
