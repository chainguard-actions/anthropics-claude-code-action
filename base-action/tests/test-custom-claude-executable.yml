name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude executable for testing
          echo "Fake claude called with args: $*" >&2
          # Output a minimal valid JSON response that the action might expect
          echo '{"type":"result","subtype":"success","result":"Hello from fake claude","session_id":"fake-session-123","is_error":false}'
          exit 0
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"
          /tmp/fake-claude-bin/claude --version || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "fake-key-for-testing"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action ran with custom claude executable or failed gracefully
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "execution_file: $EXECUTION_FILE"
          echo "session_id: $SESSION_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake claude executable used)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
