name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake Claude Code executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          echo "fake-claude: called with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          # No API key — action will fail at auth validation (before calling claude)

      - name: Assert action failed gracefully and conclusion output is set
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom executable path and failed gracefully (no API key)"
