name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude that exits with failure to simulate API error
          echo "fake-claude: called with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          anthropic_api_key: "sk-ant-fake-key-for-testing"

      - name: Assert action ran with custom executable (failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail because the fake claude exits with error
          # but it should fail gracefully (not crash the runner)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with custom executable"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion=$CONCLUSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
