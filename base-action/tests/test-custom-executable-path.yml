name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          # Create a minimal fake claude that outputs a valid JSON stream
          # The action reads JSONL output from claude CLI
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude executable for testing
          # Output a minimal valid JSONL response that the action can parse
          echo '{"type":"result","subtype":"success","result":"Hello from fake claude","session_id":"test-session-123","is_error":false}'
          exit 0
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"
          /tmp/fake-claude-bin/claude --version || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-testing"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action ran with custom executable
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action may succeed or fail depending on how it parses the fake output,
          # but it should NOT fail at the installation step — it should reach the run step.
          # Either outcome is acceptable as long as the step ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom executable"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom executable (failed at execution, not installation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
