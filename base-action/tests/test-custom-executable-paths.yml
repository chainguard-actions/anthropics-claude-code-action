name: Test custom bun and claude executable paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-bin

          # Create a fake claude executable that exits with failure
          cat > /tmp/fake-bin/claude << 'EOF'
          #!/bin/sh
          echo "fake-claude called with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-bin/claude

          echo "Created fake executables:"
          ls -la /tmp/fake-bin/

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-bin/claude"
          # No API key — action will fail at validation, but installation steps should be skipped

      - name: Assert action used custom paths and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (no API key), but it should have used the custom claude path
          # and set conclusion=failure
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom executable paths and failed gracefully"
