name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude Code executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          # Create a fake claude executable that outputs a minimal valid JSON stream
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Emit a minimal Claude Code SDK result message
          printf '{"type":"result","subtype":"success","result":"Hello from fake Claude","session_id":"test-session-123","is_error":false}\n'
          exit 0
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"
          /tmp/fake-claude-bin/claude --version || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-test-fake-key-for-custom-executable-test"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action ran with custom executable
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action may succeed or fail depending on how the SDK processes the fake output.
          # What matters is that it ran (not skipped) and used the custom executable path.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom executable (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
