name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude Code executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude that exits with error to simulate missing API key
          echo "Claude Code fake executable invoked with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello world"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          anthropic_api_key: "fake-key-for-testing"

      - name: Assert action ran with custom executable path (skipped installation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should either succeed (if fake claude somehow works) or
          # fail gracefully because the fake claude exits with error
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom executable"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake executable (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
