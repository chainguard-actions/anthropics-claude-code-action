name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude that exits with error to simulate API failure
          echo "fake-claude: called with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-invalid-key-for-testing"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action used custom executable and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail because the fake claude exits with error
          # but it should NOT fail at the installation step
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fake claude exits 1), got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully using custom executable path"
