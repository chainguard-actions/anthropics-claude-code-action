name: Test custom Claude executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          # Create a fake claude script that outputs a minimal valid JSON response
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/bash
          # Fake claude executable for testing
          # Output a minimal JSON response that the action can parse
          echo '{"type":"result","subtype":"success","result":"Hello from fake claude","session_id":"test-session-123","is_error":false}'
          exit 0
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"
          /tmp/fake-claude-bin/claude && echo "Fake claude runs OK"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-test-key"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action ran with custom executable (skipped installation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action may succeed or fail depending on how it parses the fake output,
          # but it should NOT crash the runner and should produce an outcome
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom executable"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with custom executable (fake output may not be parseable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
