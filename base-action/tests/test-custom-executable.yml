name: Test custom Claude Code executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude binary for testing custom executable path
          echo "fake-claude: invoked with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude binary created at /tmp/fake-claude-bin/claude"
          /tmp/fake-claude-bin/claude --version || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-testing-only"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action used custom executable and failed gracefully
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail because the fake claude binary exits 1,
          # but it should have used the custom path (skipping installation)
          # and set conclusion=failure
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake executable, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action used custom executable path and failed gracefully"
