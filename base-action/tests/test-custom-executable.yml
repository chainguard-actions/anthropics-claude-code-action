name: Test custom Claude Code executable path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake Claude Code executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          # Fake claude executable for testing custom path support
          echo "fake-claude: invoked with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-testing"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"

      - name: Assert action used custom executable and set conclusion output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should have run (not skipped) and set the conclusion output
          # It will fail because the fake claude exits 1, but conclusion must be set
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action failed but conclusion output was not set"
              exit 1
            fi
            if [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
              exit 1
            fi
            echo "PASS: action failed gracefully with custom executable, conclusion='$CONCLUSION'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
