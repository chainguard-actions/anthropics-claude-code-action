name: Test with fake API key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-testing-only"

      - name: Assert action failed gracefully with fake API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (invalid API key rejected by Anthropic API)
          # and set conclusion to 'failure'
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with a fake API key, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with a fake API key"
