name: Test Microsoft Foundry missing config fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_foundry: "true"
          # No ANTHROPIC_FOUNDRY_RESOURCE, no ANTHROPIC_FOUNDRY_BASE_URL — should fail validation

      - name: Assert action failed gracefully with missing Foundry config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing Foundry config, got outcome=$OUTCOME"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion=failure, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with missing Foundry config"
