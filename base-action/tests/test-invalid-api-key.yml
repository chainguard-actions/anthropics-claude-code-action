name: Test with invalid API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-invalid-key-for-testing"

      - name: Assert action failed gracefully with invalid API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (invalid key → API error) but set conclusion output
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome='$OUTCOME'"
            exit 1
          fi
          # conclusion should be set to "failure" even when the step fails
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with invalid API key (conclusion='$CONCLUSION')"
