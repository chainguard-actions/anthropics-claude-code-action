name: Test invalid API key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-invalid-key-for-testing"

      - name: Assert action failed gracefully (invalid API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (invalid key → API auth error)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid API key, got outcome='$OUTCOME'"
            exit 1
          fi
          # conclusion output should be 'failure' when the action catches an error
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with invalid API key"
