name: Test invalid plugin marketplace URL is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable that records invocations
        run: |
          mkdir -p "$RUNNER_TEMP/fake-claude"
          cat > "$RUNNER_TEMP/fake-claude/claude" <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-claude-calls.log
          exit 0
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/fake-claude/claude"
          chmod +x "$RUNNER_TEMP/fake-claude/claude"
          rm -f /tmp/fake-claude-calls.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-dummy"
          prompt: "Say hello"
          plugin_marketplaces: "http://example.com/not-a-git-url"
          path_to_claude_code_executable: ${{ runner.temp }}/fake-claude/claude
      - name: Assert action failed without installing anything
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid marketplace URL"
            exit 1
          fi
          if [ -f /tmp/fake-claude-calls.log ] && grep -q "marketplace" /tmp/fake-claude-calls.log; then
            cat /tmp/fake-claude-calls.log
            echo "FAIL: claude was invoked to add an invalid marketplace"
            exit 1
          fi
          echo "PASS"
