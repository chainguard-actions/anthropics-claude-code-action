name: Test invalid plugin name is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable
        run: |
          mkdir -p /tmp/fake-claude
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-claude/calls.log
          exit 0
          EOF
          chmod +x /tmp/fake-claude/claude
          rm -f /tmp/fake-claude/calls.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-not-used"
          prompt: "Say hello"
          plugins: "../../etc/evil-plugin"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed and never installed the plugin
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for path-traversal plugin name"
            exit 1
          fi
          if [ -f /tmp/fake-claude/calls.log ] && grep -q "evil-plugin" /tmp/fake-claude/calls.log; then
            echo "FAIL: claude was invoked with the invalid plugin"
            cat /tmp/fake-claude/calls.log
            exit 1
          fi
          echo "PASS"
