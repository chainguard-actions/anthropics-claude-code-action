name: Test missing authentication fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable (records invocation)
        run: |
          mkdir -p /tmp/fake-claude
          rm -f /tmp/fake-claude/invoked
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "fake claude invoked: $*" >> /tmp/fake-claude/invoked
          exit 1
          EOF
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on validation before running Claude
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without any auth credentials"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: conclusion should be 'failure' if set"
            exit 1
          fi
          if [ -f /tmp/fake-claude/invoked ]; then
            echo "FAIL: claude was invoked even though validation should fail first"
            cat /tmp/fake-claude/invoked
            exit 1
          fi
          echo "PASS"
