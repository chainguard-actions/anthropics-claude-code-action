name: Test missing prompt fails after writing inline settings JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable (records invocation)
        run: |
          mkdir -p /tmp/fake-claude
          rm -f /tmp/fake-claude/invoked
          rm -f "$HOME/.claude/settings.json"
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "fake claude invoked: $*" >> /tmp/fake-claude/invoked
          exit 1
          EOF
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-dummy-key-for-validation-test"
          settings: '{"model": "inline-test-model", "customKey": "inline-value"}'
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed because no prompt was given
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file is set"
            exit 1
          fi
          if [ -f /tmp/fake-claude/invoked ]; then
            echo "FAIL: claude was invoked without a prompt"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings JSON was merged into ~/.claude/settings.json
        run: |
          F="$HOME/.claude/settings.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: $F not created"
            exit 1
          fi
          cat "$F"
          for want in '"model": "inline-test-model"' '"customKey": "inline-value"' '"enableAllProjectMcpServers": true'; do
            if ! grep -qF "$want" "$F"; then
              echo "FAIL: missing $want"
              exit 1
            fi
          done
          echo "PASS"
