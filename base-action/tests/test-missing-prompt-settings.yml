name: Test missing prompt fails after applying settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable (skip network install)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-claude"
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > "$RUNNER_TEMP/fake-claude/claude"
          chmod +x "$RUNNER_TEMP/fake-claude/claude"
          rm -f "$HOME/.claude/settings.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-dummy"
          settings: '{"actTestMarker": "hello-from-test"}'
          path_to_claude_code_executable: ${{ runner.temp }}/fake-claude/claude
      - name: Assert action failed due to missing prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file is set"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings were merged and written
        run: |
          SETTINGS="$HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: $SETTINGS not found"
            exit 1
          fi
          cat "$SETTINGS"
          if ! grep -q '"actTestMarker": "hello-from-test"' "$SETTINGS"; then
            echo "FAIL: custom settings not merged"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": true' "$SETTINGS"; then
            echo "FAIL: enableAllProjectMcpServers not set"
            exit 1
          fi
          echo "PASS"
