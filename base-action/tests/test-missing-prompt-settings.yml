name: Test missing prompt fails (settings still applied)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake Claude CLI
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-claude/claude"
          rm -f "$HOME/.claude/settings.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-dummy-not-used"
          settings: '{"model": "test-model-from-settings", "customTestKey": "abc123"}'
          path_to_claude_code_executable: ${{ github.workspace }}/tests/fixtures/fake-claude/claude
      - name: Assert failure and settings file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file is set"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion 'failure'"
            exit 1
          fi
          SETTINGS="$HOME/.claude/settings.json"
          echo "--- $SETTINGS ---"
          cat "$SETTINGS" || { echo "FAIL: settings file missing"; exit 1; }
          if ! grep -q '"customTestKey": *"abc123"' "$SETTINGS"; then
            echo "FAIL: custom settings key not merged"
            exit 1
          fi
          if ! grep -q '"model": *"test-model-from-settings"' "$SETTINGS"; then
            echo "FAIL: model setting not merged"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": *true' "$SETTINGS"; then
            echo "FAIL: enableAllProjectMcpServers not set to true"
            exit 1
          fi
          echo "PASS"
