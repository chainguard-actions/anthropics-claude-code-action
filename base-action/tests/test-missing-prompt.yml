name: Test missing prompt fails after settings setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf "$HOME/.claude"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: sk-ant-dummy-never-sent
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on missing prompt after writing settings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file is given"
            exit 1
          fi
          SETTINGS="$HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.json was not written (action failed before prompt validation)"
            exit 1
          fi
          cat "$SETTINGS"
          VAL="$(jq -r '.enableAllProjectMcpServers' "$SETTINGS")"
          echo "enableAllProjectMcpServers: $VAL"
          if [ "$VAL" != "true" ]; then
            echo "FAIL: expected enableAllProjectMcpServers=true"
            exit 1
          fi
          if [ -f /tmp/claude-action/prompt.txt ]; then
            echo "FAIL: prompt file should not be created without a prompt"
            exit 1
          fi
          echo "PASS"
