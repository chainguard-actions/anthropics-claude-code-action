name: Test missing prompt graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Neither prompt nor prompt_file provided — should fail with validation error
          anthropic_api_key: "sk-ant-fake-key-for-testing"

      - name: Assert action failed gracefully with missing prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without prompt, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when no prompt provided"
