name: Test missing prompt fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create stub Claude executable (skip network install)
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "stub claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-placeholder"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed due to missing prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file given"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: conclusion should be 'failure' when set"
            exit 1
          fi
          if [ -f /tmp/claude-action/prompt.txt ]; then
            echo "FAIL: no prompt file should have been written"
            exit 1
          fi
          echo "PASS"
