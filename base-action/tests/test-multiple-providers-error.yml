name: Test multiple providers error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with multiple providers set
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          # Both Bedrock and Vertex set — should fail with mutual exclusivity error

      - name: Assert action failed due to multiple providers
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple providers, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when multiple providers are specified"
