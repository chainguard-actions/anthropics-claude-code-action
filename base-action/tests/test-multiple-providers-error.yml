name: Test multiple providers simultaneously fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          # Both providers set → should fail validation with mutual exclusivity error

      - name: Assert action failed gracefully with multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple providers, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when multiple providers are set"
