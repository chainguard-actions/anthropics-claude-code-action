name: Test multiple providers mutual exclusivity error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          # Both providers set — should fail with mutual exclusivity error

      - name: Assert action failed due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action must fail because multiple providers cannot be used simultaneously
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (multiple providers set)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with multiple providers error"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert conclusion is failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          # On validation failure, the action sets conclusion=failure
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: conclusion is '$CONCLUSION' (acceptable on validation failure)"
          else
            echo "FAIL: expected conclusion=failure but got '$CONCLUSION'"
            exit 1
          fi
