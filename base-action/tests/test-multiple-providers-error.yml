name: Test multiple providers mutual exclusivity error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
        continue-on-error: true

      - name: Assert action failed gracefully due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Setting both use_bedrock and use_vertex should trigger a validation error
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple providers set, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully when multiple providers were set"
