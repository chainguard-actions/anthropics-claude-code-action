name: Test multiple providers mutual exclusivity error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
        env:
          # Provide enough AWS/GCP env vars to pass individual provider checks
          # so the mutual exclusivity check is what triggers the error
          AWS_REGION: "us-east-1"
          AWS_ACCESS_KEY_ID: "fake-key"
          AWS_SECRET_ACCESS_KEY: "fake-secret"
          ANTHROPIC_VERTEX_PROJECT_ID: "fake-project"
          CLOUD_ML_REGION: "us-central1"

      - name: Assert action failed due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion output 'failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully when multiple providers specified"
