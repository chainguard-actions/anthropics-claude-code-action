name: Test multiple providers - mutual exclusivity error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable to skip internet download
        run: |
          mkdir -p /tmp/fake-claude-dir
          cat > /tmp/fake-claude-dir/claude << 'EOF'
          #!/bin/sh
          echo "Fake claude called" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-dir/claude

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          path_to_claude_code_executable: "/tmp/fake-claude-dir/claude"
          # Both providers set - should fail with mutual exclusivity error

      - name: Assert action failed gracefully due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (multiple providers), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when multiple providers are set"
