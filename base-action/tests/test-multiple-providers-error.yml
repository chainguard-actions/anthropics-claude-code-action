name: Test multiple providers mutual exclusivity error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          # Both providers set — should fail with mutual exclusivity error
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
          ANTHROPIC_VERTEX_PROJECT_ID: fake-project
          CLOUD_ML_REGION: us-central1

      - name: Assert action failed due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # With multiple providers, the action must fail at validation
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with multiple providers, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: action failed as expected with multiple providers (conclusion='$CONCLUSION')"
          else
            echo "FAIL: unexpected conclusion='$CONCLUSION'"
            exit 1
          fi
