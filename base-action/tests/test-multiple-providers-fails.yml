name: Test multiple providers fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Setting both use_bedrock and use_vertex should trigger mutual exclusivity error
          use_bedrock: "true"
          use_vertex: "true"
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
          ANTHROPIC_VERTEX_PROJECT_ID: fake-project
          CLOUD_ML_REGION: us-central1

      - name: Assert action failed due to multiple providers
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when multiple providers are set"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with multiple providers set simultaneously"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
