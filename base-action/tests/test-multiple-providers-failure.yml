name: Test multiple providers mutual exclusivity failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Both Bedrock and Vertex enabled simultaneously — mutual exclusivity violation
          use_bedrock: "true"
          use_vertex: "true"

      - name: Assert conclusion is failure due to multiple providers
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Multiple providers simultaneously must cause a validation failure
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion output 'failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully when multiple providers specified"
