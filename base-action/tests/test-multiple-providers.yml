name: Test multiple providers enabled simultaneously fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-claude
          rm -f /tmp/fake-claude/invoked
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "fake claude invoked: $*" >> /tmp/fake-claude/invoked
          exit 1
          EOF
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          use_vertex: "true"
          use_foundry: "true"
          prompt: "Say hello"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action rejected multiple providers
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when vertex and foundry are both enabled"
            exit 1
          fi
          if [ -f /tmp/fake-claude/invoked ]; then
            echo "FAIL: claude was invoked despite conflicting providers"
            exit 1
          fi
          echo "PASS"
