name: Test multiple providers fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable (skip network install)
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_REGION: us-east-1
          AWS_BEARER_TOKEN_BEDROCK: dummy
          ANTHROPIC_VERTEX_PROJECT_ID: dummy-project
          CLOUD_ML_REGION: us-east5
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when multiple providers are enabled"
            exit 1
          fi
          echo "PASS"
