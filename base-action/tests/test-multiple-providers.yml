name: Test multiple providers enabled fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      AWS_BEARER_TOKEN_BEDROCK: not-a-real-token
      ANTHROPIC_VERTEX_PROJECT_ID: fake-project
      CLOUD_ML_REGION: us-east5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake Claude CLI
        run: |
          mkdir -p /tmp/fake-claude
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-claude" /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf /tmp/fake-claude-logs
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "multi provider test"
          use_bedrock: "true"
          use_vertex: "true"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both Bedrock and Vertex are enabled"
            exit 1
          fi
          if [ -f /tmp/fake-claude-logs/stdin.log ]; then
            echo "FAIL: Claude CLI should not have been run"
            exit 1
          fi
          echo "PASS"
