name: Test no API key graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          prompt: "Say hello"
        continue-on-error: true

      - name: Assert action failed gracefully with conclusion=failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key, the action should fail (env validation error)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without API key, got outcome='$OUTCOME'"
            exit 1
          fi
          # The conclusion output should be set to 'failure'
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with conclusion=failure"
