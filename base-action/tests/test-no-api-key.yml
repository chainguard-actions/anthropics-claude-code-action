name: Test no API key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable to skip internet download
        run: |
          mkdir -p /tmp/fake-claude-dir
          cat > /tmp/fake-claude-dir/claude << 'EOF'
          #!/bin/sh
          echo "fake claude: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-claude-dir/claude
          echo "Fake claude created at /tmp/fake-claude-dir/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-claude-dir/claude"
          # No anthropic_api_key provided — should fail with validation error

      - name: Assert action failed gracefully with missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without an API key, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected"
