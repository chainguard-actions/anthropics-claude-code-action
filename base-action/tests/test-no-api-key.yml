name: Test no API key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no oauth token, no bedrock/vertex/foundry

      - name: Assert action failed gracefully (no API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without an API key, got outcome='$OUTCOME'"
            exit 1
          fi
          # When validation fails, the action sets conclusion=failure
          if [ "$CONCLUSION" != "failure" ] && [ -n "$CONCLUSION" ]; then
            echo "FAIL: expected conclusion='failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when no API key is provided"
