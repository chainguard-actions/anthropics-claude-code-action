name: Test no-auth graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no claude_code_oauth_token, no workload identity

      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without auth credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when no auth is provided"
          # The conclusion output should be set to 'failure' even on error
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion output is correct"
