name: Test no-auth graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no claude_code_oauth_token, no workload identity

      - name: Assert action failed gracefully with missing credentials
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail because no auth credentials were provided
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no auth credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, conclusion must be set
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion=$CONCLUSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert conclusion output is set on failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "conclusion: $CONCLUSION"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            # When the action fails, it sets conclusion=failure via core.setOutput
            if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
              echo "PASS: conclusion is '$CONCLUSION' (acceptable on auth failure)"
            else
              echo "FAIL: unexpected conclusion '$CONCLUSION' on failure"
              exit 1
            fi
          else
            echo "PASS: action succeeded, conclusion=$CONCLUSION"
          fi
