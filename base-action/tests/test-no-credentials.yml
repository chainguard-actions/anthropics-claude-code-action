name: Test no credentials - validation failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun and pre-install action dependencies
        run: |
          # Install bun to a known fixed path
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash
          echo "Bun installed at: $(which bun)"
          # Pre-install action dependencies so bun install --production is a no-op
          cd "$GITHUB_WORKSPACE"
          bun install --production

      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          echo "Fake claude: exiting with error" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          path_to_bun_executable: "/usr/local/bin/bun"
          # No anthropic_api_key, no claude_code_oauth_token, no workload identity

      - name: Assert action failed gracefully with no credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected without credentials"
