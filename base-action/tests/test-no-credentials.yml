name: Test no credentials graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no claude_code_oauth_token, no workload identity

      - name: Assert action failed gracefully with no credentials
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without credentials, the action must fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          # conclusion output should be set to 'failure'
          if [ "$CONCLUSION" != "failure" ] && [ -z "$CONCLUSION" ]; then
            echo "PASS: action failed as expected (conclusion='$CONCLUSION')"
          elif [ "$CONCLUSION" = "failure" ]; then
            echo "PASS: action failed as expected with conclusion='failure'"
          else
            echo "FAIL: unexpected conclusion='$CONCLUSION'"
            exit 1
          fi
