name: Test no credentials graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/claude << 'EOF'
          #!/bin/sh
          echo "fake-claude called with args: $*" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-bin/claude
          echo "Created fake claude at /tmp/fake-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_claude_code_executable: "/tmp/fake-bin/claude"
          # No anthropic_api_key, no oauth token, no bedrock/vertex/foundry

      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with conclusion='failure'"
