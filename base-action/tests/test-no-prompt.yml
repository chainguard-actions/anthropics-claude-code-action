name: Test action with no prompt (empty prompt)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "fake-key-for-testing"

      - name: Assert action handles empty prompt gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without a prompt, the action should either fail gracefully or
          # succeed if it handles empty prompts
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action handled empty prompt (conclusion='$CONCLUSION')"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with no prompt (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
