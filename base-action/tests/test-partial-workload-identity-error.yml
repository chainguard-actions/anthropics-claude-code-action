name: Test partial workload identity error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_federation_rule_id: "fdrl_fake_rule_id"
          # anthropic_organization_id is NOT set — partial workload identity should fail

      - name: Assert action failed due to partial workload identity config
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # With only federation_rule_id but no organization_id, action must fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with partial workload identity, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: action failed as expected with partial workload identity (conclusion='$CONCLUSION')"
          else
            echo "FAIL: unexpected conclusion='$CONCLUSION'"
            exit 1
          fi
