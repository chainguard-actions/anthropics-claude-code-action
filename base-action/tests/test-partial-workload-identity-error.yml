name: Test partial workload identity error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only federation rule ID (missing organization ID)
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          # anthropic_organization_id is intentionally omitted — partial workload identity

      - name: Assert action failed due to partial workload identity config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with partial workload identity, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with partial workload identity configuration"
