name: Test partial workload identity federation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only one of the two required federation inputs — should fail validation
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          # anthropic_organization_id is intentionally omitted

      - name: Assert action failed due to partial workload identity config
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion output 'failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with partial workload identity config"
