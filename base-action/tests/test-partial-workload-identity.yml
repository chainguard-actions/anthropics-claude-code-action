name: Test partial workload identity federation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          prompt: "Say hello"
          # Only federation_rule_id set, missing anthropic_organization_id
          anthropic_federation_rule_id: "fdrl_test_rule_id"
        continue-on-error: true

      - name: Assert action failed gracefully due to partial workload identity config
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Partial workload identity config (only rule_id, no org_id) should fail validation
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with partial workload identity config, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action failed gracefully with partial workload identity configuration"
