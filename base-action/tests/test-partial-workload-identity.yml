name: Test partial workload identity configuration error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only federation_rule_id set, but not anthropic_organization_id
          # This should fail with a partial workload identity error
          anthropic_federation_rule_id: "fdrl_test_rule_id"

      - name: Assert action failed due to partial workload identity
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to partial workload identity config, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when only one workload identity field was provided"
