name: Test partial workload identity fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only one of the two required workload identity fields is set
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          # anthropic_organization_id is intentionally omitted

      - name: Assert action failed gracefully with partial workload identity config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with partial workload identity configuration"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with only one workload identity field set"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
