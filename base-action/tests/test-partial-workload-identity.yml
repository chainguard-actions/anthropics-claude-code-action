name: Test partial workload identity fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Explicitly clear all auth credentials so runner-level env vars
    # don't accidentally provide authentication
    env:
      ANTHROPIC_API_KEY: ""
      CLAUDE_CODE_OAUTH_TOKEN: ""
      ANTHROPIC_FEDERATION_RULE_ID: ""
      ANTHROPIC_ORGANIZATION_ID: ""
      AWS_REGION: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_BEARER_TOKEN_BEDROCK: ""
      ANTHROPIC_VERTEX_PROJECT_ID: ""
      CLOUD_ML_REGION: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      ANTHROPIC_FOUNDRY_RESOURCE: ""
      ANTHROPIC_FOUNDRY_BASE_URL: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun to workspace
        run: |
          export BUN_INSTALL="$GITHUB_WORKSPACE/.bun"
          curl -fsSL https://bun.sh/install | bash
          echo "Bun installed at $GITHUB_WORKSPACE/.bun/bin/bun"
          "$GITHUB_WORKSPACE/.bun/bin/bun" --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only federation_rule_id set, missing anthropic_organization_id
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          # Use the fake claude executable to skip the network download
          path_to_claude_code_executable: "${{ github.workspace }}/tests/fixtures/fake-claude"
          path_to_bun_executable: "${{ github.workspace }}/.bun/bin/bun"

      - name: Assert action failed due to partial workload identity config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with partial workload identity config, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when only one workload identity field is provided"
