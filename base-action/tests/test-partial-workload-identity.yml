name: Test partial workload identity configuration error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only federation_rule_id set, missing anthropic_organization_id
          # Should fail with partial workload identity error
          anthropic_federation_rule_id: "fdrl_test_rule_id"

      - name: Assert action failed gracefully with conclusion=failure
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (partial workload identity), but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action correctly failed with partial workload identity configuration"
