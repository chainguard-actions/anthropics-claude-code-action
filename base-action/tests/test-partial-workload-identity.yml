name: Test partial workload identity failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # Only one of the two required workload identity fields provided
          anthropic_federation_rule_id: "fdrl_test123"
          # anthropic_organization_id is intentionally omitted

      - name: Assert action failed gracefully with partial workload identity
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with partial workload identity config, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected with partial workload identity"
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion to be 'failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: conclusion output is correct"
