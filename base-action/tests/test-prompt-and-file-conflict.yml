name: Test prompt and prompt_file are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake Claude CLI and prompt file
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-claude/claude"
          rm -f /tmp/fake-claude.log
          echo "file prompt CONFLICTMARKER" > "$RUNNER_TEMP/conflict-prompt.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "inline prompt CONFLICTMARKER"
          prompt_file: ${{ runner.temp }}/conflict-prompt.txt
          anthropic_api_key: "sk-ant-dummy-not-used"
          path_to_claude_code_executable: ${{ github.workspace }}/tests/fixtures/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both prompt and prompt_file are set"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion 'failure'"
            exit 1
          fi
          if [ -f /tmp/fake-claude.log ] && grep -q "CONFLICTMARKER" /tmp/fake-claude.log; then
            echo "FAIL: Claude CLI received a prompt despite the conflict"
            exit 1
          fi
          echo "PASS"
