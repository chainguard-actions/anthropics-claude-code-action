name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a prompt file
        run: |
          echo "Please say hello and confirm you received this prompt." > /tmp/test-prompt.txt
          echo "Prompt file created at /tmp/test-prompt.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          # No API key — action will fail at auth validation
          # This tests that prompt_file input is accepted without error before auth check

      - name: Assert action failed gracefully (auth error, not prompt_file error)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure' but got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action accepted prompt_file input and failed gracefully at auth validation"
