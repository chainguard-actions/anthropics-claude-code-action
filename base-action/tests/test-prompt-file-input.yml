name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a prompt file
        run: |
          echo "Say hello and list the files in the current directory." > /tmp/test-prompt.txt
          echo "Prompt file created at /tmp/test-prompt.txt"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          # No API key — action should fail at validation, but prompt_file input is exercised

      - name: Assert action handled prompt_file input (failed gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, prompt_file input accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion=$CONCLUSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
