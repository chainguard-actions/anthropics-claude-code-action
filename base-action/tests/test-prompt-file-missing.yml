name: Test nonexistent prompt_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable
        run: |
          mkdir -p "$RUNNER_TEMP/fake-claude"
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > "$RUNNER_TEMP/fake-claude/claude"
          chmod +x "$RUNNER_TEMP/fake-claude/claude"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-dummy"
          prompt_file: /tmp/definitely-does-not-exist-prompt.txt
          path_to_claude_code_executable: ${{ runner.temp }}/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing prompt file"
            exit 1
          fi
          echo "PASS"
