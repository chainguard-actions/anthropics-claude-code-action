name: Test nonexistent prompt_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf "$HOME/.claude" /tmp/does-not-exist-prompt.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: /tmp/does-not-exist-prompt.txt
          anthropic_api_key: sk-ant-dummy-never-sent
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on missing prompt file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent prompt_file"
            exit 1
          fi
          if [ ! -f "$HOME/.claude/settings.json" ]; then
            echo "FAIL: settings.json missing - action failed before prompt validation"
            exit 1
          fi
          echo "PASS"
