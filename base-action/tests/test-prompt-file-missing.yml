name: Test nonexistent prompt_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake Claude CLI
        run: chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-claude/claude"
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: /tmp/definitely-does-not-exist-prompt.txt
          anthropic_api_key: "sk-ant-dummy-not-used"
          path_to_claude_code_executable: ${{ github.workspace }}/tests/fixtures/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent prompt_file"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion 'failure'"
            exit 1
          fi
          echo "PASS"
