name: Test nonexistent prompt_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake Claude CLI
        run: |
          mkdir -p /tmp/fake-claude
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-claude/claude" /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f /tmp/fake-claude-args.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: /tmp/definitely-does-not-exist/prompt.txt
          anthropic_api_key: "sk-ant-test-not-real"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent prompt_file"
            exit 1
          fi
          if [ -s /tmp/fake-claude-args.log ]; then
            echo "FAIL: Claude CLI should not run"
            exit 1
          fi
          echo "PASS"
