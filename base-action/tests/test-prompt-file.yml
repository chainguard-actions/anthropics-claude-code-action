name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "List the files in the current directory" > /tmp/test-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          anthropic_api_key: ""

      - name: Assert action ran (prompt_file accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without an API key"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
