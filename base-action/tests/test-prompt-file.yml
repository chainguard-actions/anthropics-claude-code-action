name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "Say hello world" > /tmp/test-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          # No API key — will fail at validation, but prompt_file input is exercised

      - name: Assert action failed gracefully (no credentials, prompt_file input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when using prompt_file without credentials"
