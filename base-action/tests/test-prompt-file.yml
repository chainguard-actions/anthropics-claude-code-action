name: Test prompt_file input - file-based prompt
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun and pre-install action dependencies
        run: |
          # Install bun to a known fixed path
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash
          echo "Bun installed at: $(which bun)"
          # Pre-install action dependencies so bun install --production is a no-op
          cd "$GITHUB_WORKSPACE"
          bun install --production

      - name: Create prompt file and fake claude executable
        run: |
          echo "What is 2+2?" > /tmp/test-prompt.txt
          echo "Prompt file created at /tmp/test-prompt.txt"

          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          echo "Fake claude: authentication failed with fake key" >&2
          exit 1
          EOF
          chmod +x /tmp/fake-claude-bin/claude
          echo "Fake claude created at /tmp/fake-claude-bin/claude"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          anthropic_api_key: "sk-ant-fake-key-for-testing-only"
          path_to_claude_code_executable: "/tmp/fake-claude-bin/claude"
          path_to_bun_executable: "/usr/local/bin/bun"

      - name: Assert action ran with prompt_file (fails due to fake claude executable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # With a fake claude executable, the action should fail at the SDK level
          # (not at prompt loading stage), meaning prompt_file was read successfully
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake claude executable, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action processed prompt_file and failed gracefully at execution"
