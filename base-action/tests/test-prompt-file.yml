name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake Claude CLI and prompt file
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fake-claude/claude"
          rm -f /tmp/fake-claude.log
          echo "Unique prompt-file marker XYZZY42" > "$RUNNER_TEMP/my-prompt.txt"
      - id: action
        uses: .
        with:
          prompt_file: ${{ runner.temp }}/my-prompt.txt
          anthropic_api_key: "sk-ant-dummy-not-used"
          path_to_claude_code_executable: ${{ github.workspace }}/tests/fixtures/fake-claude/claude
      - name: Assert prompt file content reached Claude
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          cat /tmp/fake-claude.log || true
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion 'success'"
            exit 1
          fi
          if ! grep -q "XYZZY42" /tmp/fake-claude.log; then
            echo "FAIL: prompt file content not passed to Claude CLI"
            exit 1
          fi
          echo "PASS"
