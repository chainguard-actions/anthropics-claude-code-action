name: Test prompt_file input graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "What is 2 + 2?" > /tmp/test-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          # No credentials — action will fail at validation

      - name: Assert action failed gracefully (no credentials)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without credentials, the action must fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
            echo "PASS: action failed gracefully as expected (conclusion='$CONCLUSION')"
          else
            echo "FAIL: unexpected conclusion='$CONCLUSION'"
            exit 1
          fi
