name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "What is 2 + 2?" > /tmp/test-prompt.txt
          echo "Prompt file created:"
          cat /tmp/test-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/test-prompt.txt"
          anthropic_api_key: "sk-ant-invalid-key-for-testing"

      - name: Assert action ran with prompt_file (fails at API, not at file reading)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail at the API call (invalid key), not at reading the prompt file
          # If it failed at file reading, the error would be different
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid API key, got outcome='$OUTCOME'"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "failure" ]; then
            echo "FAIL: expected conclusion='failure' or empty, got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS: action processed prompt_file and failed gracefully at API call"
