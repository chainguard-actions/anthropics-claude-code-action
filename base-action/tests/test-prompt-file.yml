name: Test prompt_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create prompt file
        run: |
          echo "List the files in the current directory" > /tmp/my-prompt.txt
          echo "Prompt file created at /tmp/my-prompt.txt"
          cat /tmp/my-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt_file: "/tmp/my-prompt.txt"
          anthropic_api_key: ""

      - name: Assert action ran with prompt_file or failed gracefully
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key provided)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
