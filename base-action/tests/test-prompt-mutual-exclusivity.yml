name: Test prompt and prompt_file mutual exclusivity validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a prompt file for testing
        run: |
          echo "Say hello from file" > /tmp/test-prompt.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello inline"
          prompt_file: "/tmp/test-prompt.txt"
          anthropic_api_key: "sk-ant-fake-key-for-validation-test"
          # Both prompt and prompt_file provided — should fail validation

      - name: Assert action failed gracefully with both prompt inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to both prompt and prompt_file being set, but got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when both prompt and prompt_file are provided"
