name: Test settings file path is read and nonexistent prompt_file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude and settings file
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
          echo '{"actFileMarker": "from-file"}' > /tmp/act-settings.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: dummy-token-not-used
          settings: /tmp/act-settings.json
          prompt_file: /tmp/does-not-exist-prompt.txt
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on missing prompt file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent prompt_file"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings from file were merged
        run: |
          F="$HOME/.claude/settings.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: settings file not found"
            exit 1
          fi
          cat "$F"
          if ! grep -q '"actFileMarker": *"from-file"' "$F"; then
            echo "FAIL: settings from file not merged"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": *true' "$F"; then
            echo "FAIL: enableAllProjectMcpServers not set"
            exit 1
          fi
          echo "PASS"
