name: Test settings input as file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf "$HOME/.claude"
      # No prompt is given so the action stops right after writing settings.
      - id: action
        uses: .
        continue-on-error: true
        with:
          settings: ${{ github.workspace }}/tests/fixtures/claude-settings.json
          anthropic_api_key: sk-ant-dummy-never-sent
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings were loaded from file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no prompt provided)"
            exit 1
          fi
          SETTINGS="$HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: settings.json not written"
            exit 1
          fi
          cat "$SETTINGS"
          for pair in '.fixtureKey=from-fixture-file' '.model=claude-fixture-model' '.enableAllProjectMcpServers=true'; do
            key="${pair%%=*}"; want="${pair#*=}"
            actual="$(jq -r "$key" "$SETTINGS")"
            echo "$key = $actual"
            if [ "$actual" != "$want" ]; then
              echo "FAIL: expected $key to be '$want'"
              exit 1
            fi
          done
          echo "PASS"
