name: Test settings file path input is merged into Claude settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and existing settings
        run: |
          mkdir -p /tmp/fake-claude "$HOME/.claude"
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          echo '{"preExisting": "kept"}' > "$HOME/.claude/settings.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-not-used"
          settings: ${{ github.workspace }}/tests/fixtures/claude-settings.json
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert file settings merged with existing settings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          SETTINGS="$HOME/.claude/settings.json"
          cat "$SETTINGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because no prompt was provided"
            exit 1
          fi
          if [ "$(jq -r '.fixtureMarker' "$SETTINGS")" != "from-file" ]; then
            echo "FAIL: fixtureMarker missing"
            exit 1
          fi
          if [ "$(jq -r '.model' "$SETTINGS")" != "claude-test-model" ]; then
            echo "FAIL: model missing"
            exit 1
          fi
          if [ "$(jq -r '.preExisting' "$SETTINGS")" != "kept" ]; then
            echo "FAIL: pre-existing settings were lost"
            exit 1
          fi
          if [ "$(jq -r '.enableAllProjectMcpServers' "$SETTINGS")" != "true" ]; then
            echo "FAIL: enableAllProjectMcpServers not true"
            exit 1
          fi
          echo "PASS"
