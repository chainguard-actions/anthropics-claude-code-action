name: Test settings loaded from a file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable and reset settings
        run: |
          mkdir -p /tmp/fake-claude
          rm -f /tmp/fake-claude/invoked
          rm -f "$HOME/.claude/settings.json"
          cat > /tmp/fake-claude/claude <<'EOF'
          #!/bin/sh
          echo "fake claude invoked: $*" >> /tmp/fake-claude/invoked
          exit 1
          EOF
          chmod +x /tmp/fake-claude/claude
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-dummy-key-for-validation-test"
          settings: ${{ github.workspace }}/tests/fixtures/claude-settings.json
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action stopped at prompt validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no prompt provided)"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings file content was merged
        run: |
          F="$HOME/.claude/settings.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: $F not created"
            exit 1
          fi
          cat "$F"
          for want in 'fixture-model-from-file' 'from-settings-file' '"enableAllProjectMcpServers": true'; do
            if ! grep -qF "$want" "$F"; then
              echo "FAIL: missing $want"
              exit 1
            fi
          done
          echo "PASS"
