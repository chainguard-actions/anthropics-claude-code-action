name: Test settings input from file is merged into ~/.claude/settings.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake Claude CLI
        run: |
          mkdir -p /tmp/fake-claude
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-claude" /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf /tmp/fake-claude-logs
          rm -f "$HOME/.claude/settings.json"
      - id: action
        uses: .
        with:
          prompt: "settings test"
          settings: tests/fixtures/settings.json
          anthropic_api_key: "sk-ant-not-a-real-key"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings were merged
        run: |
          F="$HOME/.claude/settings.json"
          cat "$F"
          for pat in '"model": "claude-fixture-model"' '"ACT_FIXTURE_VAR": "fixture-value"' '"enableAllProjectMcpServers": true'; do
            if ! grep -q "$pat" "$F"; then
              echo "FAIL: missing $pat in settings"
              exit 1
            fi
          done
          echo "PASS"
