name: Test settings JSON input merges with existing settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and pre-existing settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -rf "$HOME/.claude"
          mkdir -p "$HOME/.claude"
          echo '{"existingKey":"keep-me","model":"old-model"}' > "$HOME/.claude/settings.json"
      # No prompt is given so the action stops right after writing settings,
      # without ever contacting the Anthropic API.
      - id: action
        uses: .
        continue-on-error: true
        with:
          settings: '{"model":"claude-test-model","env":{"FOO":"bar"}}'
          anthropic_api_key: sk-ant-dummy-never-sent
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings were merged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no prompt provided)"
            exit 1
          fi
          SETTINGS="$HOME/.claude/settings.json"
          cat "$SETTINGS"
          check() {
            actual="$(jq -r "$1" "$SETTINGS")"
            echo "$1 = $actual"
            if [ "$actual" != "$2" ]; then
              echo "FAIL: expected $1 to be '$2'"
              exit 1
            fi
          }
          check '.existingKey' 'keep-me'
          check '.model' 'claude-test-model'
          check '.env.FOO' 'bar'
          check '.enableAllProjectMcpServers' 'true'
          echo "PASS"
