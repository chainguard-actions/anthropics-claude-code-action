name: Test settings JSON is written and missing prompt fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake claude executable (skip network install)
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not be invoked" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: dummy-key-not-used
          settings: '{"actTestMarker": "json-input-value"}'
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert action failed on missing prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither prompt nor prompt_file is given"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings file was written with merged settings
        run: |
          F="$HOME/.claude/settings.json"
          echo "settings file: $F"
          if [ ! -f "$F" ]; then
            echo "FAIL: settings file not found"
            exit 1
          fi
          cat "$F"
          if ! grep -q '"actTestMarker": *"json-input-value"' "$F"; then
            echo "FAIL: settings input not merged"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": *true' "$F"; then
            echo "FAIL: enableAllProjectMcpServers not set"
            exit 1
          fi
          echo "PASS"
