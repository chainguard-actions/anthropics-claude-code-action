name: Test settings JSON input is written to Claude settings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake claude executable and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
      # No prompt is given, so the action writes settings and then fails
      # at prompt validation without ever contacting the Anthropic API.
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-not-used"
          settings: '{"testMarker": "from-json", "permissions": {"allow": ["Bash(ls)"]}}'
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings were written and run failed on missing prompt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          SETTINGS="$HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: $SETTINGS not created"
            exit 1
          fi
          cat "$SETTINGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because no prompt was provided"
            exit 1
          fi
          if [ "$(jq -r '.testMarker' "$SETTINGS")" != "from-json" ]; then
            echo "FAIL: testMarker not merged"
            exit 1
          fi
          if [ "$(jq -r '.permissions.allow[0]' "$SETTINGS")" != "Bash(ls)" ]; then
            echo "FAIL: permissions not merged"
            exit 1
          fi
          if [ "$(jq -r '.enableAllProjectMcpServers' "$SETTINGS")" != "true" ]; then
            echo "FAIL: enableAllProjectMcpServers not true"
            exit 1
          fi
          echo "PASS"
