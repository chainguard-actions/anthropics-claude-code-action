name: Test settings JSON is written to ~/.claude/settings.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare placeholder Claude executable and clean settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "fake claude should not run" >&2\nexit 1\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
      # No prompt is given: the action writes settings first, then fails
      # prompt validation before ever invoking Claude.
      - id: action
        uses: .
        continue-on-error: true
        with:
          settings: '{"actHarnessMarker": "marker-value-42", "model": "claude-test-model"}'
          anthropic_api_key: "sk-ant-dummy-not-used"
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings file contents
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          SETTINGS="$HOME/.claude/settings.json"
          if [ ! -f "$SETTINGS" ]; then
            echo "FAIL: $SETTINGS was not created"; exit 1
          fi
          cat "$SETTINGS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to missing prompt"; exit 1
          fi
          if ! grep -q '"actHarnessMarker": *"marker-value-42"' "$SETTINGS"; then
            echo "FAIL: custom setting not merged"; exit 1
          fi
          if ! grep -q '"model": *"claude-test-model"' "$SETTINGS"; then
            echo "FAIL: model setting not merged"; exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": *true' "$SETTINGS"; then
            echo "FAIL: enableAllProjectMcpServers not set to true"; exit 1
          fi
          echo "PASS"
