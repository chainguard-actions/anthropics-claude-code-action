name: Test settings JSON is written to ~/.claude/settings.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create stub Claude executable and clear settings
        run: |
          mkdir -p /tmp/fake-claude
          printf '#!/bin/sh\necho "stub claude $*"\nexit 0\n' > /tmp/fake-claude/claude
          chmod +x /tmp/fake-claude/claude
          rm -f "$HOME/.claude/settings.json"
      # No prompt is given, so the action fails after writing settings and
      # before ever invoking Claude (no real API call is made).
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-placeholder"
          settings: '{"model": "act-test-model-xyz", "env": {"ACT_TEST_VAR": "hello"}}'
          path_to_claude_code_executable: /tmp/fake-claude/claude
      - name: Assert settings file content
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no prompt provided)"
            exit 1
          fi
          F="$HOME/.claude/settings.json"
          if [ ! -f "$F" ]; then
            echo "FAIL: $F not created"
            exit 1
          fi
          cat "$F"
          if ! grep -q '"act-test-model-xyz"' "$F"; then
            echo "FAIL: model setting not merged"
            exit 1
          fi
          if ! grep -q '"ACT_TEST_VAR"' "$F"; then
            echo "FAIL: env setting not merged"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": true' "$F"; then
            echo "FAIL: enableAllProjectMcpServers not set to true"
            exit 1
          fi
          echo "PASS"
