name: Test settings JSON input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FAKE_CLAUDE_LOG_DIR: /tmp/fake-claude-settings
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake claude CLI
        run: |
          rm -rf "$FAKE_CLAUDE_LOG_DIR"
          mkdir -p "$RUNNER_TEMP/fake-bin"
          install -m 0755 tests/fixtures/fake-claude.js "$RUNNER_TEMP/fake-bin/claude"
          echo "FAKE_CLAUDE=$RUNNER_TEMP/fake-bin/claude" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          prompt: "Hello settings"
          anthropic_api_key: sk-ant-test-not-a-real-key
          path_to_claude_code_executable: ${{ env.FAKE_CLAUDE }}
          settings: '{"env":{"SETTINGS_MARKER":"marker-9911"}}'
      - name: Assert conclusion is success
        env:
          ACTUAL: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "success" ]; then
            echo "FAIL: expected 'success'"
            exit 1
          fi
          echo "PASS"
      - name: Assert settings file written
        run: |
          F="$HOME/.claude/settings.json"
          cat "$F" || true
          if ! grep -q 'marker-9911' "$F"; then
            echo "FAIL: settings marker not found in $F"
            exit 1
          fi
          if ! grep -q '"enableAllProjectMcpServers": true' "$F"; then
            echo "FAIL: enableAllProjectMcpServers not set"
            exit 1
          fi
          echo "PASS"
