name: Test Vertex AI provider missing required config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_vertex: "true"
          # No ANTHROPIC_VERTEX_PROJECT_ID or CLOUD_ML_REGION set — should fail validation

      - name: Assert action failed gracefully with missing Vertex AI config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Vertex AI is selected without required config, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed as expected when Vertex AI is selected without ANTHROPIC_VERTEX_PROJECT_ID and CLOUD_ML_REGION"
