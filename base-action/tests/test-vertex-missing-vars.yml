name: Test Vertex AI validation fails gracefully without required vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_vertex: "true"
          # No ANTHROPIC_VERTEX_PROJECT_ID, no CLOUD_ML_REGION — should fail validation

      - name: Assert action failed gracefully with missing Vertex AI vars
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without Vertex AI credentials, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected when Vertex AI vars are missing"
