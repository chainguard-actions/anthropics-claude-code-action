name: Test allowed bots input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          allowed_bots: "dependabot[bot],renovate[bot]"
          prompt: "Check for dependency updates"
          # No API key — expected to fail gracefully

      - name: Assert action ran with allowed_bots input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with allowed_bots configured"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
