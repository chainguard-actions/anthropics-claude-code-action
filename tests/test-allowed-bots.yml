name: Test allowed bots configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          allowed_bots: "dependabot[bot],renovate[bot]"
          github_token: ${{ github.token }}

      - name: Assert action ran with allowed_bots config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with allowed_bots configuration"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Anthropic API key in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
