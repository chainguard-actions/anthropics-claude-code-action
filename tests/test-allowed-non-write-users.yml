name: Test - Allowed non-write users input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          allowed_non_write_users: "*"
          # No API key — expect graceful failure after subprocess isolation setup

      - name: Assert action ran with allowed_non_write_users (failed gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key, subprocess isolation was attempted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
