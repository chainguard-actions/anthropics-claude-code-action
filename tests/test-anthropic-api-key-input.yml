name: Test anthropic_api_key and base_branch inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: /tmp/github-events/event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun to system PATH
        run: |
          curl -fsSL https://bun.sh/install | bash
          cp "$HOME/.bun/bin/bun" /usr/local/bin/bun
          bun --version

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-fake-key-for-testing"
          base_branch: "main"
          github_token: ${{ github.token }}
          prompt: "Say hello"
          path_to_bun_executable: /usr/local/bin/bun

      - name: Assert action ran with anthropic_api_key and base_branch inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the API key is fake, but it should
          # accept the inputs and attempt to run (not fail at input validation)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted anthropic_api_key and base_branch inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
