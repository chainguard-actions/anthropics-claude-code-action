name: Test Anthropic Auth Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "fake-key-for-input-coverage"
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          anthropic_oidc_audience: "https://api.anthropic.com"
          anthropic_organization_id: "org-test-uuid-1234"
          anthropic_service_account_id: "svac_test_service_account"
          anthropic_workspace_id: "wrkspc_test_workspace"
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (inputs accepted, fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real API credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
