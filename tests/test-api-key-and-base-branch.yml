name: Test anthropic_api_key and base_branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-invalid-key-for-coverage"
          base_branch: "main"
          prompt: "Say hello"
          github_token: ${{ github.token }}

      - name: Assert action ran with anthropic_api_key and base_branch inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the API key is invalid,
          # but it must have accepted the inputs and attempted to run.
          # A skipped outcome would indicate the inputs were rejected at parse time.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — inputs may not have been accepted"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) with anthropic_api_key and base_branch inputs accepted"
