name: Test API key, GitHub token, and base branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          github_token: ${{ github.token }}
          base_branch: "main"
          # Fake API key — action should fail gracefully at auth stage

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key rejected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$CONCLUSION" ]; then
              echo "WARN: conclusion output is empty on success"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
