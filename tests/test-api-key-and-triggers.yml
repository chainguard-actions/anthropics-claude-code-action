name: Test API key auth with assignee trigger and base branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Cover anthropic_api_key input (placeholder — no real key in CI)
          anthropic_api_key: "sk-ant-placeholder-for-input-coverage"
          # Cover assignee_trigger input
          assignee_trigger: "claude"
          # Cover base_branch input
          base_branch: "main"
          # Provide github_token to avoid OIDC exchange
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          # No prompt — should trigger early exit without calling the API
        continue-on-error: true

      - name: Assert action completed without infrastructure crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should succeed (no-trigger skip) or fail gracefully
          # (e.g., invalid placeholder API key rejected before trigger check).
          # Either way, it must not crash before processing inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME) — inputs accepted"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
