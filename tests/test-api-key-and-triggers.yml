name: Test API key, assignee trigger, and base branch inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-fake-key-for-coverage-testing"
          assignee_trigger: "claude"
          base_branch: "main"
          trigger_phrase: "@claude"
          prompt: "Say hello"
      - name: Assert action ran with these inputs (graceful failure expected on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with anthropic_api_key, assignee_trigger, and base_branch inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
