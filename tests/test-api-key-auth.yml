name: Test API key authentication inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-fake-key-for-input-coverage"
          github_token: ${{ github.token }}
          prompt: "Say hello"
          trigger_phrase: "@claude"
      - name: Assert action ran with api key and github token inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with anthropic_api_key and github_token inputs set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
