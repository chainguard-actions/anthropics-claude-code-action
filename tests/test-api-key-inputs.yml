name: Test API key and trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-key-not-real"
          claude_code_oauth_token: "test-oauth-token-not-real"
          assignee_trigger: "claude"
          base_branch: "main"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (even if it failed due to invalid credentials)
        run: |
          echo "Action completed (with or without error due to test credentials)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with an auth error, not a setup error
          # We just verify the step ran (outcome is set)
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: step outcome not set"
            exit 1
          fi
          echo "PASS: step ran with expected inputs"
