name: Test anthropic_api_key, assignee_trigger, and base_branch inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Cover anthropic_api_key, assignee_trigger, and base_branch inputs
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          assignee_trigger: "claude"
          base_branch: "main"
          prompt: "Say hello"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action attempted to run (inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the API key is fake, but the inputs
          # (anthropic_api_key, assignee_trigger, base_branch) must be accepted.
          # Either failure (bad key) or success (skip path) is acceptable —
          # what matters is the inputs were passed without a config error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted anthropic_api_key, assignee_trigger, and base_branch inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
