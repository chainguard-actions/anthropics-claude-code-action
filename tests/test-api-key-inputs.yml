name: Test API key and trigger inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Pass API key and OAuth token inputs (no prompt → action skips cleanly)
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage"
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"
          assignee_trigger: "claude"
          base_branch: "main"
          github_token: ${{ github.token }}

      - name: Assert action accepted all inputs and skipped cleanly
        env:
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "execution_file: '$EXECUTION_FILE'"
          # No trigger in workflow_dispatch context → action should skip cleanly
          # (no execution file produced)
          if [ -n "$EXECUTION_FILE" ]; then
            echo "FAIL: expected empty execution_file but got: $EXECUTION_FILE"
            exit 1
          fi
          echo "PASS: action accepted anthropic_api_key, claude_code_oauth_token, assignee_trigger, base_branch and skipped cleanly"
