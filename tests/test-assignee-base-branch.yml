name: Test assignee_trigger and base_branch inputs (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          assignee_trigger: "claude"
          base_branch: "main"
          # No prompt — action exits early after token setup (no trigger)

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (skip path) or fail with an
          # auth/validation error — NOT be cancelled.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME (assignee_trigger and base_branch inputs accepted)"

      - name: Assert no branch was created (early exit, no trigger)
        env:
          ACTUAL: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "branch_name: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no branch on early exit, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: no branch created on early exit"
