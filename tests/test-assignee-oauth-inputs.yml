name: Test assignee trigger, base branch, and OAuth token inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No real prompt — action should skip gracefully or fail at auth
          prompt: ""
          github_token: ${{ github.token }}
          # Inputs under test
          assignee_trigger: "claude"
          base_branch: "main"
          claude_code_oauth_token: "dummy-oauth-token-for-coverage"

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either skip gracefully or fail at auth — not be cancelled
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with assignee/oauth inputs, outcome=$OUTCOME (skip or expected auth failure)"
