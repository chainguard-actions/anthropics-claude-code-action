name: Test assignee_trigger and claude_code_oauth_token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          assignee_trigger: "claude"
          claude_code_oauth_token: "test-invalid-oauth-token-for-coverage"
          prompt: "Say hello"
          github_token: ${{ github.token }}

      - name: Assert action ran with assignee_trigger and claude_code_oauth_token inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the OAuth token is invalid,
          # but it must have accepted the inputs and attempted to run.
          # A skipped outcome would indicate the inputs were rejected at parse time.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — inputs may not have been accepted"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME) with assignee_trigger and claude_code_oauth_token inputs accepted"
