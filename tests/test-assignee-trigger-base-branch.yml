name: Test Assignee Trigger and Base Branch Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          assignee_trigger: claude
          base_branch: main
          prompt: "Say hello"
          github_token: ${{ github.token }}
          anthropic_api_key: dummy-key-for-input-coverage
      - name: Assert action ran (assignee_trigger and base_branch inputs accepted)
        run: |
          # The action will fail due to invalid API key, but the inputs must be accepted.
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: assignee_trigger and base_branch inputs were accepted by the action"
