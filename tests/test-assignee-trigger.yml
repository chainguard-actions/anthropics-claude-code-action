name: Test assignee_trigger input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with an assignee_trigger configured.
      # Under workflow_dispatch there is no assignee event, so the action
      # should exit early (no trigger matched) without needing an API key.
      # github_token is provided to bypass the OIDC token exchange.
      - id: action
        uses: .
        with:
          assignee_trigger: "claude"
          github_token: ${{ github.token }}
          # No prompt — action should skip gracefully with no trigger
        continue-on-error: true

      - name: Assert action ran with assignee_trigger input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With assignee_trigger set but no matching event, the action should
          # exit early (success) or fail at some later validation step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted assignee_trigger input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
