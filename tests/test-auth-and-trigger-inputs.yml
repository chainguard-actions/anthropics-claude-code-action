name: Test auth and trigger inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Auth inputs — values are placeholders; action skips gracefully without a real key
          anthropic_api_key: "placeholder-api-key"
          claude_code_oauth_token: "placeholder-oauth-token"
          # Trigger configuration inputs
          assignee_trigger: "claude"
          base_branch: "main"
          # Provide github_token so the action can resolve a token
          github_token: ${{ github.token }}
          # No prompt — action will skip gracefully

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with auth and trigger inputs"
          echo "PASS"

      - name: Assert github_token output is set
        env:
          ACTUAL: ${{ steps.action.outputs.github_token }}
        run: |
          echo "github_token output present: $([ -n "$ACTUAL" ] && echo yes || echo no)"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected github_token output to be set"
            exit 1
          fi
          echo "PASS: github_token output is set"
