name: Test auth inputs accepted, no prompt skips execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: sk-ant-test-dummy-key
          claude_code_oauth_token: dummy-oauth-token
          anthropic_federation_rule_id: fdrl_test123
          anthropic_organization_id: 00000000-0000-0000-0000-000000000000
          anthropic_service_account_id: svac_test123
          anthropic_workspace_id: wrkspc_test123
          anthropic_oidc_audience: https://api.anthropic.com
          classify_inline_comments: "false"
      - name: Assert github_token output is the provided token
        env:
          ACTUAL: ${{ steps.action.outputs.github_token }}
          EXPECTED: ${{ github.token }}
        run: |
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: github_token output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: github_token output does not match provided token"
            exit 1
          fi
          echo "PASS"
      - name: Assert Claude did not run
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "conclusion: '$CONCLUSION'"
          echo "execution_file: '$EXEC_FILE'"
          echo "branch_name: '$BRANCH'"
          if [ -n "$CONCLUSION" ] || [ -n "$EXEC_FILE" ] || [ -n "$BRANCH" ]; then
            echo "FAIL: expected skip with no conclusion/execution_file/branch_name"
            exit 1
          fi
          echo "PASS"
