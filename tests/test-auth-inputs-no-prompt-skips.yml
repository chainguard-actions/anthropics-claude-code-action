name: Test auth inputs without prompt skip gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: "sk-ant-test-not-a-real-key"
          claude_code_oauth_token: "oauth-test-not-a-real-token"
          anthropic_federation_rule_id: "fdrl_test123"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test123"
          anthropic_workspace_id: "wrkspc_test123"
          anthropic_oidc_audience: "https://api.anthropic.com"
          classify_inline_comments: "false"
      - name: Assert action skipped without running Claude
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
          TOKEN_OUT: ${{ steps.action.outputs.github_token }}
          EXPECTED_TOKEN: ${{ github.token }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          echo "execution_file: '$EXEC_FILE'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success outcome"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: conclusion should be empty when no prompt"
            exit 1
          fi
          if [ -n "$EXEC_FILE" ]; then
            echo "FAIL: execution_file should be empty when Claude did not run"
            exit 1
          fi
          if [ "$TOKEN_OUT" != "$EXPECTED_TOKEN" ]; then
            echo "FAIL: github_token output does not match the provided token"
            exit 1
          fi
          echo "PASS"
