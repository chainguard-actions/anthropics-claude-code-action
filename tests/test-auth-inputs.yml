name: Test auth inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with anthropic_api_key and github_token
        id: action-api-key
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-fake-key-for-coverage"
          github_token: ${{ github.token }}
          assignee_trigger: "claude"
          claude_code_oauth_token: ""
          prompt: "Say hello"

      - name: Assert action ran (fails gracefully with fake API key)
        env:
          OUTCOME: ${{ steps.action-api-key.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
