name: Test auth and trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for action
        run: |
          curl -fsSL https://bun.sh/install | bash
          BUN_BIN="$HOME/.bun/bin/bun"
          echo "BUN_BIN=$BUN_BIN" >> "$GITHUB_ENV"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello world"
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"
          assignee_trigger: "claude"
          base_branch: "main"
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ env.BUN_BIN }}
          path_to_claude_code_executable: "/usr/bin/true"

      - name: Assert action ran with auth inputs (or failed gracefully)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake API key rejected, auth inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
