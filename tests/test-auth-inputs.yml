name: Test auth inputs (anthropic_api_key, claude_code_oauth_token, assignee_trigger)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Provide github_token to bypass OIDC exchange
          github_token: ${{ github.token }}
          # Provide a prompt so containsTrigger is true and we proceed past the skip
          prompt: "Say hello"
          # Auth inputs under test — fake key will cause API auth failure
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          claude_code_oauth_token: ""
          # Trigger inputs under test
          assignee_trigger: "claude"
        continue-on-error: true

      - name: Assert action attempted to run (failed due to invalid API key, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the fake API key is rejected,
          # not because the inputs were missing or unrecognized.
          # Either failure or success is acceptable here — what matters is
          # that the inputs were accepted without an "unknown input" error.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted the inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
