name: Test auth and trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with auth and trigger inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-fake-key-for-coverage"
          claude_code_oauth_token: "fake-oauth-token-for-coverage"
          github_token: ${{ github.token }}
          assignee_trigger: "claude"
          base_branch: "main"
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (fails gracefully without valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a deterministic outcome ($OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
