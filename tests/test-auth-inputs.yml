name: Test auth inputs (api key, oauth token, github token, base branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with anthropic_api_key, github_token, base_branch inputs
        id: action-api-key
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-fake-key-for-input-coverage"
          github_token: ${{ github.token }}
          base_branch: "main"
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (api-key scenario)
        env:
          OUTCOME: ${{ steps.action-api-key.outcome }}
          CONCLUSION: ${{ steps.action-api-key.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid API key or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Test with claude_code_oauth_token input
        id: action-oauth
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"
          github_token: ${{ github.token }}
          base_branch: "main"
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (oauth scenario)
        env:
          OUTCOME: ${{ steps.action-oauth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid OAuth token or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
