name: Test auth inputs (api key, oauth token, github token, base branch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          claude_code_oauth_token: ""
          github_token: ${{ github.token }}
          base_branch: "main"
          prompt: "Say hello"
          trigger_phrase: "@claude"
      - name: Assert action ran (fails gracefully without valid API key or real repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected failure without valid API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
