name: Test auth inputs (api key, oauth token, assignee trigger)
on:
  workflow_dispatch:
jobs:
  test-api-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Cover anthropic_api_key input (fake key — action will fail at API call, not at input parsing)
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          # Cover assignee_trigger input
          assignee_trigger: "claude"
          # Cover claude_code_oauth_token input (also provided to exercise the input path)
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"
          # Provide github_token to bypass OIDC exchange
          github_token: ${{ github.token }}
          # No prompt — action should skip gracefully (no trigger found)
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either skip gracefully (success) or fail at API auth (failure).
          # Either is acceptable — what matters is that the inputs were accepted without a
          # parse/validation error about the input names themselves.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action skipped gracefully with auth inputs provided"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed (expected — fake API key / no real trigger), inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
