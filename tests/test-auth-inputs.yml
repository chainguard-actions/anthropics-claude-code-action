name: Test auth inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "placeholder-not-real"
          claude_code_oauth_token: "placeholder-not-real"
          anthropic_federation_rule_id: "fdrl_placeholder"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_placeholder"
          anthropic_workspace_id: "wrkspc_placeholder"
          anthropic_oidc_audience: "https://api.anthropic.com"
          github_token: ${{ github.token }}
          prompt: "Say hello"

      - name: Assert action ran (auth inputs accepted, failure expected without real key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real API key provided)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
