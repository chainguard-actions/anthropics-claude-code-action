name: Test base_branch input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a base_branch configured.
      # The base_branch input controls which branch Claude uses as the base
      # when creating new branches. Under workflow_dispatch with no prompt,
      # the action should exit early without needing an API key.
      # github_token is provided to bypass the OIDC token exchange.
      - id: action
        uses: .
        with:
          base_branch: "main"
          branch_prefix: "claude/"
          github_token: ${{ github.token }}
          # No prompt — action should skip gracefully with no trigger
        continue-on-error: true

      - name: Assert action ran with base_branch input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With base_branch set but no prompt/trigger, the action should
          # exit early (success) or fail at some later validation step.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted base_branch input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
