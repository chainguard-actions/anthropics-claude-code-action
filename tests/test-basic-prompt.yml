name: Test basic prompt invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello world"
          anthropic_api_key: "sk-ant-fake-key-for-testing"

      - name: Assert action ran and produced a conclusion output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid API key or real repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
