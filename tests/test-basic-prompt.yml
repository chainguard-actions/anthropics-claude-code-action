name: Test basic prompt usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello world"
          # No API key provided — action will fail at the Claude invocation step,
          # but we verify it gets that far (Bun installs, deps load, entrypoint runs).

      - name: Assert action ran and produced a conclusion output or failed gracefully
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action must either succeed (conclusion=success) or fail gracefully
          # (no API key → the entrypoint exits with failure).
          # What we must NOT see is a completely unexpected outcome.
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CONCLUSION" != "success" ]; then
              echo "FAIL: action succeeded but conclusion is not 'success': '$CONCLUSION'"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion=$CONCLUSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key provided, as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
