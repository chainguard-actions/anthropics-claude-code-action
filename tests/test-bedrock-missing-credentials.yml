name: Test Bedrock mode missing credentials error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Enable Bedrock mode but provide no AWS credentials
          use_bedrock: "true"
          prompt: "Say hello"
          github_token: ${{ github.token }}
          # No AWS_REGION, AWS_ACCESS_KEY_ID, etc. — should fail with clear error
        continue-on-error: true

      - name: Assert action failed with Bedrock credential error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail because no AWS credentials are provided for Bedrock
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to missing Bedrock credentials"
            exit 1
          fi
          echo "PASS: action correctly failed when Bedrock credentials were missing"
