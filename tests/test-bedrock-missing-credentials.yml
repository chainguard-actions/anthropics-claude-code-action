name: Test Bedrock mode fails with expected AWS credential error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          github_token: ${{ github.token }}
          # No AWS credentials provided — should fail with AWS-specific error

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without AWS credentials"
            exit 1
          fi
          echo "PASS: action failed as expected when Bedrock selected but no AWS credentials provided (outcome=$OUTCOME)"
