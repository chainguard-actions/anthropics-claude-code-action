name: Test Bedrock missing credentials error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          github_token: ${{ github.token }}
          use_bedrock: "true"
          # No AWS credentials provided — action should fail with AWS validation error

      - name: Assert action failed due to missing AWS credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing AWS credentials, got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when use_bedrock=true but no AWS credentials provided"
