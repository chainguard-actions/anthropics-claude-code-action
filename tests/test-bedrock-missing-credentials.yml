name: Test Bedrock mode fails clearly without AWS credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with use_bedrock=true but no AWS credentials
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS_REGION, AWS_ACCESS_KEY_ID, etc. — should fail at env validation

      - name: Assert action failed (not succeeded or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without AWS credentials, the action must fail — not succeed or be cancelled
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without AWS credentials"
            exit 1
          fi
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action failed as expected when Bedrock credentials are missing (outcome=$OUTCOME)"
