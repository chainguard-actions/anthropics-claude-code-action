name: Test Bedrock provider fails without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Enable Bedrock but provide no AWS credentials.
          # The action should fail at validateEnvironmentVariables with
          # "AWS_REGION is required when using AWS Bedrock."
          use_bedrock: "true"
          prompt: "Say hello"
        continue-on-error: true
      - name: Assert action failed due to missing AWS credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without AWS credentials, the action must fail (not succeed silently).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without AWS credentials for Bedrock"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
              echo "PASS: action reported failure conclusion for Bedrock without credentials"
            else
              echo "FAIL: action unexpectedly succeeded without AWS credentials"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
