name: Test Bedrock missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with use_bedrock=true and a prompt but no AWS credentials.
      # The action should fail with a clear error about missing AWS credentials,
      # not a generic crash.
      - id: action
        uses: .
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed with Bedrock credential error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing AWS credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Bedrock credentials were missing"
