name: Test Bedrock provider configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_bedrock: "true"
          # No AWS credentials — will fail, but tests that Bedrock inputs are accepted

      - name: Assert action failed due to missing AWS credentials not bad inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing AWS credentials), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted Bedrock provider inputs and failed as expected (missing credentials)"
