name: Test boolean inputs (use_sticky_comment, classify_inline_comments)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with boolean inputs set (no prompt, should skip gracefully)
        id: action
        uses: .
        with:
          # Provide github_token so the action uses it directly instead of
          # trying to exchange an OIDC token (which requires id-token: write).
          github_token: ${{ github.token }}
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          trigger_phrase: "@mybot"
          branch_prefix: "mybot/"
          # No prompt — action will skip gracefully without needing API credentials
        continue-on-error: true

      - name: Assert action did not fail with boolean inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully with boolean inputs set"
            exit 1
          fi
          echo "PASS: action accepted boolean inputs and skipped without error"
