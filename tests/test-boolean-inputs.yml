name: Test - Boolean input configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          use_sticky_comment: "true"
          use_commit_signing: "false"
          classify_inline_comments: "false"
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          include_fix_links: "false"
          # No API key — testing that boolean inputs are accepted

      - name: Assert action accepted boolean inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should run (and fail due to missing API key) but not crash on boolean inputs
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted boolean configuration inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
