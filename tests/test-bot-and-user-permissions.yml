name: Test bot and user permission inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Help with this"
          trigger_phrase: "@claude"
          allowed_bots: "dependabot[bot],renovate[bot]"
          include_comments_by_actor: "*[bot]"
          exclude_comments_by_actor: "renovate[bot]"
          # No API key — will fail, but tests that permission inputs are accepted

      - name: Assert action failed due to missing credentials not bad inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing API key), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted bot/user permission inputs and failed as expected (missing API key)"
