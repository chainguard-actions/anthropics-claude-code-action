name: Test bot configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello world"
          bot_name: "my-custom-bot[bot]"
          bot_id: "12345678"
          use_commit_signing: "false"
          use_sticky_comment: "true"
          include_fix_links: "false"
          # No API key — action will fail at the API call stage

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it should have at least started"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no credentials, as expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # If succeeded, conclusion should be set
            if [ -z "$CONCLUSION" ]; then
              echo "WARN: action succeeded but conclusion output is empty"
            else
              echo "conclusion output: $CONCLUSION"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
