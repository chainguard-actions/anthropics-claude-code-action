name: Test bot configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for action
        run: |
          curl -fsSL https://bun.sh/install | bash
          BUN_BIN="$HOME/.bun/bin/bun"
          echo "BUN_BIN=$BUN_BIN" >> "$GITHUB_ENV"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello world"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          bot_name: "test-bot[bot]"
          bot_id: "12345678"
          track_progress: "false"
          include_fix_links: "false"
          display_report: "false"
          show_full_output: "false"
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ env.BUN_BIN }}
          path_to_claude_code_executable: "/usr/bin/true"
          # No anthropic_api_key — action will fail gracefully at validateEnvironmentVariables

      - name: Assert action ran with bot config (or failed gracefully)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, bot config inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
