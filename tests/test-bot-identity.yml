name: Test bot identity configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-default-bot
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello"
          # Use default bot_id and bot_name (claude[bot] / 41898282)
          # No anthropic_api_key — action should fail gracefully

      - name: Assert default bot identity accepted
        env:
          OUTCOME: ${{ steps.action-default-bot.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — unexpected"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default bot identity (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: action-custom-bot
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello"
          bot_id: "12345678"
          bot_name: "my-custom-bot[bot]"
          # No anthropic_api_key — action should fail gracefully

      - name: Assert custom bot identity accepted
        env:
          OUTCOME: ${{ steps.action-custom-bot.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — unexpected"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom bot identity (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
