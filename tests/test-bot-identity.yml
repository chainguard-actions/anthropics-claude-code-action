name: Test bot identity configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          bot_id: "41898282"
          bot_name: "claude[bot]"
          use_sticky_comment: "true"
          track_progress: "false"
          include_fix_links: "false"
          prompt: "Describe what you see"
          # No anthropic_api_key — action will fail gracefully

      - name: Assert action ran with bot identity config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with bot identity config"
            if [ -z "$CONCLUSION" ]; then
              echo "WARN: conclusion output is empty on success"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
