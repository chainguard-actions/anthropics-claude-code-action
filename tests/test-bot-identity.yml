name: Test - Bot Identity Configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom bot identity
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Describe the repository structure"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          use_commit_signing: "false"
          include_fix_links: "false"
          display_report: "false"
          show_full_output: "false"
          # No API key — expected to fail at API call stage

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "session_id: $SESSION_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, expected)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
