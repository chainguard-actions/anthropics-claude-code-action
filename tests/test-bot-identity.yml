name: Test bot identity and commit signing inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List the files in the repository"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          use_commit_signing: "false"
          track_progress: "false"
          include_fix_links: "true"
          display_report: "false"
          show_full_output: "false"
          # No anthropic_api_key — action will fail at API call stage

      - name: Assert action accepted bot identity inputs and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
