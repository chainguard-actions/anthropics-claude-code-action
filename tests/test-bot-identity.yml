name: Test bot identity configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          github_token: ${{ github.token }}

      - name: Assert action ran with custom bot identity
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom bot identity"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Anthropic API key in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
