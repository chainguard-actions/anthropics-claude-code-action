name: Test branch configuration inputs are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake GitHub event payload for workflow_dispatch
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "full_name": "test-owner/test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      # Test with custom branch prefix (dash format) and a custom branch name template.
      # No prompt → no trigger → action exits cleanly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          base_branch: "main"
          trigger_phrase: "@bot"
          label_trigger: "bot"
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Verify action ran with branch config inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action accepted branch config inputs, outcome: ${{ steps.action.outcome }}"
