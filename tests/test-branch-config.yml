name: Test branch configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Check the repository structure"
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          use_sticky_comment: "true"
          # No anthropic_api_key — action should fail gracefully

      - name: Assert action ran (branch config inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
