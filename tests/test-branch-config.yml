name: Test branch and label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello world"
          branch_prefix: "claude-"
          label_trigger: "ai-review"
          use_sticky_comment: "true"
          github_token: ${{ github.token }}

      - name: Assert action ran with branch and label config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Anthropic API key in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
