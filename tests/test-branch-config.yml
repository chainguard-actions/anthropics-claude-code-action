name: Test - Branch configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom branch configuration
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Create a simple hello world file"
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          base_branch: "act-harness"
          use_sticky_comment: "true"
          track_progress: "false"
          # No API key — will fail at Claude invocation

      - name: Assert action failed gracefully with branch config inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "branch_name: $BRANCH_NAME"
          # Without an API key the action cannot call Claude.
          # It should fail gracefully (not panic or crash on input validation).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key)"
          elif [ "$OUTCOME" = "success" ] && [ "$CONCLUSION" = "failure" ]; then
            echo "PASS: action ran but reported conclusion=failure (no API key)"
          else
            echo "FAIL: unexpected outcome='$OUTCOME' conclusion='$CONCLUSION'"
            exit 1
          fi
