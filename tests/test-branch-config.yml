name: Test branch configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          # No API key: expect graceful failure

      - name: Assert action ran with branch config (fails gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (branch config accepted, no API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with branch config"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
