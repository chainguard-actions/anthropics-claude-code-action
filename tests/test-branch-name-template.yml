name: Test branch name template input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No prompt — action should skip gracefully
          prompt: ""
          github_token: ${{ github.token }}
          # Test custom branch name template
          branch_prefix: "claude/"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"

      - name: Assert action handled branch template input gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted branch_name_template and exited gracefully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
