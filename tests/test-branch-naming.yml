name: Test branch naming template configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for action
        run: |
          curl -fsSL https://bun.sh/install | bash
          BUN_BIN="$HOME/.bun/bin/bun"
          echo "BUN_BIN=$BUN_BIN" >> "$GITHUB_ENV"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files"
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          label_trigger: "ai-review"
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ env.BUN_BIN }}
          path_to_claude_code_executable: "/usr/bin/true"
          # No anthropic_api_key — action will fail gracefully at validateEnvironmentVariables

      - name: Assert action ran with branch naming config (or failed gracefully)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, branch naming inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
