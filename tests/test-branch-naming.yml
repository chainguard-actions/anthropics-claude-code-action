name: Test branch naming template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Create a simple hello world file"
          branch_prefix: "claude/"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          base_branch: "main"
          # No anthropic_api_key — action should fail gracefully

      - name: Assert branch naming template accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — unexpected"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            # If action succeeded, branch_name output may be set
            echo "PASS: action succeeded (branch_name=$BRANCH_NAME)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
