name: Test branch naming template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Describe the repository structure"
          branch_prefix: "claude/"
          branch_name_template: "{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}"
          base_branch: "main"
          # No API key — action will fail at Claude invocation, not at setup

      - name: Assert action handled branch naming inputs and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "branch_name: $BRANCH_NAME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (conclusion=$CONCLUSION, branch=$BRANCH_NAME)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
