name: Test branch and trigger inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with branch and trigger inputs (expect failure without valid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_api_key: "sk-ant-test-fake-key-for-coverage"
          assignee_trigger: "claude"
          base_branch: "main"
          branch_prefix: "claude/"
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (failed gracefully without valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without valid credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
