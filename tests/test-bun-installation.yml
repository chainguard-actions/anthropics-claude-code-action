name: Test Bun installation and dependency setup
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: /tmp/github-events/event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun to system PATH
        run: |
          curl -fsSL https://bun.sh/install | bash
          # Copy bun to a location that is always in PATH
          cp "$HOME/.bun/bin/bun" /usr/local/bin/bun
          bun --version

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: ""
          path_to_bun_executable: /usr/local/bin/bun

      - name: Assert bun is available after action ran
        run: |
          echo "Checking if bun is available after action ran..."
          if command -v bun &>/dev/null; then
            BUN_VERSION=$(bun --version)
            echo "PASS: bun is available: $BUN_VERSION"
          else
            echo "FAIL: bun was not available"
            exit 1
          fi

      - name: Assert action outcome is success or failure (not error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion (bun install succeeded)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
