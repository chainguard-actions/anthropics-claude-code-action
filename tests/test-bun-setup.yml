name: Test - Bun installation and dependency setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (will fail at Claude invocation without API key)
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "echo test"
          # No API key — action will fail at the Claude invocation step,
          # but Bun installation and dependency setup should have completed.

      - name: Assert Bun was installed and is available
        run: |
          echo "Checking bun availability..."
          if command -v bun > /dev/null 2>&1; then
            BUN_VERSION=$(bun --version 2>/dev/null || echo "unknown")
            echo "PASS: bun is available, version: $BUN_VERSION"
          else
            echo "FAIL: bun is not available on PATH after action ran"
            exit 1
          fi

      - name: Assert action outcome is failure (no API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected failure without API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
