name: Test Bun installation and dependency setup
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Bun is not pre-installed
        run: |
          # Check initial state (bun may or may not be present)
          echo "Initial bun check:"
          which bun || echo "bun not found initially"

      - id: action
        uses: .
        with:
          # No prompt → no trigger → exits cleanly after Bun setup
          # This tests that the Bun installation step works correctly
          trigger_phrase: "@claude"
        continue-on-error: true

      - name: Assert Bun was installed by the action
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Verify Bun is now available after the action ran
          if ! command -v bun >/dev/null 2>&1; then
            echo "FAIL: bun is not available after action ran"
            exit 1
          fi
          BUN_VERSION=$(bun --version 2>/dev/null || echo "unknown")
          echo "bun version: $BUN_VERSION"
          echo "PASS: bun is available (version=$BUN_VERSION)"

          # The action itself should not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
