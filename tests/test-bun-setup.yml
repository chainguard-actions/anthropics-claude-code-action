name: Test - Bun setup and dependency installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo test"
          # No API key — we're testing that setup steps run, not the actual Claude execution

      - name: Assert Bun was installed and action ran (setup succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Bun should be available after the action's setup steps
          if command -v bun > /dev/null 2>&1; then
            echo "PASS: bun is installed and available"
            bun --version
          else
            echo "FAIL: bun was not installed by the action"
            exit 1
          fi
          # The action itself may fail due to missing API key, which is expected
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
