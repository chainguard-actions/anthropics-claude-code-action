name: Test claude_code_oauth_token input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a fake claude_code_oauth_token and a prompt.
      # claude_code_oauth_token is an alternative to anthropic_api_key for
      # authenticating with Claude. The action will fail because the token
      # is invalid, but the input must be accepted and passed through.
      # github_token is provided to bypass the OIDC token exchange.
      - id: action
        uses: .
        with:
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage-testing"
          prompt: "Say hello"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran with claude_code_oauth_token input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the OAuth token is fake,
          # but it must have accepted the input and attempted to run.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted claude_code_oauth_token input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
