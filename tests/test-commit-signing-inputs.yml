name: Test commit signing configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Make a commit"
          use_commit_signing: "true"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          # No API key — will fail, but tests that commit signing inputs are accepted

      - name: Assert action failed due to missing credentials not bad inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing API key), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted commit signing inputs and failed as expected (missing API key)"
