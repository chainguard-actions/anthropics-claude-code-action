name: Test configuration options accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files in the current directory"
          use_sticky_comment: "true"
          use_commit_signing: "false"
          classify_inline_comments: "true"
          include_fix_links: "false"
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          branch_prefix: "claude/"
          trigger_phrase: "@claude"
          label_trigger: "claude"
          # No API key — expected to fail at auth, not at config parsing

      - name: Assert action failed at auth not at config parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should fail (no API key) or succeed — but NOT be skipped
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: action ran with config options and produced conclusion: $CONCLUSION"
            else
              echo "FAIL: action succeeded but conclusion is unexpected: '$CONCLUSION'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
