name: Test configuration inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Test that various configuration inputs are accepted without error.
          # No prompt → no trigger → action skips gracefully without API key.
          trigger_phrase: "@mybot"
          branch_prefix: "mybot/"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          bot_name: "mybot[bot]"
          bot_id: "12345678"
          include_fix_links: "false"
          display_report: "false"
        continue-on-error: true
      - name: Assert action accepted configuration inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (skip path) or fail gracefully.
          # The key assertion is that it doesn't crash due to invalid inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action handled configuration inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
