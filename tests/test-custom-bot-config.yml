name: Test custom bot configuration inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Check the repository structure"
          github_token: ${{ github.token }}
          bot_id: "12345678"
          bot_name: "my-custom-bot[bot]"
          use_commit_signing: "false"
          include_fix_links: "false"
          display_report: "false"
          show_full_output: "false"
          # No anthropic_api_key — action should fail at API key validation

      - name: Assert action failed at API key validation (not bot config parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because no API key is provided.
          # This confirms custom bot_id, bot_name, and other boolean inputs are accepted.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action accepted custom bot_id, bot_name, and boolean configuration inputs"
