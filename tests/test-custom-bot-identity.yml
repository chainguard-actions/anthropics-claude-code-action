name: Test custom bot identity inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo hello"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          branch_prefix: "claude-"
          # No API key — expected to fail at auth

      - name: Assert action ran with custom bot identity inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: action ran with custom bot identity and produced conclusion: $CONCLUSION"
            else
              echo "FAIL: action succeeded but conclusion is unexpected: '$CONCLUSION'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
