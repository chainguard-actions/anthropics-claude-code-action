name: Test - Custom Branch Configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom branch configuration
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{timestamp}}"
          use_sticky_comment: "false"
          # No API key — expected to fail at API call stage

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "branch_name: $BRANCH_NAME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, expected)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
