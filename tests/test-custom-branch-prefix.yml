name: Test custom branch prefix input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files in the current directory"
          github_token: ${{ github.token }}
          branch_prefix: "claude-"
          branch_name_template: "{{prefix}}{{entityType}}-{{timestamp}}"
          use_sticky_comment: "false"
          # No anthropic_api_key — action should fail at API key validation,
          # not at input parsing, confirming inputs are accepted correctly

      - name: Assert action failed at API key validation (not input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because no API key is provided,
          # not because of invalid inputs. This confirms inputs are parsed correctly.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed at API key validation with custom branch inputs"
