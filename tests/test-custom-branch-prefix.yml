name: Test custom branch prefix and input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: ""
          anthropic_api_key: "dummy-key-branch-test"
          github_token: ${{ github.token }}
          branch_prefix: "claude-"
          trigger_phrase: "@ai"
          use_sticky_comment: "true"
          use_commit_signing: "false"
          track_progress: "false"
          include_fix_links: "false"

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with custom inputs, outcome=$OUTCOME"
