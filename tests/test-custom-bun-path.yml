name: Test - Custom Bun Executable Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun manually
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify Bun is available
        run: |
          BUN_PATH="$HOME/.bun/bin/bun"
          if [ ! -x "$BUN_PATH" ]; then
            echo "FAIL: Bun not found at $BUN_PATH"
            exit 1
          fi
          echo "Bun version: $($BUN_PATH --version)"
          echo "BUN_PATH=$BUN_PATH" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "echo hello"
          path_to_bun_executable: ${{ env.BUN_PATH }}
          # No API key — action will fail at runtime, but should use custom Bun

      - name: Assert action ran with custom Bun (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom Bun and failed gracefully (no API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with custom Bun and succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
