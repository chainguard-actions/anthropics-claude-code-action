name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for custom path test
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # https://github.com/oven-sh/setup-bun/releases/tag/v2.1.2
        with:
          bun-version: 1.3.6

      - name: Get bun path
        id: bun-path
        run: |
          BUN_PATH=$(which bun)
          echo "bun_path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - name: Run action with custom bun path
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ steps.bun-path.outputs.bun_path }}

      - name: Assert action ran (with custom bun path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to missing API key,
          # but NOT fail due to bun not being found
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with custom bun path (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
