name: Test custom bun path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
        with:
          bun-version: 1.3.14

      - name: Get bun path
        id: bun-path
        run: |
          BUN_PATH="$(which bun)"
          echo "path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Bun path: $BUN_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: ${{ steps.bun-path.outputs.path }}
          # No anthropic_api_key — will fail at Claude invocation, not at Bun setup

      - name: Assert action used custom bun and failed at Claude (not at Bun setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the Claude invocation step (no API key),
          # NOT at the Bun setup step. Either outcome is acceptable here since
          # we're testing that the custom bun path input is accepted without error.
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without API credentials"
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Claude invocation (custom bun path was accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
