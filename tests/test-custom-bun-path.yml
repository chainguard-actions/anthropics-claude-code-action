name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for use as custom executable
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
        with:
          bun-version: 1.3.14

      - name: Get bun path
        id: bun-path
        run: |
          BUN_PATH="$(which bun)"
          echo "bun_path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - name: Run action with custom bun path and no prompt (should skip gracefully)
        id: action
        uses: .
        with:
          # Provide github_token so the action uses it directly instead of
          # trying to exchange an OIDC token (which requires id-token: write).
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ steps.bun-path.outputs.bun_path }}
          # No prompt — action will skip gracefully without needing API credentials
        continue-on-error: true

      - name: Assert action did not fail (custom bun path + no-trigger path exits 0)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully when using custom bun path"
            exit 1
          fi
          echo "PASS: action used custom bun path and skipped without error"
