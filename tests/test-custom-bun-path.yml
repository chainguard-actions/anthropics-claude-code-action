name: Test - Custom Bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun manually
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify Bun is available
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version
          echo "BUN_PATH=$HOME/.bun/bin/bun" >> "$GITHUB_ENV"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo test"
          path_to_bun_executable: ${{ env.BUN_PATH }}
          # No API key — testing that custom bun path is used, not actual Claude execution

      - name: Assert action used custom Bun path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have used the custom bun path (skipping auto-install)
          # It will fail due to missing API key, but the setup should have worked
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with custom bun path (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
