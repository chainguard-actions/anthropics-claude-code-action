name: Test custom bun executable path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install real bun first so the wrapper can delegate to it
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # https://github.com/oven-sh/setup-bun/releases/tag/v2.1.2
        with:
          bun-version: 1.3.6

      # Create a wrapper bun executable that delegates to the real bun.
      # This tests that the action correctly uses the custom path instead of
      # installing bun itself (the "Install Bun" step is skipped when
      # path_to_bun_executable is set).
      - name: Create bun wrapper executable
        run: |
          mkdir -p /tmp/custom-bun-dir
          # Find the real bun binary
          REAL_BUN="$(which bun)"
          echo "Real bun found at: $REAL_BUN"
          cat > /tmp/custom-bun-dir/bun << EOF
          #!/bin/sh
          # Wrapper bun: delegates all commands to the real bun
          exec "$REAL_BUN" "\$@"
          EOF
          chmod +x /tmp/custom-bun-dir/bun
          echo "Wrapper bun created at /tmp/custom-bun-dir/bun"
          /tmp/custom-bun-dir/bun --version

      # Run the action with the custom bun path and no prompt (skip path).
      # github_token is provided to bypass the OIDC token exchange with Anthropic.
      - id: action
        uses: .
        with:
          path_to_bun_executable: /tmp/custom-bun-dir/bun
          trigger_phrase: "@claude"
          github_token: ${{ github.token }}
          # No prompt — action should skip gracefully after setup

      - name: Assert action completed with custom bun path
        run: |
          echo "Action completed successfully using custom bun path"
          echo "PASS"
