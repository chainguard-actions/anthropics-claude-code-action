name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: first
        name: First run installs bun via setup-bun
        uses: .
        with:
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
      - id: bun
        name: Locate installed bun
        run: |
          BUN_PATH="$(command -v bun)"
          echo "bun at: $BUN_PATH"
          if [ -z "$BUN_PATH" ]; then
            echo "FAIL: bun not on PATH after first run"
            exit 1
          fi
          echo "path=$BUN_PATH" >> "$GITHUB_OUTPUT"
      - id: action
        name: Second run uses custom bun path
        uses: .
        with:
          github_token: ${{ github.token }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          classify_inline_comments: "false"
      - name: Assert second run succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.github_token }}
          EXPECTED: ${{ github.token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: github_token output mismatch"
            exit 1
          fi
          echo "PASS"
