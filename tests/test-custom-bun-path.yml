name: Test custom bun executable path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for custom path test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
        with:
          bun-version: 1.3.14

      - name: Get bun path
        id: bun-path
        run: |
          BUN_PATH="$(which bun)"
          echo "bun_path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - id: action
        uses: .
        with:
          # Use the pre-installed bun instead of letting the action install it
          path_to_bun_executable: ${{ steps.bun-path.outputs.bun_path }}
          # No prompt → action will skip (no trigger), no API key needed
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action used custom bun and skipped gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no prompt, the action should skip gracefully (no trigger)
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (skip) with custom bun path, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action used custom bun path and skipped gracefully"
