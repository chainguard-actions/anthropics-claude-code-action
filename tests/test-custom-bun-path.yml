name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun for custom path test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
        with:
          bun-version: 1.3.14

      - name: Capture bun path
        id: bun-path
        run: |
          BUN_PATH="$(which bun)"
          echo "bun-path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - id: action
        uses: .
        with:
          # Provide the already-installed bun executable — skips auto-install
          path_to_bun_executable: ${{ steps.bun-path.outputs.bun-path }}
          # No prompt — action will skip gracefully without API key
          github_token: ${{ github.token }}

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully using custom bun path"
          echo "PASS"

      - name: Assert github_token output is set
        env:
          ACTUAL: ${{ steps.action.outputs.github_token }}
        run: |
          echo "github_token output present: $([ -n "$ACTUAL" ] && echo yes || echo no)"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected github_token output to be set"
            exit 1
          fi
          echo "PASS: github_token output is set"
