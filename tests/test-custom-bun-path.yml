name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4

      - name: Install bun manually for custom path test
        id: install-bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          BUN_PATH="$HOME/.bun/bin/bun"
          echo "path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Bun installed at: $BUN_PATH"
          "$BUN_PATH" --version

      - name: Run action with custom bun path (expect failure due to no API key)
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: ""
          path_to_bun_executable: ${{ steps.install-bun.outputs.path }}

      - name: Assert action ran with custom bun path
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          # The action should either succeed (early exit) or fail (missing credentials).
          # Either way, the custom bun path was used without crashing at bun setup.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran using custom bun executable"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
