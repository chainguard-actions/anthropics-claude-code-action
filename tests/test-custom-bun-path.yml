name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun for custom path test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
        with:
          bun-version: 1.3.14

      - name: Get bun path
        id: bun-path
        run: |
          BUN_PATH="$(which bun)"
          echo "bun_path=$BUN_PATH" >> "$GITHUB_OUTPUT"
          echo "Found bun at: $BUN_PATH"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: ${{ steps.bun-path.outputs.bun_path }}
          # No API key — expected to fail at auth, not at bun setup

      - name: Assert action ran using custom bun path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: action ran with custom bun path and produced conclusion: $CONCLUSION"
            else
              echo "FAIL: action succeeded but conclusion is unexpected: '$CONCLUSION'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
