name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun for custom path test
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify bun is available
        run: |
          BUN_PATH="$HOME/.bun/bin/bun"
          echo "bun path: $BUN_PATH"
          if [ ! -x "$BUN_PATH" ]; then
            echo "FAIL: bun not found at $BUN_PATH"
            exit 1
          fi
          "$BUN_PATH" --version
          echo "PASS: bun is available"

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: "${{ env.HOME }}/.bun/bin/bun"
          # No anthropic_api_key — action will fail at API call stage

      - name: Assert action ran with custom bun path
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should either succeed (unlikely without API key) or fail gracefully.
          # The important thing is it did NOT crash during bun setup (custom path branch).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
