name: Test custom bun executable path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install bun system-wide
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify bun is available
        run: |
          BUN_PATH="$HOME/.bun/bin/bun"
          if [ ! -x "$BUN_PATH" ]; then
            echo "FAIL: bun not found at $BUN_PATH"
            exit 1
          fi
          echo "bun found at: $BUN_PATH"
          "$BUN_PATH" --version

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          path_to_bun_executable: "${{ env.HOME }}/.bun/bin/bun"
          github_token: ${{ github.token }}

      - name: Assert action ran with custom bun path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom bun executable"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Anthropic API key in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
