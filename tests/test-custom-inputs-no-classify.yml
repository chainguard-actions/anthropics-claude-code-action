name: Test custom inputs with inline classification disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger_phrase: "/ai"
          label_trigger: "ai-help"
          branch_prefix: "claude-"
          classify_inline_comments: "false"
          use_sticky_comment: "true"
          display_report: "false"
      - name: Assert action skipped successfully
        env:
          OUT_TOKEN: ${{ steps.action.outputs.github_token }}
          IN_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "conclusion: '$CONCLUSION'"
          echo "branch_name: '$BRANCH'"
          if [ "$OUT_TOKEN" != "$IN_TOKEN" ] || [ -z "$OUT_TOKEN" ]; then
            echo "FAIL: github_token output does not match the provided token"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: Claude should not have run without a prompt"
            exit 1
          fi
          if [ -n "$BRANCH" ]; then
            echo "FAIL: no branch should be created"
            exit 1
          fi
          echo "PASS"
