name: Test custom trigger phrase and branch prefix inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files in the current directory"
          trigger_phrase: "@bot"
          branch_prefix: "claude-"
          use_sticky_comment: "false"
          track_progress: "false"
          # No anthropic_api_key — action should fail gracefully

      - name: Assert action ran (custom inputs accepted, graceful failure without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key) — custom inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
