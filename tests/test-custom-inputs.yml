name: Test custom input defaults accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # No prompt — action will skip cleanly, but all inputs should be accepted
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"
          branch_prefix: "claude-"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          bot_name: "claude[bot]"
          bot_id: "41898282"
          include_fix_links: "false"
          use_commit_signing: "false"
          track_progress: "false"
          allowed_bots: ""
          allowed_non_write_users: ""

      - name: Assert action accepted all inputs and skipped cleanly
        env:
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "execution_file: '$EXECUTION_FILE'"
          # No trigger → no execution file should be produced
          if [ -n "$EXECUTION_FILE" ]; then
            echo "FAIL: expected empty execution_file but got: $EXECUTION_FILE"
            exit 1
          fi
          echo "PASS: action accepted all custom inputs and skipped cleanly"
