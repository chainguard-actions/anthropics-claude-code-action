name: Test custom configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files in the current directory"
          trigger_phrase: "@bot"
          branch_prefix: "claude-"
          label_trigger: "ai-review"
          use_sticky_comment: "false"
          classify_inline_comments: "false"
          include_fix_links: "false"
          # No anthropic_api_key — action will fail at API call stage, not input stage

      - name: Assert action accepted custom inputs and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API/auth stage, not during input parsing
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (credentials may have been injected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully at API stage (no credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
