name: Test custom input configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Custom configuration inputs - no prompt so no trigger fires
          trigger_phrase: "@mybot"
          branch_prefix: "claude-"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          use_commit_signing: "false"
          include_fix_links: "false"
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          bot_name: "claude[bot]"
          bot_id: "41898282"
          # No prompt → no trigger → exits cleanly
        continue-on-error: true

      - name: Assert action accepted custom inputs and ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should not be skipped — it must have run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          # Success or failure are both acceptable here:
          # - success: no trigger found, exits cleanly
          # - failure: permission check or other graceful failure
          echo "PASS: action ran with custom inputs (outcome=$OUTCOME)"
