name: Test custom inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with custom inputs but no prompt (so it skips gracefully).
      # This verifies that custom input values are accepted without errors during
      # the setup/parsing phase.
      - id: action
        uses: .
        with:
          prompt: ""
          trigger_phrase: "@mybot"
          branch_prefix: "mybot/"
          bot_name: "mybot[bot]"
          bot_id: "12345678"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          include_fix_links: "false"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action did not fail on custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully with custom inputs but failed"
            exit 1
          fi
          echo "PASS: action accepted custom inputs and skipped gracefully (outcome=$OUTCOME)"
