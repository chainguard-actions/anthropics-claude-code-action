name: Test custom trigger phrase input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          trigger_phrase: "@bot"
          prompt: "List files in the current directory"
          # No API key — action will fail at Claude invocation

      - name: Assert action ran (custom trigger phrase accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if credentials are present)
          # or fail gracefully at the Claude API call stage (no credentials).
          # Either way it must NOT produce an unexpected outcome like 'skipped'.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with custom trigger_phrase (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
