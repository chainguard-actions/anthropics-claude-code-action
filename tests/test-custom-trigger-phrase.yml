name: Test custom trigger phrase input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Summarize the repository"
          github_token: ${{ github.token }}
          trigger_phrase: "@ai-assistant"
          label_trigger: "ai-review"
          use_sticky_comment: "true"
          classify_inline_comments: "false"
          # No anthropic_api_key — action should fail at API key validation

      - name: Assert action failed at API key validation (not trigger parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because no API key is provided.
          # This confirms custom trigger_phrase and label_trigger inputs are accepted.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no API key), got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action accepted custom trigger_phrase and label_trigger inputs"
