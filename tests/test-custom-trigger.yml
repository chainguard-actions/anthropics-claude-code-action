name: Test custom trigger phrase configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with custom trigger phrase and label (no API key - expect graceful failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          trigger_phrase: "@bot"
          label_trigger: "bot-review"
          branch_prefix: "bot/"
          prompt: "Review this code"

      - name: Assert action ran with custom config or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key provided)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
