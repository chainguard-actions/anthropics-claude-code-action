name: Test custom trigger phrase configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          trigger_phrase: "@mybot"
          prompt: "List files in the current directory"
          github_token: ${{ github.token }}

      - name: Assert action ran with custom trigger phrase (graceful failure without API key)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should either succeed or fail gracefully (not panic/crash)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom trigger phrase"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
