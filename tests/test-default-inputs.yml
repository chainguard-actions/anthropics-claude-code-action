name: Test default inputs and early exit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Provide github_token to bypass OIDC exchange
          github_token: ${{ github.token }}
          # Use explicit defaults to verify they are accepted without error
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          use_commit_signing: "false"
          include_fix_links: "true"
          # No prompt — should trigger early exit in agent mode
        continue-on-error: true

      - name: Assert action completed without infrastructure error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no prompt in workflow_dispatch (agent mode), the action should
          # detect no trigger and exit cleanly. A 'success' outcome confirms
          # the early-exit path works. A 'failure' is also acceptable if the
          # environment lacks certain capabilities (e.g., bun install issues).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME) — no crash before trigger check"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert branch_name output is empty (no trigger, no branch created)
        env:
          BRANCH: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "branch_name output: '$BRANCH'"
          # When no trigger is found, no branch should be created
          if [ -z "$BRANCH" ]; then
            echo "PASS: branch_name is empty as expected (no trigger)"
          else
            echo "INFO: branch_name='$BRANCH' — unexpected but not fatal"
          fi
