name: Test default inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use all defaults — trigger_phrase defaults to "@claude",
          # label_trigger defaults to "claude", branch_prefix defaults to "claude/"
          # No API key: expect graceful failure
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          use_commit_signing: "false"
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          include_fix_links: "true"

      - name: Assert action ran (defaults accepted, fails gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key, default inputs accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly — outputs may be set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
