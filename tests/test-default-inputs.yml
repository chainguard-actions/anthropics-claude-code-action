name: Test default input values are applied correctly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake GitHub event payload for workflow_dispatch
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "full_name": "test-owner/test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      # Run the action with only required inputs (github_token) and no prompt.
      # Default inputs should be applied: trigger_phrase=@claude, branch_prefix=claude/, etc.
      # With no prompt in workflow_dispatch (agent mode), action exits cleanly with no trigger.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Verify action ran (default inputs accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (not crash on startup due to bad defaults)
          # It may succeed (no trigger) or fail (API key missing after trigger check)
          # but it must not be skipped/cancelled
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action ran with default inputs, outcome: ${{ steps.action.outcome }}"

      - name: Verify Bun was installed
        run: |
          if ! command -v bun &>/dev/null; then
            echo "FAIL: bun was not installed by the action"
            exit 1
          fi
          echo "PASS: bun is available at $(which bun)"
          bun --version
