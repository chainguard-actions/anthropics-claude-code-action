name: Test default inputs are accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: /tmp/github-events/event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun to system PATH
        run: |
          curl -fsSL https://bun.sh/install | bash
          # Copy bun to a location that is always in PATH
          cp "$HOME/.bun/bin/bun" /usr/local/bin/bun
          bun --version

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          path_to_bun_executable: /usr/local/bin/bun
          # Using all defaults: trigger_phrase=@claude, branch_prefix=claude/, label_trigger=claude
          # No prompt provided - should exit early with no trigger

      - name: Assert action ran (with defaults, no prompt = no trigger = early exit)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no prompt and workflow_dispatch, the action should exit early (success)
          # or fail at bun install if network is unavailable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert branch_name output exists (even if empty)
        env:
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
        run: |
          echo "branch_name output: '$BRANCH_NAME'"
          # branch_name may be empty when no trigger is found, that's fine
          echo "PASS: branch_name output is accessible"
