name: Test default inputs accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # All default inputs — no prompt, no API key
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          use_commit_signing: "false"
          bot_id: "41898282"
          bot_name: "claude[bot]"
          track_progress: "false"
          include_fix_links: "true"
          display_report: "false"
          show_full_output: "false"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action handled default inputs without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With no prompt and no API key, the action should either:
          # - succeed (no-trigger skip path), OR
          # - fail only due to missing API key (not due to bad input parsing)
          # Either way, it should NOT crash with an unhandled exception on input parsing.
          echo "PASS: action handled default inputs without crashing on input parsing"
