name: Test - Direct prompt mode (graceful failure without API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with direct prompt and custom settings
        id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List the files in the current directory"
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          use_sticky_comment: "false"
          display_report: "false"
          show_full_output: "false"
          # No anthropic_api_key — will fail but should fail gracefully

      - name: Assert action outcome is failure or success with failure conclusion
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key the action cannot authenticate to Anthropic.
          # It must either set the step to failed or report conclusion=failure.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key)"
          elif [ "$OUTCOME" = "success" ] && [ "$CONCLUSION" = "failure" ]; then
            echo "PASS: action ran but reported conclusion=failure (no API key)"
          else
            echo "FAIL: unexpected outcome='$OUTCOME' conclusion='$CONCLUSION'"
            exit 1
          fi
