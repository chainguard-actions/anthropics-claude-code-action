name: Test Workload Identity Federation Auth Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: fdrl_test1234567890abcdef
          anthropic_organization_id: org-test-uuid-1234-5678-abcd-ef0123456789
          anthropic_service_account_id: svac_testserviceaccount
          anthropic_workspace_id: wrkspc_testworkspace
          anthropic_oidc_audience: https://api.anthropic.com
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (federation inputs accepted)
        run: |
          # The action should fail due to missing real OIDC token / federation setup,
          # but it must have started (continue-on-error: true). We just verify the
          # step ran and the inputs were accepted without an "unknown input" error.
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: federation auth inputs were accepted by the action"
