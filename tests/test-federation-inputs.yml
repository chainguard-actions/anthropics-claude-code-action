name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test_rule_id_for_coverage"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test_service_account"
          anthropic_workspace_id: "wrkspc_test_workspace"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (federation inputs were accepted)
        run: |
          # The action will fail due to invalid federation credentials,
          # but inputs must be accepted without a setup/parse error
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: federation inputs were accepted by the action"
