name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test_not_real"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test_not_real"
          anthropic_workspace_id: "wrkspc_test_not_real"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (even if it failed due to invalid federation config)
        run: |
          echo "Action completed (with or without error due to test federation config)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with an auth error, not a setup error
          # We just verify the step ran (outcome is set)
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: step outcome not set"
            exit 1
          fi
          echo "PASS: step ran with federation inputs"
