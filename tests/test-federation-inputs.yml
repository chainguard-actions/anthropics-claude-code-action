name: Test workload identity federation inputs accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with federation inputs but no prompt so it skips gracefully.
      # This verifies that all federation-related inputs are accepted without
      # crashing during the setup/parsing phase.
      - id: action
        uses: .
        with:
          anthropic_federation_rule_id: "fdrl_fake_rule_id_for_testing"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_fake_service_account_for_testing"
          anthropic_workspace_id: "wrkspc_fake_workspace_for_testing"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: ""
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action did not crash on federation inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully with federation inputs but failed"
            exit 1
          fi
          echo "PASS: federation inputs were accepted and action skipped gracefully (outcome=$OUTCOME)"
