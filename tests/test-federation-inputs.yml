name: Test workload identity federation inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with federation inputs
        id: action-federation
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test_fake_rule_id"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test_fake_service_account"
          anthropic_workspace_id: "wrkspc_test_fake_workspace"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"

      - name: Assert action ran (fails gracefully with fake federation config)
        env:
          OUTCOME: ${{ steps.action-federation.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
