name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_fake_rule_id_for_coverage"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_fake_service_account_id"
          anthropic_workspace_id: "wrkspc_fake_workspace_id"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake federation credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
