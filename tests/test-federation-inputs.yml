name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with federation inputs (no prompt, should skip gracefully)
        id: action
        uses: .
        with:
          # Provide github_token so the action uses it directly instead of
          # trying to exchange an OIDC token (which requires id-token: write).
          github_token: ${{ github.token }}
          # Cover workload identity federation inputs with placeholder values.
          # No prompt is provided so the action will skip before attempting
          # any actual API calls or OIDC token exchange.
          anthropic_federation_rule_id: "fdrl_placeholder"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_placeholder"
          anthropic_workspace_id: "wrkspc_placeholder"
          anthropic_oidc_audience: "https://api.anthropic.com"
          # No prompt — action will skip gracefully without needing real credentials
        continue-on-error: true

      - name: Assert action did not fail with federation inputs set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully with federation inputs set but no prompt"
            exit 1
          fi
          echo "PASS: action accepted federation inputs and skipped without error"
