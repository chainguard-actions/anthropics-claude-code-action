name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test with federation/OIDC inputs
        id: action-federation
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_fake_rule_id_for_coverage"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_fake_service_account_for_coverage"
          anthropic_workspace_id: "wrkspc_fake_workspace_for_coverage"
          anthropic_oidc_audience: "https://api.anthropic.com"
          github_token: ${{ github.token }}
          prompt: "Say hello"
          trigger_phrase: "@claude"

      - name: Assert action ran (federation scenario)
        env:
          OUTCOME: ${{ steps.action-federation.outcome }}
          CONCLUSION: ${{ steps.action-federation.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid federation credentials or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
