name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Workload identity federation inputs under test
          anthropic_federation_rule_id: "fdrl_placeholder_not_real"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_placeholder_not_real"
          anthropic_workspace_id: "wrkspc_placeholder_not_real"
          anthropic_oidc_audience: "https://api.anthropic.com"
          # Provide github_token to avoid additional OIDC exchange
          github_token: ${{ github.token }}
          # No prompt — should trigger early exit
          trigger_phrase: "@claude"
        continue-on-error: true

      - name: Assert action completed without infrastructure crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the federation credentials are fake,
          # but it must not crash before processing the inputs. success or
          # failure are both acceptable — we just need to confirm the inputs
          # were accepted without a configuration error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed (outcome=$OUTCOME) — federation inputs were accepted"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
