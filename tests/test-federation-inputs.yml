name: Test workload identity federation inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test_placeholder"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test_placeholder"
          anthropic_workspace_id: "wrkspc_test_placeholder"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"
          trigger_phrase: "@claude"
      - name: Assert action ran (with or without error due to invalid federation config)
        run: |
          # The action is expected to fail with invalid federation credentials.
          # This test only verifies the federation inputs are accepted without a
          # startup crash unrelated to auth (e.g. missing required input validation).
          echo "Action completed (possibly with auth error, which is expected)"
          echo "PASS: federation inputs were accepted"
