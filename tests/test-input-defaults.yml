name: Test - Input defaults and configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List files in the current directory"
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          use_commit_signing: "false"
          include_fix_links: "true"
          display_report: "false"
          show_full_output: "false"
          track_progress: "false"
          # No API key — expect graceful failure

      - name: Assert action ran (failed gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
