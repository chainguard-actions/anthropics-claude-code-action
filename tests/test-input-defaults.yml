name: Test input defaults and configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "List the files in the current directory"
          trigger_phrase: "@claude"
          branch_prefix: "claude/"
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          use_commit_signing: "false"
          include_fix_links: "true"
          display_report: "false"
          show_full_output: "false"
          # No anthropic_api_key — will fail at Claude invocation

      - name: Assert action failed gracefully with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without credentials the action must fail, not succeed silently
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded without API credentials"
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no API key), inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
