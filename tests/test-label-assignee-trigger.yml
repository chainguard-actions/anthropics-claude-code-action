name: Test label and assignee trigger inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Analyze the issue"
          label_trigger: "needs-claude"
          assignee_trigger: "claude-bot"
          allowed_bots: ""
          # No API key — action will fail at Claude invocation

      - name: Assert action ran with label and assignee trigger inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (if credentials are present)
          # or fail gracefully at the Claude API call stage (no credentials).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with label/assignee trigger inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
