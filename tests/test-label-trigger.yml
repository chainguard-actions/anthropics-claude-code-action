name: Test label trigger and assignee trigger inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          label_trigger: "ai-review"
          assignee_trigger: "claude"
          prompt: "Review the code changes"
          use_sticky_comment: "true"
          track_progress: "false"
          include_fix_links: "false"
          # No anthropic_api_key — action will fail at the run step

      - name: Assert action ran (failed gracefully on missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "execution_file: $EXECUTION_FILE"
          # The action should fail (no API key) or succeed — but never be skipped
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it succeeded, validate outputs
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected failure or success)"
            exit 1
          fi
