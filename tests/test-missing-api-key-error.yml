name: Test missing API key error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        # This step is expected to fail because no API key is provided but a prompt is given.
        # The action should fail with a clear error about missing credentials.
        continue-on-error: true
        uses: .
        with:
          prompt: "Say hello"
          github_token: ${{ github.token }}
          # Intentionally no anthropic_api_key — should trigger validation error

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no API key is provided, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
