name: Test missing API key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with prompt but no API key (should fail with credential error)
        id: action
        uses: .
        with:
          # Provide github_token so the action uses it directly instead of
          # trying to exchange an OIDC token (which requires id-token: write).
          github_token: ${{ github.token }}
          prompt: "Say hello"
          # No anthropic_api_key, no claude_code_oauth_token, no bedrock/vertex/foundry
          # The action should fail at validateEnvironmentVariables() with a clear error
        continue-on-error: true

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no API credentials were provided"
