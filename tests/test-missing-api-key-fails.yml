name: Test missing API key fails with clear error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_EVENT_PATH: /tmp/github-events/event.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bun to system PATH
        run: |
          curl -fsSL https://bun.sh/install | bash
          # Copy bun to a location that is always in PATH
          cp "$HOME/.bun/bin/bun" /usr/local/bin/bun
          bun --version

      - name: Create fake event payload
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Say hello"
          path_to_bun_executable: /usr/local/bin/bun
          # Intentionally omitting anthropic_api_key to trigger validation error

      - name: Assert action failed due to missing API key or API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail: either at GitHub API call (checkHumanActor)
          # or at validateEnvironmentVariables (no API key)
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is missing"
