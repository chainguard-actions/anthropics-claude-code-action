name: Test missing API key produces expected error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide a prompt but no API key — should fail with validation error
          prompt: "Say hello"
          github_token: ${{ github.token }}
          # Explicitly omit anthropic_api_key

      - name: Assert action failed (not skipped or cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without an API key"
            exit 1
          fi
          echo "PASS: action failed as expected when no API key provided (outcome=$OUTCOME)"
