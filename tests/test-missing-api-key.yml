name: Test missing API key error handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Provide a prompt to trigger agent mode, but no API key
          prompt: "Say hello"
          github_token: ${{ github.token }}
          # Explicitly no anthropic_api_key — should fail with auth error
        continue-on-error: true

      - name: Assert action failed with auth error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because no API key is provided
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected when no API key is provided"
