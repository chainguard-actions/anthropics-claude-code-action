name: Test missing API key error handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Provide a prompt to trigger execution, but no API key
          prompt: "Say hello"
          github_token: ${{ github.token }}
          # No anthropic_api_key provided — should fail with clear error
        continue-on-error: true

      - name: Assert action failed with credential error (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail because no API key is provided
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to missing API key"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
