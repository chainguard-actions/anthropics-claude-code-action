name: Test missing API key validation error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake claude executable so the action skips the real download
      - name: Create fake claude executable
        run: |
          mkdir -p /tmp/fake-claude-bin
          cat > /tmp/fake-claude-bin/claude << 'EOF'
          #!/bin/sh
          echo "fake claude: $@"
          exit 0
          EOF
          chmod +x /tmp/fake-claude-bin/claude

      - id: action
        uses: .
        # Provide a prompt to trigger execution, but no API key
        # The action should fail at environment variable validation
        with:
          prompt: "List files in the current directory"
          github_token: ${{ github.token }}
          path_to_claude_code_executable: /tmp/fake-claude-bin/claude
        continue-on-error: true

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing ANTHROPIC_API_KEY, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
