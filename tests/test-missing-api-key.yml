name: Test missing API key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with a prompt but no API key.
      # The action should fail with a clear error about missing credentials.
      - id: action
        uses: .
        with:
          prompt: "Say hello"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed with credential error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing API key, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no API key was provided"
