name: Test missing credentials error (prompt without API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide a prompt to trigger execution, but no API key
          prompt: "Say hello"
          github_token: ${{ github.token }}

      - name: Assert action failed with credential error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action must fail because no ANTHROPIC_API_KEY is provided
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing credentials, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed due to missing credentials"
