name: Test missing github_token without OIDC fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no OIDC request environment
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=" >> "$GITHUB_ENV"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          classify_inline_comments: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUT_TOKEN: ${{ steps.action.outputs.github_token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without github_token or OIDC"
            exit 1
          fi
          if [ -n "$OUT_TOKEN" ]; then
            echo "FAIL: no token should be output"
            exit 1
          fi
          echo "PASS"
