name: Test missing github_token without OIDC fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          classify_inline_comments: "false"
      - name: Assert action failed (no OIDC available to exchange for app token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN_OUT: ${{ steps.action.outputs.github_token }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without github_token / OIDC, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$TOKEN_OUT" ]; then
            echo "FAIL: expected no github_token output on failure"
            exit 1
          fi
          echo "PASS"
