name: Test failure without github_token and no OIDC
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          classify_inline_comments: "false"
      - name: Assert action failed or skipped cleanly
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: Claude should not have run without a prompt"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no github_token and no OIDC token under act), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: failed as expected (no OIDC token available)"
