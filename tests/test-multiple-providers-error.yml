name: Test multiple providers mutual exclusivity error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          github_token: ${{ github.token }}
          use_bedrock: "true"
          use_vertex: "true"
          # Both providers set — action should fail with mutual exclusivity error

      - name: Assert action failed due to multiple providers
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to multiple providers, got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when multiple providers were specified simultaneously"
