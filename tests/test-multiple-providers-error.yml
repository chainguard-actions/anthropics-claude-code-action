name: Test multiple providers simultaneously fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake GitHub event payload for workflow_dispatch
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "full_name": "test-owner/test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      # Run the action with both use_bedrock and use_vertex set to true.
      # The validate-env.ts check should fail with a mutual exclusivity error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Say hello"
          use_bedrock: "true"
          use_vertex: "true"
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key
          AWS_SECRET_ACCESS_KEY: fake-secret
          ANTHROPIC_VERTEX_PROJECT_ID: fake-project
          CLOUD_ML_REGION: us-central1

      - name: Assert action failed due to multiple providers
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to multiple providers, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when multiple providers were specified simultaneously"
