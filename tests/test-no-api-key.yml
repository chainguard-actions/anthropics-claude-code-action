name: Test no API key graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key provided — action should fail gracefully

      - name: Assert action ran and failed gracefully without API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key, the action must fail (not skip or hang)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without API key"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded (e.g. env var ANTHROPIC_API_KEY is set), check conclusion
            if [ "$CONCLUSION" = "success" ] || [ "$CONCLUSION" = "failure" ]; then
              echo "PASS: action ran and produced a conclusion output: $CONCLUSION"
            else
              echo "FAIL: action succeeded but conclusion output is unexpected: '$CONCLUSION'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
