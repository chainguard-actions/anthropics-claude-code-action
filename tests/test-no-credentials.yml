name: Test no credentials (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no oauth token, no cloud provider
          # The action should fail gracefully rather than crash

      - name: Assert action failed gracefully (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without credentials the action must fail, not be skipped
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          # Either it failed (expected) or somehow succeeded (also acceptable if
          # the harness injected credentials via env). Either way it must not be
          # in an unknown state.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (credentials may have been available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
