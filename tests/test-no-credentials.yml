name: Test no credentials (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          # No anthropic_api_key, no claude_code_oauth_token — should fail gracefully

      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without credentials the action must fail (not skip or succeed)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (credentials may be available in env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
