name: Test no prompt with inline comment classification disabled and custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          classify_inline_comments: "false"
          trigger_phrase: "/claude"
          branch_prefix: "claude-"
          use_sticky_comment: "true"
          include_fix_links: "false"
      - name: Assert action skipped cleanly
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TOKEN_OUT: ${{ steps.action.outputs.github_token }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -z "$TOKEN_OUT" ]; then
            echo "FAIL: github_token output empty"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: Claude should not have run without a prompt"
            exit 1
          fi
          echo "PASS"
