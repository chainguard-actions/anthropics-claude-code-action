name: Test no prompt skips execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
      - name: Assert github_token output echoes provided token
        env:
          ACTUAL: ${{ steps.action.outputs.github_token }}
          EXPECTED: ${{ github.token }}
        run: |
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: github_token output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: github_token output does not match provided token"
            exit 1
          fi
          echo "PASS"
      - name: Assert Claude did not run (no conclusion / branch / execution file)
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "conclusion: '$CONCLUSION'"
          echo "branch_name: '$BRANCH'"
          echo "execution_file: '$EXEC_FILE'"
          if [ -n "$CONCLUSION" ] || [ -n "$BRANCH" ] || [ -n "$EXEC_FILE" ]; then
            echo "FAIL: expected no execution outputs when no prompt is provided"
            exit 1
          fi
          echo "PASS"
