name: Test no prompt skips gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
      - name: Assert action succeeded without running Claude
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
          SESSION: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          echo "branch_name: '$BRANCH'"
          echo "execution_file: '$EXEC_FILE'"
          echo "session_id: '$SESSION'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success outcome"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] || [ -n "$BRANCH" ] || [ -n "$EXEC_FILE" ] || [ -n "$SESSION" ]; then
            echo "FAIL: expected Claude not to run (no prompt), but run outputs were set"
            exit 1
          fi
          echo "PASS"
      - name: Assert github_token output equals provided token
        env:
          ACTUAL: ${{ steps.action.outputs.github_token }}
          EXPECTED: ${{ github.token }}
        run: |
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: github_token output is empty"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: github_token output does not match provided token"
            exit 1
          fi
          echo "PASS"
