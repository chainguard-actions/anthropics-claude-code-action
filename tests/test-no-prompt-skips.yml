name: Test no prompt skips execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
      - name: Assert action skipped and returned the provided token
        env:
          OUT_TOKEN: ${{ steps.action.outputs.github_token }}
          IN_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          SESSION: ${{ steps.action.outputs.session_id }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "conclusion: '$CONCLUSION'"
          echo "session_id: '$SESSION'"
          echo "execution_file: '$EXEC_FILE'"
          if [ -z "$OUT_TOKEN" ]; then
            echo "FAIL: github_token output is empty"
            exit 1
          fi
          if [ "$OUT_TOKEN" != "$IN_TOKEN" ]; then
            echo "FAIL: github_token output does not match the provided token"
            exit 1
          fi
          if [ -n "$CONCLUSION" ] || [ -n "$SESSION" ] || [ -n "$EXEC_FILE" ]; then
            echo "FAIL: Claude should not have run without a prompt"
            exit 1
          fi
          echo "PASS"
