name: Test no prompt skips execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
      - name: Assert github_token output echoes provided token and Claude did not run
        env:
          OUT_TOKEN: ${{ steps.action.outputs.github_token }}
          IN_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXEC_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "conclusion: '$CONCLUSION'"
          echo "execution_file: '$EXEC_FILE'"
          if [ -z "$OUT_TOKEN" ]; then
            echo "FAIL: github_token output is empty"
            exit 1
          fi
          if [ "$OUT_TOKEN" != "$IN_TOKEN" ]; then
            echo "FAIL: github_token output does not match the provided token"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: expected no conclusion when there is no trigger/prompt"
            exit 1
          fi
          if [ -n "$EXEC_FILE" ]; then
            echo "FAIL: expected no execution file when Claude was skipped"
            exit 1
          fi
          echo "PASS"
