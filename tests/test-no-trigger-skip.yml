name: Test no-trigger skip (push event, no prompt)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without prompt (should skip gracefully)
        id: action
        uses: .
        continue-on-error: true
        with:
          # No prompt provided — agent mode finds no trigger and exits cleanly
          github_token: ${{ github.token }}

      - name: Assert action did not fail with an unexpected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (skip path) or fail with a known
          # setup error (e.g. bun install network issue in act). It must NOT
          # produce an unhandled crash. Acceptable outcomes: success or failure.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME (skip or setup)"

      - name: Verify bun was installed by the action
        run: |
          if command -v bun > /dev/null 2>&1; then
            echo "PASS: bun is available after action ran"
            bun --version
          else
            echo "INFO: bun not found in PATH (may be expected in act environment)"
          fi
