name: Test no-trigger graceful skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with no prompt and no API key.
      # For workflow_dispatch with no prompt, containsTrigger is false → action
      # should skip gracefully (set github_token output and return, no error).
      - id: action
        uses: .
        with:
          prompt: ""
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action did not fail
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action should have skipped gracefully but failed"
            exit 1
          fi
          echo "PASS: action skipped gracefully (outcome=$OUTCOME)"
