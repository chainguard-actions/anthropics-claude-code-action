name: Test no-trigger skip (workflow_dispatch without prompt)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with no prompt — it should detect agent mode,
      # find no trigger (no prompt), log "No trigger found, skipping remaining steps",
      # and exit successfully without needing an API key.
      # github_token is provided to bypass the OIDC token exchange with Anthropic.
      - id: action
        uses: .
        with:
          trigger_phrase: "@claude"
          github_token: ${{ github.token }}
          # No prompt provided — action should skip gracefully

      - name: Assert action completed (no trigger skip path)
        run: |
          echo "Action completed without error — no-trigger skip path works"
          echo "PASS"
