name: Test no trigger skips gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with no prompt and no trigger phrase match.
      # In workflow_dispatch mode with no prompt, the action should detect
      # no trigger and exit cleanly (setting github_token output but not calling Claude).
      - id: action
        uses: .
        continue-on-error: true
        with:
          # No anthropic_api_key and no prompt — action should skip cleanly
          trigger_phrase: "@claude"
          # No prompt means no trigger found → action exits early

      - name: Assert action ran (skipped or failed gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # The action should either:
          # 1. succeed (skipped due to no trigger) — conclusion will be empty or unset
          # 2. fail gracefully (no API key / sentinel repo) — outcome=failure
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action skipped cleanly (no trigger found)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
