name: Test OAuth and federation inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # No prompt — action will skip cleanly, but all inputs should be accepted
          github_token: ${{ github.token }}
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"
          anthropic_federation_rule_id: "fdrl_fake_rule_id"
          anthropic_oidc_audience: "https://api.anthropic.com"
          anthropic_organization_id: "fake-org-uuid-for-input-coverage"
          anthropic_service_account_id: "svac_fake_service_account"
          anthropic_workspace_id: "wrkspc_fake_workspace"
          trigger_phrase: "@claude"

      - name: Assert action accepted all federation inputs and skipped cleanly
        env:
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
        run: |
          echo "execution_file: '$EXECUTION_FILE'"
          # No trigger → no execution file should be produced
          if [ -n "$EXECUTION_FILE" ]; then
            echo "FAIL: expected empty execution_file but got: $EXECUTION_FILE"
            exit 1
          fi
          echo "PASS: action accepted claude_code_oauth_token, anthropic_federation_rule_id, anthropic_oidc_audience, anthropic_organization_id, anthropic_service_account_id, anthropic_workspace_id and skipped cleanly"
