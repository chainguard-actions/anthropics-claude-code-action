name: Test OAuth token auth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: "fake-oauth-token-for-coverage-testing"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (inputs accepted, failed gracefully without valid OAuth token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without valid OAuth token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
