name: Test Claude Code OAuth Token Auth Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: dummy-oauth-token-for-input-coverage
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (claude_code_oauth_token input accepted)
        run: |
          # The action will fail due to invalid OAuth token, but the input must be accepted.
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: claude_code_oauth_token input was accepted by the action"
