name: Test Claude Code OAuth token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage-testing"
          # Fake OAuth token — action should fail gracefully at auth stage

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake OAuth token rejected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$CONCLUSION" ]; then
              echo "WARN: conclusion output is empty on success"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
