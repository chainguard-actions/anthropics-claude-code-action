name: Test Claude Code OAuth Token Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: "test-oauth-token-invalid"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed with continue-on-error"
          echo "The claude_code_oauth_token input was accepted by the action"
          echo "PASS: claude_code_oauth_token input covered"
