name: Test claude_code_oauth_token input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with claude_code_oauth_token (fake token)
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage-testing"
          prompt: "Say hello"

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a fake OAuth token, the action should fail at API validation,
          # not crash with an unhandled error (cancelled).
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME (expected failure with fake OAuth token)"
