name: Test Claude Code OAuth token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          claude_code_oauth_token: "test-oauth-token-invalid-for-coverage"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action ran (oauth token input was accepted)
        run: |
          # The action will fail due to invalid OAuth token,
          # but the input must be accepted without a setup/parse error
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: claude_code_oauth_token input was accepted by the action"
