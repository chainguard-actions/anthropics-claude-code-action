name: Test action output structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo: hello world"
          display_report: "false"
          show_full_output: "false"
          # No anthropic_api_key — action will fail gracefully

      - name: Assert outputs are defined or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "execution_file: $EXECUTION_FILE"
          echo "session_id: $SESSION_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # On success, conclusion must be set
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            if [ "$CONCLUSION" != "success" ] && [ "$CONCLUSION" != "failure" ]; then
              echo "FAIL: conclusion must be 'success' or 'failure', got: $CONCLUSION"
              exit 1
            fi
            echo "PASS: conclusion='$CONCLUSION', execution_file='$EXECUTION_FILE'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
