name: Test - Action outputs structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Echo test"
          # No API key — action will fail, but outputs should still be accessible

      - name: Assert outputs are accessible
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.action.outputs.execution_file }}
          BRANCH_NAME: ${{ steps.action.outputs.branch_name }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "execution_file: $EXECUTION_FILE"
          echo "branch_name: $BRANCH_NAME"
          echo "session_id: $SESSION_ID"
          # The action either succeeds or fails gracefully
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key) — outputs are accessible (may be empty)"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded, conclusion should be 'success'
            if [ "$CONCLUSION" = "success" ]; then
              echo "PASS: action succeeded with conclusion=success"
            else
              echo "PASS: action succeeded (conclusion may be empty or set)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
