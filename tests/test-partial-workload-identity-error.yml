name: Test partial workload identity federation fails with clear error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake GitHub event payload for workflow_dispatch
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/event.json <<'EOF'
          {
            "repository": {
              "name": "test-repo",
              "full_name": "test-owner/test-repo",
              "owner": {
                "login": "test-owner"
              },
              "default_branch": "main"
            },
            "sender": {
              "login": "test-user"
            },
            "workflow": ".github/workflows/test.yml"
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/event.json" >> $GITHUB_ENV

      # Run the action with only anthropic_federation_rule_id set (missing anthropic_organization_id).
      # The validate-env.ts check should fail with a partial workload identity error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Say hello"
          anthropic_federation_rule_id: "fdrl_fake_rule_id"
        env:
          GITHUB_EVENT_NAME: workflow_dispatch

      - name: Assert action failed due to partial workload identity config
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to partial workload identity config, but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when only one workload identity field was provided"
