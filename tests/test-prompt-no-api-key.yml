name: Test prompt provided but no API key - graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide a prompt to trigger the action
          prompt: "Say hello"
          # No anthropic_api_key provided — action should fail at credential validation
          github_token: ${{ github.token }}

      - name: Assert action failed gracefully without API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because no API key is provided
          # (it will fail at validateEnvironmentVariables or when calling the API)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected without API credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a test failure - may have found credentials in env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
