name: Test prompt with no API key - graceful failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          prompt: "Say hello"
          # No anthropic_api_key provided → action should fail gracefully
        continue-on-error: true

      - name: Assert action failed gracefully (no API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key, the action must fail (not be skipped).
          # It should fail gracefully rather than crashing the runner.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded (e.g. no trigger detected), that's also acceptable
            echo "PASS: action succeeded (no trigger detected or prompt not processed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
