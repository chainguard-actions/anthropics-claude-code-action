name: Test prompt without API key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Provide a prompt to trigger agent mode, but no API key.
          # The action should fail at environment validation with a clear error.
          prompt: "Say hello"
        continue-on-error: true
      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key, the action must fail (not succeed silently).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without API key"
          elif [ "$OUTCOME" = "success" ]; then
            # If conclusion is empty or failure, that's also acceptable
            if [ "$CONCLUSION" = "failure" ] || [ -z "$CONCLUSION" ]; then
              echo "PASS: action reported failure conclusion"
            else
              echo "FAIL: action unexpectedly succeeded without an API key"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
