name: Test prompt without Anthropic credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake claude executable (never actually invoked successfully)
        run: |
          mkdir -p "$RUNNER_TEMP/fake-claude"
          printf '#!/bin/sh\necho "fake claude should not be used" >&2\nexit 1\n' > "$RUNNER_TEMP/fake-claude/claude"
          chmod +x "$RUNNER_TEMP/fake-claude/claude"
          echo "FAKE_CLAUDE=$RUNNER_TEMP/fake-claude/claude" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          prompt: "Say hello"
          path_to_claude_code_executable: ${{ env.FAKE_CLAUDE }}
          classify_inline_comments: "false"
      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no Anthropic credentials are configured"
            exit 1
          fi
          if [ "$CONCLUSION" = "success" ]; then
            echo "FAIL: conclusion must not be success"
            exit 1
          fi
          echo "PASS"
