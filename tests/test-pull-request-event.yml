name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Review this pull request"
          trigger_phrase: "@claude"
          use_sticky_comment: "false"
          include_fix_links: "true"
          # No API key — will fail, but tests that PR event context is accepted

      - name: Assert action failed due to missing credentials not bad inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Action should fail due to missing API key, not due to invalid inputs
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing API key), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted PR event context and failed as expected (missing API key)"
