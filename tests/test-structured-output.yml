name: Test structured output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Return a JSON object with a greeting field"
          claude_args: "--json-schema {\"type\":\"object\",\"properties\":{\"greeting\":{\"type\":\"string\"}}}"
          # No anthropic_api_key — action should fail gracefully

      - name: Assert action ran or failed gracefully in structured output mode
        env:
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          STRUCTURED_OUTPUT: ${{ steps.action.outputs.structured_output }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "structured_output: $STRUCTURED_OUTPUT"
          echo "session_id: $SESSION_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CONCLUSION" ]; then
              echo "FAIL: action succeeded but conclusion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, as expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
