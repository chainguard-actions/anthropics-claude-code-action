name: Test tag push event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/tags/v1.0.0
    steps:
      - uses: actions/checkout@v4

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Generate release notes for this tag"
          track_progress: "false"
          display_report: "false"
          show_full_output: "false"
          # No API key — will fail, but tests that tag push event context is accepted

      - name: Assert action failed due to missing credentials not bad inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing API key), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action accepted tag push event context and failed as expected (missing API key)"
