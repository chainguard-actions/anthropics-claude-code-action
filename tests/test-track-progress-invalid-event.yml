name: Test track_progress rejected on unsupported event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          track_progress: "true"
          prompt: "Say hello"
      - name: Assert action failed due to invalid track_progress event
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: '$CONCLUSION'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since track_progress is unsupported for workflow_dispatch"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: Claude should not have run"
            exit 1
          fi
          echo "PASS"
