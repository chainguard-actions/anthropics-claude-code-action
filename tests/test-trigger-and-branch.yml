name: Test assignee trigger, base branch, and oauth token inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          assignee_trigger: "claude"
          base_branch: "main"
          claude_code_oauth_token: "fake-oauth-token-for-input-coverage"

      - name: Assert action ran (inputs accepted, fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real API credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
