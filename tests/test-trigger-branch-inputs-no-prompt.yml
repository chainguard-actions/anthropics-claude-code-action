name: Test assignee trigger and base branch without prompt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          assignee_trigger: "claude-bot"
          base_branch: "main"
      - name: Assert skipped cleanly with no branch created
        env:
          OUT_TOKEN: ${{ steps.action.outputs.github_token }}
          IN_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.action.outputs.branch_name }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "branch_name: '$BRANCH'"
          echo "conclusion: '$CONCLUSION'"
          if [ "$OUT_TOKEN" != "$IN_TOKEN" ]; then
            echo "FAIL: github_token output mismatch"
            exit 1
          fi
          if [ -n "$BRANCH" ]; then
            echo "FAIL: expected no branch to be created"
            exit 1
          fi
          if [ -n "$CONCLUSION" ]; then
            echo "FAIL: expected no conclusion"
            exit 1
          fi
          echo "PASS"
