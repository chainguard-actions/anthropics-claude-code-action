name: Test trigger phrase and label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          trigger_phrase: "@mybot"
          label_trigger: "mybot"
          branch_prefix: "mybot/"
          prompt: "List files in the current directory"
          use_sticky_comment: "false"
          classify_inline_comments: "false"
          # No anthropic_api_key — action will fail at API call stage

      - name: Assert action ran with custom trigger config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          # Without an API key the action is expected to fail gracefully.
          # The important thing is it accepted the trigger/label inputs without crashing.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with conclusion='$CONCLUSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
