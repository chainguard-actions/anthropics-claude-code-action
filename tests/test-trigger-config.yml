name: Test trigger configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          trigger_phrase: "@claude"
          label_trigger: "claude"
          assignee_trigger: "claude"
          allowed_bots: ""
          include_comments_by_actor: ""
          exclude_comments_by_actor: ""
          # No API key: expect graceful failure

      - name: Assert action ran with trigger config (fails gracefully without API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (trigger config accepted, no API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with trigger config"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
