name: Test trigger configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Summarize the project"
          trigger_phrase: "@claude"
          label_trigger: "claude"
          allowed_bots: ""
          include_comments_by_actor: ""
          exclude_comments_by_actor: ""
          use_sticky_comment: "false"
          classify_inline_comments: "true"
          # No API key — action should fail gracefully

      - name: Assert action ran with trigger configuration inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
          SESSION_ID: ${{ steps.action.outputs.session_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          echo "session_id: $SESSION_ID"
          # The action must either succeed or fail — never skip
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action accepted trigger configuration inputs, outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
