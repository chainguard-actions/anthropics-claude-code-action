name: Test trigger configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Check the repository for any issues"
          trigger_phrase: "@claude"
          label_trigger: "claude"
          assignee_trigger: "claude[bot]"
          allowed_bots: ""
          include_comments_by_actor: ""
          exclude_comments_by_actor: ""
          # No API key — action will fail at Claude invocation, not at setup

      - name: Assert action accepted trigger configuration and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (conclusion=$CONCLUSION)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no API key, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
