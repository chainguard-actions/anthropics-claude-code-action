name: Test Trigger Config Inputs
on:
  workflow_dispatch:
jobs:
  test-trigger-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          assignee_trigger: "claude"
          github_token: ${{ github.token }}
          anthropic_api_key: "sk-ant-fake-key-for-input-coverage-testing"
          prompt: "Say hello"
          trigger_phrase: "@claude"
          label_trigger: "claude"
      - name: Assert action ran (fails gracefully on sentinel repo or without real API key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or without real API key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
