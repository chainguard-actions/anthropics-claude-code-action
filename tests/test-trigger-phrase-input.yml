name: Test custom trigger phrase input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom trigger phrase and no prompt
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ github.token }}
          trigger_phrase: "@mybot"
          prompt: ""
          branch_prefix: "mybot/"
          use_sticky_comment: "false"

      - name: Assert action did not crash
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a custom trigger phrase and no prompt on workflow_dispatch,
          # the action should skip gracefully or fail at API key validation.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME using custom trigger_phrase"
