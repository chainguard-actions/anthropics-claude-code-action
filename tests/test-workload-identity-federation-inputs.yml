name: Test Workload Identity Federation Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify workload identity federation inputs are accepted
        id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test_rule_id"
          anthropic_organization_id: "org-00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test_service_account"
          anthropic_workspace_id: "wrkspc_test_workspace"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"
          github_token: ${{ github.token }}
      - name: Assert action attempted with federation inputs
        run: |
          echo "Action ran with workload identity federation inputs (expected to fail without real credentials)"
          echo "PASS: all four federation inputs were accepted by the action"
