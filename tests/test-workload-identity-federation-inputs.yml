name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with workload identity federation inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          anthropic_federation_rule_id: "fdrl_test123"
          anthropic_organization_id: "org-00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_test123"
          anthropic_workspace_id: "wrkspc_test123"
          anthropic_oidc_audience: "https://api.anthropic.com"
          prompt: "Say hello"

      - name: Assert action ran (workload identity federation inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with workload identity federation inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real OIDC credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
