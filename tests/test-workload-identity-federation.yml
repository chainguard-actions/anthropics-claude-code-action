name: Test workload identity federation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          prompt: "Say hello"
          anthropic_federation_rule_id: "fdrl_fake_rule_id_for_coverage"
          anthropic_organization_id: "00000000-0000-0000-0000-000000000000"
          anthropic_service_account_id: "svac_fake_service_account_id"
          anthropic_workspace_id: "wrkspc_fake_workspace_id"
          anthropic_oidc_audience: "https://api.anthropic.com"
          # Fake federation credentials — action should fail gracefully at auth stage

      - name: Assert action ran (failed gracefully or succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.outputs.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake federation credentials rejected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            if [ -z "$CONCLUSION" ]; then
              echo "WARN: conclusion output is empty on success"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
